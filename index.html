<\/script>`),
    note:tx('<code>novalidate</code> schaltet nur die Fehlerblasen des Browsers ab – <code>required</code> und <code>checkValidity()</code> funktionieren weiter. Der Button bleibt benutzbar; Fehler zeigt das Formular nach dem Absenden.','<code>novalidate</code> only turns off the browser’s error bubbles – <code>required</code> and <code>checkValidity()</code> keep working. The button stays usable; the form shows errors after submitting.')},
  native:tx('Zum großen Teil ja: <code>required</code>, <code>disabled</code>, <code>readonly</code>, <code>type="email"</code> und <code>autocomplete</code> sind reines HTML und landen ohne ARIA im Accessibility Tree. Auch die eingebauten Fehlerblasen des Browsers sind eine brauchbare Grundlage – aber sie verschwinden nach ein paar Sekunden, lassen sich kaum gestalten und stehen nicht dauerhaft beim Feld. Darum schalten viele Teams sie mit <code>novalidate</code> ab und bauen die Meldungen selbst. Genau dafür brauchst du dann <code>aria-invalid</code> und <code>aria-describedby</code>.','Largely, yes: <code>required</code>, <code>disabled</code>, <code>readonly</code>, <code>type="email"</code> and <code>autocomplete</code> are plain HTML and reach the accessibility tree without any ARIA. The browser’s built-in error bubbles are a usable baseline too – but they vanish after a few seconds, can hardly be styled and don’t stay next to the field. That’s why many teams switch them off with <code>novalidate</code> and build their own messages. That’s exactly when you need <code>aria-invalid</code> and <code>aria-describedby</code>.'),
  do:tx([
    'Pflichtfelder mit <code>required</code> markieren und sichtbar kennzeichnen – das Sternchen mit <code>aria-hidden="true"</code>, erklärt am Formularanfang.',
    '<code>aria-invalid</code> erst nach dem Absenden (oder beim Verlassen des Feldes) setzen und entfernen, sobald der Fehler behoben ist.',
    'Die Fehlermeldung als sichtbaren Text beim Feld zeigen, per <code>aria-describedby</code> verknüpfen und sagen, wie es richtig geht.',
    'Nach dem Absenden den Fokus ins erste fehlerhafte Feld setzen – bei langen Formularen auf eine Fehlerliste mit Links.',
    'Buttons möglichst nicht sperren. Wenn doch: <code>aria-disabled="true"</code> plus Begründung per <code>aria-describedby</code>.'
  ],[
    'Mark required fields with <code>required</code> and show it visibly – the asterisk with <code>aria-hidden="true"</code>, explained at the top of the form.',
    'Set <code>aria-invalid</code> only after submitting (or on leaving the field) and remove it once the error is fixed.',
    'Show the error message as visible text next to the field, link it with <code>aria-describedby</code> and say how to get it right.',
    'After submitting, move focus to the first invalid field – for long forms to an error summary with links.',
    'Avoid disabling buttons. If you must: <code>aria-disabled="true"</code> plus the reason via <code>aria-describedby</code>.'
  ]),
  dont:tx([
    '<code>aria-invalid="true"</code> schon beim Laden oder bei jedem Tastendruck – dann hört man „ungültige Eingabe“ auf einem Feld, das man noch gar nicht angefasst hat.',
    'Fehler nur mit rotem Rahmen zeigen.',
    'Sich allein auf <code>aria-errormessage</code> verlassen – viele Screenreader lesen es nicht vor.',
    '<code>aria-disabled</code> setzen und vergessen, die Aktion im Klick-Handler zu verhindern.',
    '<code>disabled</code> auf den Button setzen, der gerade den Fokus hat – der Fokus fällt dann auf die Seite zurück.'
  ],[
    '<code>aria-invalid="true"</code> on page load or on every keystroke – then people hear “invalid entry” on a field they haven’t even touched.',
    'Showing errors only with a red border.',
    'Relying on <code>aria-errormessage</code> alone – many screen readers don’t read it.',
    'Setting <code>aria-disabled</code> and forgetting to block the action in the click handler.',
    'Setting <code>disabled</code> on the button that currently has focus – focus then falls back to the page.'
  ]),
  ng:tx('<p>Angular setzt auf jedes <code>&lt;form&gt;</code> automatisch <code>novalidate</code> (außer du schreibst <code>ngNativeValidate</code>). Die Formularmodule vergeben aber nur CSS-Klassen wie <code>ng-invalid</code> und <code>ng-touched</code> – <strong>keine</strong> ARIA-Attribute. <code>aria-invalid</code> und <code>aria-describedby</code> bindest du selbst mit <code>[attr.…]</code>. Angular Material nimmt dir das ab: <code>matInput</code> in einem <code>mat-form-field</code> setzt <code>aria-invalid</code> (sobald das Feld berührt oder das Formular abgesendet wurde), <code>aria-required</code> und verknüpft <code>mat-error</code> und <code>mat-hint</code> per <code>aria-describedby</code>. Den Fokus nach dem Absenden setzt du erst, wenn Angular gerendert hat – mit <code>afterNextRender()</code>.</p>','<p>Angular adds <code>novalidate</code> to every <code>&lt;form&gt;</code> automatically (unless you write <code>ngNativeValidate</code>). But the forms modules only set CSS classes like <code>ng-invalid</code> and <code>ng-touched</code> – <strong>no</strong> ARIA attributes. You bind <code>aria-invalid</code> and <code>aria-describedby</code> yourself with <code>[attr.…]</code>. Angular Material does it for you: <code>matInput</code> inside a <code>mat-form-field</code> sets <code>aria-invalid</code> (once the field was touched or the form submitted), <code>aria-required</code>, and links <code>mat-error</code> and <code>mat-hint</code> via <code>aria-describedby</code>. Move focus after submitting only once Angular has rendered – with <code>afterNextRender()</code>.</p>'),
  ngCode:`@Component({
  selector: 'app-contact-form',
  imports: [ReactiveFormsModule],
  template: \`
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email">Email <span aria-hidden="true">*</span></label>
      <input #emailInput id="email" type="email" formControlName="email"
             required autocomplete="email"
             [attr.aria-invalid]="showError() || null"
             [attr.aria-describedby]="showError() ? 'email-err email-hint' : 'email-hint'">
      <p id="email-err" class="err">
        @if (showError()) { Please enter a valid email address. }
      </p>
      <p id="email-hint">We'll send the order confirmation here.</p>
      <button type="submit">Next</button>
    </form>
  \`,
})
export class ContactForm {
  private readonly injector = inject(Injector);
  private readonly emailInput = viewChild.required<ElementRef<HTMLInputElement>>('emailInput');
  private readonly submitted = signal(false);
  protected readonly form = inject(FormBuilder).nonNullable.group({
    email: ['', [Validators.required, Validators.email]],
  });

  protected showError() {
    return this.submitted() && this.form.controls.email.invalid;
  }

  protected submit() {
    this.submitted.set(true);
    if (this.form.invalid) {
      afterNextRender(() => this.emailInput().nativeElement.focus(), { injector: this.injector });
      return;
    }
    // send …
  }
}`,
  why:tx('<p>Nach dem Absenden landet der Fokus im E-Mail-Feld, und man hört: „E-Mail, Eingabefeld, ungültige Eingabe, erforderlich, Bitte gib deine E-Mail-Adresse ein. Hierhin schicken wir die Bestellbestätigung.“ Feld, Problem und Lösung in einem Atemzug. Ohne Verknüpfung heißt es nur „E-Mail, Eingabefeld“ – die rote Meldung darunter bleibt unbemerkt, und die Nutzerin wundert sich, warum nichts passiert.</p><p>Beim gesperrten Button zeigt sich der Unterschied mit der <kbd>Tab</kbd>-Taste: Einen <code>disabled</code>-Button überspringt der Fokus – wer so durchs Formular geht, erfährt nicht einmal, dass es ihn gibt. Mit <code>aria-disabled</code> hört man „Bestellung absenden, Schalter, nicht verfügbar, Verfügbar, sobald Schritt 1 gültig ist.“ – der Grund kommt gleich mit.</p>','<p>After submitting, focus lands in the email field and you hear: “Email, edit, invalid entry, required, Please enter your email address. We’ll send the order confirmation here.” Field, problem and fix in one breath. Without the link it’s just “Email, edit” – the red message below goes unnoticed, and the user wonders why nothing happens.</p><p>With the disabled button, the <kbd>Tab</kbd> key shows the difference: focus skips a <code>disabled</code> button – someone tabbing through the form doesn’t even learn it exists. With <code>aria-disabled</code> you hear “Place order, button, unavailable, Available once step 1 is valid.” – the reason comes right along.</p>')
});

  attrs:[
    ['<fieldset> + <legend>','',tx('Implizit <code>role="group"</code>, der Name kommt aus der <code>&lt;legend&gt;</code>. Erste Wahl für Radio-Buttons und zusammengehörige Checkboxen.','Implicitly <code>role="group"</code>, the name comes from the <code>&lt;legend&gt;</code>. First choice for radio buttons and related checkboxes.')],
    ['role="group"','',tx('Gruppe ohne <code>&lt;fieldset&gt;</code>, etwa für eine Reihe von Buttons. Braucht einen Namen, sonst ist sie nur eine stumme Klammer.','A group without <code>&lt;fieldset&gt;</code>, for instance a row of buttons. Needs a name, otherwise it’s just a silent bracket.')],

    ['role="list"','',tx('Auf <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> mit <code>list-style:none</code>: Safari mit VoiceOver behandelt sie sonst oft nicht mehr als Liste.','On <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> with <code>list-style:none</code>: otherwise Safari with VoiceOver often stops treating them as a list.')],
    ['aria-level','1 – 6',tx('Nur zusammen mit <code>role="heading"</code> auf einem Element, das kein <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code> sein kann. Bei echten Überschriften steckt die Ebene schon im Tag.','Only together with <code>role="heading"</code> on an element that can’t be an <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code>. Real headings carry the level in the tag already.')]
  ],
  demo:`<div class="groups-grid">

<p class="demo-note">${tx('<kbd>Tab</kbd> in jede Spalte und wechsle mit <kbd>↑</kbd> <kbd>↓</kbd> die Option. Unter jeder Spalte steht, was NVDA beim Betreten ungefähr sagt: Links fehlt „Versandart“ – die Frage kommt nie an. Stell den Inspektor auf „Baum“: Nur rechts hängen die Felder unter einer benannten <code>group</code>.','<kbd>Tab</kbd> into each column and change the option with <kbd>↑</kbd> <kbd>↓</kbd>. Below each column you see roughly what NVDA says on entering: on the left “Shipping method” is missing – the question never arrives. Set the inspector to “Tree”: only on the right do the fields hang under a named <code>group</code>.')}</p>`,
  init(root){
    const hint=tx('Tab hinein – hier steht, was NVDA ungefähr sagt.','Tab in – this shows roughly what NVDA says.');
    $$('.groups-say',root).forEach(p=>{p.textContent=hint});
    const text=el=>(el?.textContent||'').replace(/\s+/g,' ').trim();
    const say=el=>{
      const col=el.closest?.('.groups-col');if(!col)return;
      const g=el.closest('fieldset,[role="group"],[role="radiogroup"]');
      let gname='';
      if(g)gname=g.localName==='fieldset'?text(g.querySelector('legend')):(g.getAttribute('aria-label')||text($('#'+g.getAttribute('aria-labelledby'),root)));
      let parts=[];
      if(el.type==='radio'){
        const peers=$$(`input[name="${el.name}"]`,root);
        parts=[text($(`label[for="${el.id}"]`,root)),tx('Auswahlschalter','radio button'),el.checked?tx('aktiviert','checked'):tx('nicht aktiviert','not checked'),tx(`${peers.indexOf(el)+1} von ${peers.length}`,`${peers.indexOf(el)+1} of ${peers.length}`)];

        parts=[text(el),tx('Schalter','button'),el.getAttribute('aria-pressed')==='true'?tx('gedrückt','pressed'):tx('nicht gedrückt','not pressed')];
      }else return;
      if(gname)parts.unshift(gname+', '+tx('Gruppierung','grouping'));
      $('.groups-say',col).textContent=tx('„','“')+parts.join(', ')+tx('“','”');
    };
    root.addEventListener('focusin',e=>say(e.target));
    root.addEventListener('change',e=>say(e.target));
    $$('.groups-btns .btn',root).forEach(b=>b.addEventListener('click',()=>{b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));say(b)}));
  },

    note:tx('Beim Hineintabben hört man nur „Standard, Auswahlschalter, aktiviert, 1 von 3“ – wofür, bleibt offen. Und die „Liste“ ist für den Screenreader bloß Text: kein „Liste mit 2 Einträgen“.','Tabbing in, you only hear “Standard, radio button, checked, 1 of 3” – for what, nobody knows. And the “list” is just text to the screen reader: no “list with 2 items”.')},

    note:tx('<code>role="list"</code> auf einer <code>&lt;ul&gt;</code> ist eigentlich doppelt – hier aber eine bewusste Ausnahme, weil <code>.plain</code> die Aufzählungszeichen entfernt und Safari sonst die Liste verschluckt.','<code>role="list"</code> on a <code>&lt;ul&gt;</code> is technically redundant – but a deliberate exception here, because <code>.plain</code> removes the bullets and Safari would otherwise swallow the list.')},
  native:tx('Ja, fast immer: <code>&lt;fieldset&gt;</code>/<code>&lt;legend&gt;</code> für Formularfelder, <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> für Listen, <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code> für Überschriften. <code>role="group"</code> brauchst du nur, wo <code>&lt;fieldset&gt;</code> nicht hinpasst – Button-Reihen außerhalb eines Formulars oder Gruppen in Menüs und Listboxen. <code>role="radiogroup"</code> nur für selbst gebaute Radios, <code>role="heading"</code> mit <code>aria-level</code> nur, wenn du das Markup nicht ändern kannst. Styling ist keine Ausrede mehr: <code>fieldset{border:0;padding:0;margin:0;min-width:0}</code> macht es unsichtbar.','Yes, almost always: <code>&lt;fieldset&gt;</code>/<code>&lt;legend&gt;</code> for form fields, <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> for lists, <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code> for headings. You only need <code>role="group"</code> where <code>&lt;fieldset&gt;</code> doesn’t fit – rows of buttons outside a form, or groups inside menus and listboxes. <code>role="radiogroup"</code> only for custom radios, <code>role="heading"</code> with <code>aria-level</code> only when you can’t change the markup. Styling is no excuse anymore: <code>fieldset{border:0;padding:0;margin:0;min-width:0}</code> makes it invisible.'),
  do:tx([
    'Radio-Buttons und zusammengehörige Checkboxen immer in ein <code>&lt;fieldset&gt;</code> mit <code>&lt;legend&gt;</code>.',
    'Die <code>&lt;legend&gt;</code> kurz halten – manche Screenreader lesen sie vor jedem Feld der Gruppe.',

  ],[
    'Always put radio buttons and related checkboxes in a <code>&lt;fieldset&gt;</code> with a <code>&lt;legend&gt;</code>.',
    'Keep the <code>&lt;legend&gt;</code> short – some screen readers read it before every field in the group.',

  dont:tx([
    'Ein <code>&lt;fieldset&gt;</code> um ein einzelnes Feld oder um das ganze Formular – dann gruppiert es nichts mehr.',
    '<code>role="group"</code> ohne Namen – der Screenreader hat nichts, was er ansagen könnte.',
    '<code>&lt;div role="heading" aria-level="2"&gt;</code>, wo ein <code>&lt;h2&gt;</code> ginge.',
    'Überschriften-Ebenen überspringen, nur weil <code>&lt;h4&gt;</code> kleiner aussieht.',
    'Listen aus <code>&lt;div&gt;</code>s bauen – dann fehlt „Liste mit 5 Einträgen“.'
  ],[
    'A <code>&lt;fieldset&gt;</code> around a single field or around the entire form – then it groups nothing.',
    '<code>role="group"</code> without a name – the screen reader has nothing to announce.',
    '<code>&lt;div role="heading" aria-level="2"&gt;</code> where an <code>&lt;h2&gt;</code> would do.',
    'Skipping heading levels just because <code>&lt;h4&gt;</code> looks smaller.',
    'Building lists from <code>&lt;div&gt;</code>s – then “list with 5 items” is missing.'
  ]),
  ng:tx('<p>Die Gruppe im Formular-Modell ist nicht die Gruppe im Template: <code>formGroupName</code> ordnet nur Daten zu und bringt keinerlei Semantik – <code>&lt;fieldset&gt;</code> und <code>&lt;legend&gt;</code> schreibst du trotzdem selbst. Praktisch: <code>&lt;fieldset [disabled]&gt;</code> deaktiviert alle Felder darin auf einmal. Angular Material setzt bei <code>&lt;mat-radio-group&gt;</code> <code>role="radiogroup"</code> selbst, aber keinen Namen – den gibst du per <code>aria-labelledby</code> auf eine sichtbare Beschriftung.</p>','<p>The group in the form model is not the group in the template: <code>formGroupName</code> only maps data and carries no semantics at all – you still write <code>&lt;fieldset&gt;</code> and <code>&lt;legend&gt;</code> yourself. Handy: <code>&lt;fieldset [disabled]&gt;</code> disables every field inside at once. Angular Material sets <code>role="radiogroup"</code> on <code>&lt;mat-radio-group&gt;</code> itself, but no name – you add it via <code>aria-labelledby</code> pointing at a visible label.</p>'),
  ngCode:`@Component({
  selector: 'app-shipping',
  imports: [ReactiveFormsModule, MatRadioModule],
  template: \`
    <form [formGroup]="form">
      <fieldset>
        <legend>Shipping method</legend>

          <label>
            <input type="radio" formControlName="shipping" [value]="option.value">
            {{ option.label }}
          </label>
        }
      </fieldset>

      <\!-- Material sets role="radiogroup" – the name is up to you -->
      <p id="wrap-label">Gift wrap</p>
      <mat-radio-group formControlName="wrap" aria-labelledby="wrap-label">
        <mat-radio-button value="none">None</mat-radio-button>
        <mat-radio-button value="paper">Paper</mat-radio-button>
      </mat-radio-group>
    </form>
  \`,

export class Shipping {
  protected readonly options = [
    { value: 'std', label: 'Standard' },
    { value: 'exp', label: 'Express' },
  ];
  protected readonly form = inject(FormBuilder).nonNullable.group({ shipping: 'std', wrap: 'none' });
}`,
  why:tx('<p>Ein Screenreader liest Formulare nicht von oben nach unten wie einen Text, sondern springt mit <kbd>Tab</kbd> von Feld zu Feld. Alles, was nicht Feld, Label oder Gruppenname ist, fällt dabei unter den Tisch. Mit <code>&lt;fieldset&gt;</code> hört man beim Hineinspringen „Versandart, Gruppierung, Standard, Auswahlschalter, aktiviert, 1 von 3“. Ohne hört man nur „Standard …“ – und stehen zwei Fragen mit „Ja“ und „Nein“ untereinander, weiß niemand mehr, zu welcher Frage das „Ja“ gehört.</p><p>Listen und Überschriften sind dieselbe Idee eine Ebene höher: „Liste mit 4 Einträgen“ sagt vorab, wie viel kommt, und Überschriften sind die häufigste Art, eine Seite zu überfliegen – NVDA springt mit <kbd>H</kbd> von einer zur nächsten, mit <kbd>1</kbd>–<kbd>6</kbd> zu einer bestimmten Ebene. Wer die Ebenen nach Optik statt nach Gliederung wählt, baut ein falsches Inhaltsverzeichnis.</p>','<p>A screen reader doesn’t read forms top to bottom like prose – it jumps from field to field with <kbd>Tab</kbd>. Anything that isn’t a field, a label or a group name falls through the cracks. With <code>&lt;fieldset&gt;</code> you hear on entering: “Shipping method, grouping, Standard, radio button, checked, 1 of 3”. Without it you only hear “Standard …” – and when two questions with “Yes” and “No” sit on top of each other, nobody knows which question the “Yes” belongs to.</p><p>Lists and headings are the same idea one level up: “list with 4 items” tells you up front how much is coming, and headings are the most common way to skim a page – NVDA jumps from one to the next with <kbd>H</kbd>, and to a specific level with <kbd>1</kbd>–<kbd>6</kbd>. Picking levels by looks instead of by outline builds a false table of contents.</p>')
});

  keys:'hidden aria-hidden inert sr-only visually-hidden display none visibility opacity verstecken ausblenden unsichtbar screenreader tastatur fokus',
  refs:['WAI-ARIA 1.2: aria-hidden','HTML: hidden, inert','WCAG 1.3.1','WCAG 2.4.3, 2.4.7'],
  rule:tx('Frag zuerst: <strong>vor wem</strong> soll etwas versteckt sein? Vor allen → <code>hidden</code>. Nur vor den Augen → <code>.sr-only</code>. Nur vor dem Screenreader → <code>aria-hidden="true"</code>, aber nie auf etwas Fokussierbarem. Sichtbar, aber nicht bedienbar → <code>inert</code>.','Ask first: hidden <strong>from whom</strong>? From everyone → <code>hidden</code>. Only from the eyes → <code>.sr-only</code>. Only from the screen reader → <code>aria-hidden="true"</code>, but never on anything focusable. Visible but not operable → <code>inert</code>.'),
  attrs:[
    ['hidden','',tx('HTML-Attribut, wirkt wie <code>display:none</code>: weg für Augen, Screenreader und Tastatur. Gleich wirken <code>display:none</code> und <code>visibility:hidden</code> im CSS.','HTML attribute, works like <code>display:none</code>: gone for eyes, screen reader and keyboard. <code>display:none</code> and <code>visibility:hidden</code> in CSS do the same.')],
    ['.sr-only','CSS',tx('Visuell versteckt, aber im Accessibility Tree. Für Zusatztext wie „(öffnet in neuem Tab)“. Fokussierbares darin bekommt trotzdem den Fokus – unsichtbar.','Visually hidden but in the accessibility tree. For extra text like “(opens in a new tab)”. Anything focusable inside still receives focus – invisibly.')],
    ['aria-hidden','true',tx('Nimmt das Element samt allen Kindern aus dem Accessibility Tree, sichtbar bleibt es. Für Deko-Icons und doppelte Informationen. Der Tastaturfokus bleibt möglich – darum nie auf Fokussierbares.','Removes the element and all its children from the accessibility tree; it stays visible. For decorative icons and duplicated information. Keyboard focus is still possible – so never on anything focusable.')],
    ['inert','',tx('HTML-Attribut: nicht fokussierbar, nicht klickbar, nicht im Accessibility Tree – aber sichtbar. Für den Hintergrund hinter einem Dialog oder einem offenen Off-Canvas-Menü.','HTML attribute: not focusable, not clickable, not in the accessibility tree – but visible. For the background behind a dialog or an open off-canvas menu.')]
  ],
  demo:`<fieldset class="seg hidden-seg"><legend>${tx('Technik','Technique')}</legend><div class="seg-opts">
  ${[['none',tx('Sichtbar','Visible')],['hidden','hidden'],['sr','.sr-only'],['aria','aria-hidden'],['inert','inert'],['opacity','opacity:0']].map(([v,t],i)=>`<label><input type="radio" name="hidden-tech" value="${v}"${i?'':' checked'}>${t}</label>`).join('')}
</div></fieldset>
<div class="hidden-grid">
  <div>
    <div class="hidden-stage">
      <div class="hidden-card" id="hidden-card">
        <p class="hidden-card-t">${ic('bell')} ${tx('Neu: Lieferung am selben Tag','New: same-day delivery')}</p>
        <button type="button" class="btn btn-secondary" id="hidden-btn">${tx('Mehr erfahren','Learn more')}</button>
      </div>
    </div>
    <p class="hidden-codeline"><code id="hidden-code"></code></p>
    <p class="hidden-clicks" id="hidden-clicks"></p>
  </div>
  <div>
    <p class="hidden-cap">${tx('Wer bekommt die Karte mit?','Who gets the card?')}</p>
    <ul class="hidden-matrix" id="hidden-matrix"></ul>
    <p class="hidden-sum" id="hidden-sum"></p>
  </div>
</div>
<p class="demo-note">${tx('Wähl eine Technik und drück dann <kbd>Tab</kbd>: Landet der Fokus auf „Mehr erfahren“? Stell den Inspektor auf „Baum“ – ist die Karte noch da? Bei <code>opacity:0</code> klick in die leere Fläche. Das Abblenden bei <code>inert</code> ist eigenes CSS; <code>inert</code> selbst ändert nichts am Aussehen.','Pick a technique, then press <kbd>Tab</kbd>: does focus land on “Learn more”? Set the inspector to “Tree” – is the card still there? With <code>opacity:0</code>, click into the empty area. The dimming with <code>inert</code> is custom CSS; <code>inert</code> itself doesn’t change how things look.')}</p>`,
  init(root){
    const card=$('#hidden-card',root),code=$('#hidden-code',root),mx=$('#hidden-matrix',root),sum=$('#hidden-sum',root),out=$('#hidden-clicks',root);
    let clicks=0;
    const see=tx('sichtbar','visible'),gone=tx('weg','gone'),reads=tx('liest vor','reads it out'),reach=tx('Button erreichbar','button reachable'),noreach=tx('nicht erreichbar','not reachable');
    const T={
      none:{c:'<div class="card">',v:[[1,see],[1,reads],[1,reach]],s:tx('Normalzustand: für alle da.','Normal state: there for everyone.')},
      hidden:{c:'<div class="card" hidden>',v:[[0,gone],[0,gone],[0,noreach]],s:tx('hidden: weg für alle. Richtig für zugeklappte Inhalte, inaktive Tab-Panels und geschlossene Menüs.','hidden: gone for everyone. Right for collapsed content, inactive tab panels and closed menus.')},
      sr:{c:'<div class="card sr-only">',v:[[0,gone],[1,reads],['w',tx('erreichbar – aber der Fokus ist unsichtbar','reachable – but the focus is invisible')]],s:tx('.sr-only: nur für den Screenreader da. Gut für Zusatztext, aber nichts Fokussierbares hineinpacken – außer es wird beim Fokus sichtbar wie ein Skip-Link.','.sr-only: only there for the screen reader. Good for extra text, but don’t put anything focusable inside – unless it becomes visible on focus, like a skip link.')},
      aria:{c:'<div class="card" aria-hidden="true">',v:[[1,see],[0,tx('schweigt','silent')],['w',tx('erreichbar – der Screenreader sagt aber nichts','reachable – but the screen reader says nothing')]],s:tx('aria-hidden: nur für den Screenreader weg. Hier ein Fehler: Der Button bekommt weiter den Fokus, aber der Screenreader schweigt. Richtig nur für Deko ohne Fokus.','aria-hidden: gone only for the screen reader. A bug here: the button still receives focus, but the screen reader stays silent. Only right for decoration without focus.')},
      inert:{c:'<div class="card" inert>',v:[[1,see],[0,gone],[0,tx('nicht erreichbar, nicht klickbar','not reachable, not clickable')]],s:tx('inert: sichtbar, aber ganz stillgelegt. Richtig für den Hintergrund hinter einem Dialog oder Off-Canvas-Menü.','inert: visible, but fully switched off. Right for the background behind a dialog or off-canvas menu.')},
      opacity:{c:'<div class="card" style="opacity:0">',v:[[0,tx('unsichtbar','invisible')],[1,reads],['w',tx('erreichbar und sogar klickbar','reachable and even clickable')]],s:tx('opacity:0 versteckt nichts, es macht nur durchsichtig. Der Screenreader liest alles, Tab und Maus treffen einen unsichtbaren Button.','opacity:0 hides nothing, it only makes things transparent. The screen reader reads everything, Tab and mouse hit an invisible button.')}
    };
    const I={1:'ok',0:'xc',w:'alert'},who=[tx('Augen','Eyes'),tx('Screenreader','Screen reader'),tx('Tastatur','Keyboard')];
    const apply=(k,say)=>{
      card.hidden=k==='hidden';
      card.classList.toggle('sr-only',k==='sr');
      if(k==='aria')card.setAttribute('aria-hidden','true');else card.removeAttribute('aria-hidden');
      card.inert=k==='inert';
      card.style.opacity=k==='opacity'?'0':'';
      const t=T[k];
      code.textContent=t.c;
      mx.innerHTML=t.v.map(([v,txt],i)=>`<li class="hidden-v${v}"><span class="hidden-who">${who[i]}</span><span class="hidden-val">${ic(I[v])} ${txt}</span></li>`).join('');
      sum.textContent=t.s;
      if(say)announce(t.s);
    };
    root.addEventListener('change',e=>{if(e.target.name==='hidden-tech')apply(e.target.value,true)});
    $('#hidden-btn',root).addEventListener('click',()=>{clicks++;out.textContent=tx(`„Mehr erfahren“ ausgelöst: ${clicks}-mal`,`“Learn more” activated: ${clicks}×`)});
    apply('none',false);
  },
  css:`.hidden-seg{margin-bottom:14px}
.hidden-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;align-items:start}
.hidden-stage{position:relative;min-height:112px;padding:12px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg)}
.hidden-card{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--radius-sm);background:var(--brand-soft)}
.hidden-card[inert]{filter:grayscale(1);opacity:.55}
.hidden-card-t{margin:0;display:flex;gap:8px;align-items:center;font-weight:700}
.hidden-codeline{margin:10px 0 0;font-size:.875rem;overflow-wrap:anywhere}
.hidden-clicks{margin:6px 0 0;min-height:1.5em;font-size:.875rem;font-weight:700;color:var(--success)}
.hidden-cap{margin:0 0 8px;font-weight:700;font-size:.875rem}
.hidden-matrix{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hidden-matrix li{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:8px;align-items:center;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.hidden-who{font-weight:700}
.hidden-val{display:flex;gap:6px;align-items:flex-start}
.hidden-val .ic{width:18px;height:18px;margin-top:2px}
.hidden-v1 .hidden-val{color:var(--success)}
.hidden-v0 .hidden-val{color:var(--muted)}
.hidden-vw .hidden-val{color:var(--danger);font-weight:700}
.hidden-sum{margin:10px 0 0;font-size:.9375rem}`,
  bad:{code:tx(`<\!-- Button unter aria-hidden: Fokus landet im Nichts -->
<div class="promo" aria-hidden="true">
  Neu: Lieferung am selben Tag
  <button>Mehr erfahren</button>
</div>

<\!-- Live-Region in einem versteckten Elternelement: stumm -->
<div aria-hidden="true">
  <p role="status">3 Artikel im Warenkorb.</p>
</div>

<\!-- „versteckt“, aber lesbar und klickbar -->
<nav class="menu" style="opacity:0">…</nav>`,`<\!-- button under aria-hidden: focus lands on nothing -->
<div class="promo" aria-hidden="true">
  New: same-day delivery
  <button>Learn more</button>
</div>

<\!-- live region inside a hidden parent: silent -->
<div aria-hidden="true">
  <p role="status">3 items in cart.</p>
</div>

<\!-- “hidden”, but readable and clickable -->
<nav class="menu" style="opacity:0">…</nav>`),
    note:tx('Drei Klassiker: Fokus auf etwas, das es für den Screenreader nicht gibt; eine Meldung, die nie ankommt; ein Menü, das Sehende nicht sehen, der Screenreader aber komplett vorliest.','Three classics: focus on something that doesn’t exist for the screen reader; a message that never arrives; a menu sighted users can’t see but the screen reader reads out in full.')},
  good:{code:tx(`<\!-- Deko-Icon weg, Text dafür nur für den Screenreader -->
<a href="/warenkorb">
  <svg aria-hidden="true">…</svg>
  <span class="sr-only">Warenkorb,</span> 3
</a>

<\!-- geschlossenes Menü: weg für alle -->
<nav class="menu" hidden>…</nav>

<\!-- offenes Off-Canvas-Menü: Rest der Seite stilllegen -->
<main inert>…</main>`,`<\!-- decorative icon gone, text only for the screen reader instead -->
<a href="/cart">
  <svg aria-hidden="true">…</svg>
  <span class="sr-only">Cart,</span> 3
</a>

<\!-- closed menu: gone for everyone -->
<nav class="menu" hidden>…</nav>

<\!-- open off-canvas menu: switch off the rest of the page -->
<main inert>…</main>`),
    note:tx('Jede Technik genau für ihren Zweck: <code>aria-hidden</code> nur auf Deko ohne Fokus, <code>.sr-only</code> für Text, <code>hidden</code> für Geschlossenes, <code>inert</code> für den Hintergrund.','Each technique for exactly its purpose: <code>aria-hidden</code> only on decoration without focus, <code>.sr-only</code> for text, <code>hidden</code> for closed things, <code>inert</code> for the background.')},
  native:tx('Großteils ja: <code>hidden</code> und <code>inert</code> sind HTML, und <code>hidden</code> ist die erste Wahl für „weg für alle“. <code>inert</code> ersetzt das alte Gebastel aus <code>aria-hidden</code> plus <code>tabindex="-1"</code> auf jedem Link. Ein <code>&lt;dialog&gt;</code>, geöffnet mit <code>showModal()</code>, legt den Rest der Seite sogar von selbst still. „Nur visuell verstecken“ ist reines CSS (<code>.sr-only</code>). Nur für „nur vor dem Screenreader verstecken“ gibt es kein HTML – dafür ist <code>aria-hidden</code> da.','Mostly yes: <code>hidden</code> and <code>inert</code> are HTML, and <code>hidden</code> is the first choice for “gone for everyone”. <code>inert</code> replaces the old hack of <code>aria-hidden</code> plus <code>tabindex="-1"</code> on every link. A <code>&lt;dialog&gt;</code> opened with <code>showModal()</code> even switches off the rest of the page by itself. “Visually hidden only” is pure CSS (<code>.sr-only</code>). Only “hidden from the screen reader only” has no HTML equivalent – that’s what <code>aria-hidden</code> is for.'),
  do:tx([
    'Vor jedem Verstecken fragen: vor wem? Augen, Screenreader, Tastatur – oder allen?',
    '<code>aria-hidden="true"</code> auf Deko-Icons und auf Informationen, die gleich daneben schon als Text stehen.',
    '<code>.sr-only</code> für Text, den nur der Screenreader braucht – etwa den Namen eines Icon-Links.',
    'Hintergründe hinter Dialogen und Off-Canvas-Menüs mit <code>inert</code> stilllegen (oder gleich <code>showModal()</code> nutzen).'
  ],[
    'Before hiding anything, ask: from whom? Eyes, screen reader, keyboard – or everyone?',
    '<code>aria-hidden="true"</code> on decorative icons and on information that’s already right next to it as text.',
    '<code>.sr-only</code> for text only the screen reader needs – like the name of an icon link.',
    'Switch off backgrounds behind dialogs and off-canvas menus with <code>inert</code> (or just use <code>showModal()</code>).'
  ]),
  dont:tx([
    '<code>aria-hidden="true"</code> auf fokussierbare Elemente oder deren Eltern – der Fokus landet im Nichts.',
    '<code>aria-hidden</code> auf einem Elternelement einer Live-Region – ihre Meldungen kommen dann nie an.',
    'Mit <code>opacity:0</code>, <code>height:0</code> oder <code>left:-9999px</code> Dinge „verstecken“, die bedienbar bleiben.',
    'Mit <code>aria-hidden="false"</code> versuchen, versteckten Inhalt zurückzuholen – das hebt weder <code>hidden</code> noch ein <code>aria-hidden="true"</code> weiter oben auf.'
  ],[
    '<code>aria-hidden="true"</code> on focusable elements or their parents – focus lands on nothing.',
    '<code>aria-hidden</code> on a parent of a live region – its messages never arrive.',
    '“Hiding” things with <code>opacity:0</code>, <code>height:0</code> or <code>left:-9999px</code> that stay operable.',
    'Trying to bring hidden content back with <code>aria-hidden="false"</code> – it undoes neither <code>hidden</code> nor an <code>aria-hidden="true"</code> further up.'
  ]),
  ng:tx('<p>In Angular ist <code>@if</code> die gründlichste Form von „weg für alle“: Das Element existiert gar nicht. <code>[hidden]</code> bindet das HTML-Attribut – setzt dein CSS aber ein eigenes <code>display</code>, gewinnt das; ein globales <code>[hidden]{display:none!important}</code> hilft. <code>aria-hidden</code> und <code>inert</code> bindest du als Attribute: <code>[attr.aria-hidden]="true"</code>, <code>[attr.inert]="open() ? \'\' : null"</code> (<code>null</code> entfernt das Attribut). Das CDK bringt mit <code>cdk-visually-hidden</code> das Gegenstück zu <code>.sr-only</code> mit, und <code>&lt;mat-icon&gt;</code> setzt <code>aria-hidden="true"</code> schon selbst.</p>','<p>In Angular, <code>@if</code> is the most thorough form of “gone for everyone”: the element doesn’t exist at all. <code>[hidden]</code> binds the HTML attribute – but if your CSS sets its own <code>display</code>, that wins; a global <code>[hidden]{display:none!important}</code> helps. Bind <code>aria-hidden</code> and <code>inert</code> as attributes: <code>[attr.aria-hidden]="true"</code>, <code>[attr.inert]="open() ? \'\' : null"</code> (<code>null</code> removes the attribute). The CDK ships <code>cdk-visually-hidden</code> as the counterpart to <code>.sr-only</code>, and <code>&lt;mat-icon&gt;</code> already sets <code>aria-hidden="true"</code> by itself.</p>'),
  ngCode:`@Component({
  selector: 'app-shell',
  imports: [RouterOutlet, OffcanvasMenu],
  template: \`
    <button type="button" (click)="menuOpen.set(true)" [attr.aria-expanded]="menuOpen()">
      <svg aria-hidden="true" focusable="false">…</svg>
      <span class="cdk-visually-hidden">Menu</span>
    </button>

    @if (menuOpen()) {
      <app-offcanvas-menu (closed)="menuOpen.set(false)" />
    }

    <\!-- visible behind the open menu, but neither focusable nor announced -->
    <main [attr.inert]="menuOpen() ? '' : null">
      <router-outlet />
    </main>
  \`,
})
export class Shell {
  protected readonly menuOpen = signal(false);
}`,
  why:tx('<p>Sehende und Screenreader-Nutzer brauchen oft nicht exakt dasselbe. Ein Warenkorb-Icon mit einer „3“ soll gesprochen „Warenkorb, 3, Link“ heißen: Das Icon ist Deko (<code>aria-hidden</code>), das Wort „Warenkorb“ steht nur für den Screenreader da (<code>.sr-only</code>). Richtig eingesetzt hört man genau das Nötige – nicht mehr, nicht weniger.</p><p>Falsch eingesetzt entstehen Geisterfokus und Stille. Mit <code>aria-hidden</code> auf einem Button landet der Tab-Fokus darauf, und je nach Browser hört man nichts, nur „leer“, oder der Browser ignoriert das <code>aria-hidden</code> gleich ganz – Chrome warnt in der Konsole davor. Umgekehrt liest der Screenreader bei <code>opacity:0</code> ein ganzes Menü mit zwanzig Links vor, das Sehende nie zu Gesicht bekommen.</p>','<p>Sighted users and screen reader users often don’t need exactly the same thing. A cart icon with a “3” should be spoken as “Cart, 3, link”: the icon is decoration (<code>aria-hidden</code>), the word “Cart” exists only for the screen reader (<code>.sr-only</code>). Used right, you hear exactly what’s needed – no more, no less.</p><p>Used wrong, you get ghost focus and silence. With <code>aria-hidden</code> on a button, Tab focus lands on it, and depending on the browser you hear nothing, just “blank”, or the browser ignores the <code>aria-hidden</code> altogether – Chrome warns about it in the console. Conversely, with <code>opacity:0</code> the screen reader reads out a whole menu of twenty links sighted users never get to see.</p>')
});

LESSONS.push({
  id:'landmarks',cat:'structure',
  title:tx('Landmarks: die Orientierungspunkte einer Seite','Landmarks: the signposts of a page'),
  short:tx('Die großen Bereiche der Seite so auszeichnen, dass man direkt hinspringen kann.','Mark up the big areas of a page so people can jump straight to them.'),
  keys:'landmark landmarks orientierungspunkt banner navigation main complementary contentinfo search region form header footer nav aside section bereich sprungziel',
  refs:['WAI-ARIA 1.2: Landmark Roles','HTML-AAM: header, footer, aside, section','APG: Landmark Regions','WCAG 1.3.1, 2.4.1'],
  rule:tx('Aller sichtbare Inhalt gehört in ein Landmark – und die Landmarks kommen aus HTML: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;footer&gt;</code>, <code>&lt;search&gt;</code>. ARIA brauchst du dafür fast nie – nur einen Namen, sobald es eine Rolle mehrfach gibt.','All visible content belongs in a landmark – and the landmarks come from HTML: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;footer&gt;</code>, <code>&lt;search&gt;</code>. You almost never need ARIA for this – just a name as soon as a role appears more than once.'),
  attrs:[
    ['<header>','→ banner',tx('Kopfbereich mit Logo, Suche, Hauptmenü. Nur ein <code>banner</code>, wenn er nicht in <code>&lt;article&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;nav&gt;</code> oder <code>&lt;section&gt;</code> steckt. Einmal pro Seite.','Header area with logo, search, main menu. Only a <code>banner</code> when it isn’t inside <code>&lt;article&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;nav&gt;</code> or <code>&lt;section&gt;</code>. Once per page.')],
    ['<nav>','→ navigation',tx('Die wichtigen Navigationsblöcke. Gibt es mehrere, bekommt jeder einen Namen.','The important navigation blocks. If there are several, each one gets a name.')],
    ['<main>','→ main',tx('Der Hauptinhalt. Genau ein sichtbares <code>&lt;main&gt;</code> pro Seite – das Ziel des „Zum Inhalt springen“-Links.','The main content. Exactly one visible <code>&lt;main&gt;</code> per page – the target of the “skip to content” link.')],
    ['<aside>','→ complementary',tx('Ergänzendes, das auch für sich allein Sinn ergibt. Steckt es in <code>&lt;article&gt;</code> oder <code>&lt;section&gt;</code>, ist es nur mit Namen ein Landmark.','Supporting content that makes sense on its own. Inside <code>&lt;article&gt;</code> or <code>&lt;section&gt;</code> it’s only a landmark when it has a name.')],
    ['<footer>','→ contentinfo',tx('Fußbereich mit Impressum, Kontakt, Copyright. Dieselbe Regel wie beim <code>&lt;header&gt;</code>: nur auf oberster Ebene.','Footer area with legal notice, contact, copyright. Same rule as <code>&lt;header&gt;</code>: only at the top level.')],
    ['<search>','→ search',tx('Umschließt das Suchformular. Neu seit 2023; für ältere Browser <code>&lt;form role="search"&gt;</code>.','Wraps the search form. New since 2023; for older browsers use <code>&lt;form role="search"&gt;</code>.')],
    ['<section> / <form>','→ region / form',tx('Werden erst mit einem Namen (<code>aria-label</code>, <code>aria-labelledby</code>) zum Landmark. Ohne Namen sind sie nur Container.','Only become landmarks once they have a name (<code>aria-label</code>, <code>aria-labelledby</code>). Without one they’re just containers.')],
    ['aria-label / aria-labelledby','Text / ID',tx('Unterscheidet gleiche Landmarks: „Hauptmenü“ und „Rechtliches“. Am besten per <code>aria-labelledby</code> aus einer sichtbaren Überschrift.','Tells identical landmarks apart: “Main menu” and “Legal”. Ideally via <code>aria-labelledby</code> from a visible heading.')]
  ],
  demo:`<fieldset class="seg landmarks-seg"><legend>${tx('Markup','Markup')}</legend><div class="seg-opts">
  <label><input type="radio" name="landmarks-mode" value="div" checked>${tx('Div-Suppe','Div soup')}</label>
  <label><input type="radio" name="landmarks-mode" value="sem">${tx('Semantisches HTML','Semantic HTML')}</label>
</div></fieldset>
<div class="landmarks-grid">
  <div class="landmarks-page" id="landmarks-page"></div>
  <div class="landmarks-side">
    <p class="landmarks-cap">${tx('Landmark-Liste (wie NVDA <kbd>Einfügen</kbd>+<kbd>F7</kbd>)','Landmark list (like NVDA <kbd>Insert</kbd>+<kbd>F7</kbd>)')}</p>
    <ul class="landmarks-list" id="landmarks-list"></ul>
  </div>
</div>
<p class="demo-note">${tx('Schalte zwischen den beiden Varianten um – sie sehen gleich aus. Dann stell den Inspektor auf „Baum“: Aus der flachen Div-Suppe werden benannte Landmarks. Mit „ARIA zeigen“ siehst du, welches Element welche Rolle bekommt – und dass <code>&lt;header&gt;</code> und <code>&lt;footer&gt;</code> hier keine haben, weil die Mini-Seite in der echten Seite steckt.','Switch between the two variants – they look the same. Then set the inspector to “Tree”: the flat div soup turns into named landmarks. With “Show ARIA” you see which element gets which role – and that <code>&lt;header&gt;</code> and <code>&lt;footer&gt;</code> get none here, because the mini page sits inside the real page.')}</p>`,
  init(root){
    const page=$('#landmarks-page',root),list=$('#landmarks-list',root);
    const q=s=>tx('„','“')+esc(s)+tx('“','”');
    const build=sem=>{
      const o=(tag,cls,at='')=>sem?`<${tag} class="${cls}"${at}>`:`<div class="${cls}">`;
      const c=tag=>sem?`</${tag}>`:'</div>';
      return `${o('header','landmarks-top')}

    this.cart.add();
    this.announcer.announce(\`\${this.cart.count()} items in cart.\`, 'polite');
  }
}`,
  why:tx('<p>Sehende bemerken, dass oben rechts eine Zahl hochzählt oder ein Toast aufpoppt. Wer einen Screenreader nutzt, hört nur, was an der Fokusposition passiert – alles andere bleibt stumm. Live-Regionen sind der einzige Weg, eine Änderung anzusagen, ohne den Fokus zu verschieben.</p><p>Dass die Region vorher existieren muss, liegt an der Technik: Browser und Screenreader registrieren Live-Regionen beim Aufbau des Accessibility Trees und melden danach nur <em>Änderungen</em> darin. Ein neu eingefügter Container ist aus ihrer Sicht keine Änderung, sondern neuer Inhalt.</p>','<p>Sighted users notice a number counting up in the corner or a toast popping up. Screen reader users only hear what happens at the focus position – everything else stays silent. Live regions are the only way to announce a change without moving focus.</p><p>That the region has to exist beforehand is down to the mechanics: browsers and screen readers register live regions when building the accessibility tree and afterwards only report <em>changes</em> inside them. A newly inserted container isn’t a change from their point of view, it’s new content.</p>')
});

LESSONS.push({
  id:'menubutton',cat:'widgets',
  title:tx('Menü-Button: menu und menuitem','Menu button: menu and menuitem'),
  short:tx('Ein Button öffnet eine Liste von Aktionen – bedient mit Pfeiltasten.','A button opens a list of actions – operated with arrow keys.'),
  keys:'menü menu button menubutton menuitem aria-haspopup aria-expanded dropdown aktionen actions pfeiltasten arrow keys disclosure navigation kontextmenü',
  refs:['APG: Menu Button','APG: Menu and Menubar','APG: Disclosure Navigation Menu','WCAG 2.1.1'],
  rule:tx('<code>role="menu"</code> ist für <strong>Aktionen</strong> wie in einem Desktop-Programm: Bearbeiten, Duplizieren, Löschen. Wer diese Rolle setzt, verspricht die volle Tastaturbedienung mit Pfeiltasten. Eine Navigation mit Links ist <strong>kein Menü</strong>, sondern ein Aufklapper: Button mit <code>aria-expanded</code> und eine normale Liste von Links.','<code>role="menu"</code> is for <strong>actions</strong> like in a desktop app: edit, duplicate, delete. Setting this role promises full keyboard support with arrow keys. A navigation made of links is <strong>not a menu</strong>, it’s a disclosure: a button with <code>aria-expanded</code> and a plain list of links.'),
  attrs:[
    ['aria-haspopup','menu | true',tx('Am Button: Er öffnet ein Menü. <code>true</code> bedeutet dasselbe wie <code>menu</code>.','On the button: it opens a menu. <code>true</code> means the same as <code>menu</code>.')],
    ['aria-expanded','true | false',tx('Am Button: Ist das Menü gerade offen? Bei jedem Öffnen und Schließen umschalten.','On the button: is the menu open right now? Switch it on every open and close.')],
    ['aria-controls','ID',tx('Am Button: verweist auf das Menü.','On the button: points to the menu.')],
    ['role="menu"','',tx('Der Container der Einträge. Über <code>aria-labelledby</code> nach dem Button benannt.','The container of the items. Named after the button via <code>aria-labelledby</code>.')],
    ['role="menuitem"','',tx('Jeder Eintrag. Mit <code>tabindex="-1"</code> fokussierbar, der Fokus wird per Skript verschoben.','Each item. Focusable with <code>tabindex="-1"</code>, focus is moved by script.')],
    ['role="separator"','',tx('Optional: Trennlinie zwischen Gruppen von Einträgen.','Optional: divider between groups of items.')]
  ],
  demo:`<div class="menubutton-grid">
  <div class="menubutton-col">
    <p class="menubutton-cap">${ic('ok')} ${tx('Aktionen: role="menu"','Actions: role="menu"')}</p>
    <div class="menubutton-wrap" id="menubutton-actions">
      <button type="button" class="btn btn-secondary menubutton-btn" id="menubutton-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="menubutton-menu">${tx('Aktionen','Actions')} ${ic('down')}</button>
      <ul role="menu" class="menubutton-menu" id="menubutton-menu" aria-labelledby="menubutton-btn" hidden>
        <li role="menuitem" tabindex="-1">${ic('file')} ${tx('Bearbeiten','Edit')}</li>
        <li role="menuitem" tabindex="-1">${ic('copy')} ${tx('Duplizieren','Duplicate')}</li>
        <li role="separator" class="menubutton-sep"></li>
        <li role="menuitem" tabindex="-1" class="menubutton-danger">${ic('trash')} ${tx('Löschen','Delete')}</li>
      </ul>
    </div>
  </div>
  <div class="menubutton-col">
    <p class="menubutton-cap">${ic('ok')} ${tx('Navigation: Aufklapper, kein menu','Navigation: disclosure, no menu')}</p>
    <nav class="menubutton-wrap" id="menubutton-navwrap" aria-label="${tx('Beispiel-Shop','Example shop')}">
      <button type="button" class="btn btn-secondary menubutton-btn" id="menubutton-nav-btn" aria-expanded="false" aria-controls="menubutton-nav-list">${tx('Produkte','Products')} ${ic('down')}</button>
      <ul class="menubutton-menu menubutton-links" id="menubutton-nav-list" hidden>
        <li><a href="#menubutton">${tx('Laptops','Laptops')}</a></li>
        <li><a href="#menubutton">${tx('Monitore','Monitors')}</a></li>
        <li><a href="#menubutton">${tx('Zubehör','Accessories')}</a></li>
      </ul>
    </nav>
  </div>
</div>
<p class="menubutton-status" id="menubutton-status" role="status"></p>
<p class="demo-note">${tx('„Aktionen“: <kbd>Enter</kbd>, <kbd>Leertaste</kbd> oder <kbd>↓</kbd> öffnet und fokussiert den ersten Eintrag, <kbd>↑</kbd> den letzten. Im Menü: <kbd>↑</kbd> <kbd>↓</kbd>, <kbd>Pos1</kbd>, <kbd>Ende</kbd>, Anfangsbuchstabe, <kbd>Enter</kbd> wählt, <kbd>Esc</kbd> schließt und bringt den Fokus zum Button zurück, <kbd>Tab</kbd> schließt und geht weiter. „Produkte“ dagegen ist ein einfacher Aufklapper: Die Links erreichst du ganz normal mit <kbd>Tab</kbd>. Ein Klick daneben schließt beide.','“Actions”: <kbd>Enter</kbd>, <kbd>Space</kbd> or <kbd>↓</kbd> opens and focuses the first item, <kbd>↑</kbd> the last. In the menu: <kbd>↑</kbd> <kbd>↓</kbd>, <kbd>Home</kbd>, <kbd>End</kbd>, first letter, <kbd>Enter</kbd> selects, <kbd>Esc</kbd> closes and returns focus to the button, <kbd>Tab</kbd> closes and moves on. “Products”, on the other hand, is a simple disclosure: you reach the links with plain <kbd>Tab</kbd>. A click outside closes both.')}</p>`,
  init(root){
    const status=$('#menubutton-status',root),say=m=>{status.textContent=m};
    /* Aktionsmenü */
    const wrap=$('#menubutton-actions',root),btn=$('#menubutton-btn',root),menu=$('#menubutton-menu',root),items=$$('[role="menuitem"]',menu);
    const isOpen=()=>btn.getAttribute('aria-expanded')==='true';
    const focusAt=i=>items[(i+items.length)%items.length].focus();
    const open=i=>{btn.setAttribute('aria-expanded','true');menu.hidden=false;focusAt(i)};
    // Erst den Fokus zurückgeben, dann verstecken – sonst fällt er kurz auf <body>
    const close=refocus=>{if(refocus)btn.focus();btn.setAttribute('aria-expanded','false');menu.hidden=true};
    const label=it=>it.textContent.trim();
    const activate=it=>{close(true);say(tx(`„${label(it)}“ gewählt – in einer echten App würde jetzt etwas passieren.`,`“${label(it)}” chosen – in a real app something would happen now.`))};
    btn.addEventListener('click',()=>{if(isOpen())close(true);else open(0)});
    btn.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();open(0)}
      else if(e.key==='ArrowUp'){e.preventDefault();open(-1)}
      else if(e.key==='Escape'&&isOpen()){e.preventDefault();close(true)}
    });
    menu.addEventListener('keydown',e=>{
      const i=items.indexOf(document.activeElement);
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      switch(e.key){
        case 'ArrowDown':focusAt(i+1);break;
        case 'ArrowUp':focusAt(i-1);break;
        case 'Home':case 'PageUp':focusAt(0);break;
        case 'End':case 'PageDown':focusAt(items.length-1);break;
        case 'Escape':close(true);break;
        case 'Enter':if(i>=0)activate(items[i]);break;
        // Leertaste erst beim Loslassen auslösen: sonst landet das keyup auf dem Button und öffnet das Menü gleich wieder
        case ' ':break;
        // Tab: Menü zu, Fokus auf den Button – der Browser springt dann von dort weiter
        case 'Tab':close(true);return;
        default:{
          if(e.key.length!==1||!/\S/.test(e.key))return;
          const k=e.key.toLowerCase();
          for(let j=1;j<=items.length;j++){const it=items[(i+j)%items.length];if(label(it).toLowerCase().startsWith(k)){it.focus();break}}
        }
      }
      e.preventDefault();
    });
    menu.addEventListener('keyup',e=>{if(e.key===' '){const it=e.target.closest('[role="menuitem"]');if(it)activate(it)}});
    menu.addEventListener('click',e=>{const it=e.target.closest('[role="menuitem"]');if(it)activate(it)});
    menu.addEventListener('pointerover',e=>{const it=e.target.closest('[role="menuitem"]');if(it&&it!==document.activeElement)it.focus()});
    wrap.addEventListener('focusout',e=>{if(isOpen()&&e.relatedTarget&&!wrap.contains(e.relatedTarget))close(false)});
    /* Navigation als Aufklapper */
    const nwrap=$('#menubutton-navwrap',root),nbtn=$('#menubutton-nav-btn',root),nlist=$('#menubutton-nav-list',root);
    const nOpen=()=>nbtn.getAttribute('aria-expanded')==='true';
    const nset=(on,refocus)=>{if(refocus)nbtn.focus();nbtn.setAttribute('aria-expanded',String(on));nlist.hidden=!on};
    nbtn.addEventListener('click',()=>nset(!nOpen()));
    nwrap.addEventListener('keydown',e=>{if(e.key==='Escape'&&nOpen()){e.preventDefault();nset(false,true)}});
    nlist.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();nset(false,true);say(tx(`Der Link würde jetzt zu „${a.textContent.trim()}“ führen.`,`The link would now take you to “${a.textContent.trim()}”.`))});
    /* Klick daneben schließt – der einzige Listener außerhalb des Beispiels */
    const outside=e=>{
      if(isOpen()&&!wrap.contains(e.target))close(false);
      if(nOpen()&&!nwrap.contains(e.target))nset(false);
    };
    document.addEventListener('pointerdown',outside);
    return()=>document.removeEventListener('pointerdown',outside);
  },
  css:`.menubutton-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;align-items:start}
.menubutton-col{min-height:230px}

.menubutton-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:5;min-width:210px;max-width:calc(100vw - 48px);margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.menubutton-menu [role="menuitem"],.menubutton-links a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}

.menubutton-menu [role="menuitem"]:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--brand-soft)}
.menubutton-links a:hover{background:var(--surface-2)}
.menubutton-menu .menubutton-danger,.menubutton-menu .menubutton-danger .ic{color:var(--danger)}
.menubutton-sep{height:1px;margin:6px 4px;background:var(--line)}
.menubutton-status{margin:8px 0 0;min-height:1.5em;font-weight:700;color:var(--success)}`,
  bad:{code:tx(`<\!-- Navigation als ARIA-Menü verkleidet -->
<nav>
  <ul role="menubar">
    <li role="none">

    </li>
  </ul>
</nav>`,`<\!-- navigation dressed up as an ARIA menu -->
<nav>
  <ul role="menubar">
    <li role="none">

    </li>

    note:tx('Der Screenreader kündigt eine „Menüleiste“ an und erwartet Pfeiltasten wie in einem Programm – die fehlen fast immer. Die Links verlieren ihre Rolle „Link“ und tauchen in der Linkliste des Screenreaders nicht mehr auf.','The screen reader announces a “menu bar” and expects arrow keys like in an application – these are almost always missing. The links lose their “link” role and no longer show up in the screen reader’s list of links.')},
  good:{code:tx(`<\!-- Aktionen: Menü-Button -->
<button type="button" id="act" aria-haspopup="menu"
        aria-expanded="false" aria-controls="act-menu">Aktionen</button>
<ul role="menu" id="act-menu" aria-labelledby="act" hidden>
  <li role="menuitem" tabindex="-1">Bearbeiten</li>
  <li role="menuitem" tabindex="-1">Duplizieren</li>
  <li role="menuitem" tabindex="-1">Löschen</li>
</ul>

<\!-- Navigation: Aufklapper mit normalen Links -->
<nav aria-label="Shop">
  <button type="button" aria-expanded="false"
          aria-controls="produkte">Produkte</button>
  <ul id="produkte" hidden>
    <li><a href="/laptops">Laptops</a></li>

</nav>`,`<\!-- actions: menu button -->
<button type="button" id="act" aria-haspopup="menu"
        aria-expanded="false" aria-controls="act-menu">Actions</button>
<ul role="menu" id="act-menu" aria-labelledby="act" hidden>

          aria-controls="products">Products</button>

  </ul>

    note:tx('Das Menü braucht dazu einen <code>keydown</code>-Handler (<kbd>↑</kbd> <kbd>↓</kbd> <kbd>Pos1</kbd> <kbd>Ende</kbd> <kbd>Esc</kbd> <kbd>Enter</kbd>), der den Fokus zwischen den Einträgen bewegt. Die Navigation kommt mit <code>aria-expanded</code> und <kbd>Tab</kbd> aus.','The menu also needs a <code>keydown</code> handler (<kbd>↑</kbd> <kbd>↓</kbd> <kbd>Home</kbd> <kbd>End</kbd> <kbd>Esc</kbd> <kbd>Enter</kbd>) that moves focus between the items. The navigation gets by with <code>aria-expanded</code> and <kbd>Tab</kbd>.')},
  native:tx('Ein natives Menü-Element gibt es nicht – <code>&lt;menu&gt;</code> ist trotz des Namens nur eine Liste (Rolle <code>list</code>). Neu ist die Popover-API: <code>popover</code> und <code>popovertarget</code> übernehmen Öffnen, Schließen bei <kbd>Esc</kbd> und Klick daneben – Rollen und Pfeiltasten musst du trotzdem selbst ergänzen. Für eine Navigation brauchst du kein Menü: Button mit <code>aria-expanded</code> und eine Liste von Links, oder gleich <code>&lt;details&gt;</code>/<code>&lt;summary&gt;</code>. Und oft genügen sichtbare Buttons ganz ohne Aufklappen.','There’s no native menu element – despite its name, <code>&lt;menu&gt;</code> is just a list (role <code>list</code>). New is the popover API: <code>popover</code> and <code>popovertarget</code> handle opening and closing on <kbd>Esc</kbd> and outside click – you still add roles and arrow keys yourself. Navigation needs no menu: a button with <code>aria-expanded</code> and a list of links, or simply <code>&lt;details&gt;</code>/<code>&lt;summary&gt;</code>. And often visible buttons without any dropdown are enough.'),
  do:tx([
    '<code>role="menu"</code> nur für Aktionen verwenden – Befehle, die sofort etwas tun.',
    'Beim Öffnen den Fokus auf den ersten Eintrag setzen (mit <kbd>↑</kbd> auf den letzten).',
    '<kbd>Esc</kbd> schließt das Menü und bringt den Fokus zurück zum Button.',
    '<code>aria-expanded</code> am Button bei jedem Öffnen und Schließen mitschalten.',
    'Die Einträge mit <code>tabindex="-1"</code> aus der Tab-Reihenfolge nehmen – <kbd>Tab</kbd> verlässt das Menü.'
  ],[
    'Use <code>role="menu"</code> only for actions – commands that do something right away.',
    'On open, move focus to the first item (with <kbd>↑</kbd>, to the last).',
    '<kbd>Esc</kbd> closes the menu and returns focus to the button.',
    'Switch <code>aria-expanded</code> on the button on every open and close.',
    'Take the items out of the tab order with <code>tabindex="-1"</code> – <kbd>Tab</kbd> leaves the menu.'
  ]),
  dont:tx([
    '<code>role="menu"</code> oder <code>menubar</code> für eine Website-Navigation mit Links.',
    'Ein Menü nur bei Hover öffnen – mit Tastatur und Touch unerreichbar.',
    'Die Rollen setzen, aber keine Pfeiltasten einbauen – dann ist das Menü für Screenreader-Nutzer kaputt.',
    'Formularfelder, Überschriften oder Fließtext in ein <code>role="menu"</code> packen – darin sind nur Menüeinträge erlaubt.'
  ],[
    '<code>role="menu"</code> or <code>menubar</code> for site navigation made of links.',
    'Opening a menu on hover only – unreachable by keyboard and touch.',
    'Setting the roles but not adding arrow keys – then the menu is broken for screen reader users.',
    'Putting form fields, headings or body text into a <code>role="menu"</code> – only menu items belong there.'
  ]),
  ng:tx('<p>Das CDK bringt mit <code>@angular/cdk/menu</code> fertige Direktiven: <code>cdkMenuTriggerFor</code> auf dem Button setzt <code>aria-haspopup</code> und <code>aria-expanded</code>, <code>cdkMenu</code> und <code>cdkMenuItem</code> vergeben die Rollen und übernehmen Pfeiltasten, Anfangsbuchstaben, <kbd>Esc</kbd> und die Fokus-Rückgabe. Angular Material bietet dasselbe als <code>mat-menu</code> mit <code>[matMenuTriggerFor]</code>. Baust du selbst, hilft der <code>FocusKeyManager</code> aus <code>@angular/cdk/a11y</code> beim Bewegen des Fokus. Für eine Navigation nimm keins davon – dort reicht ein Button mit <code>[attr.aria-expanded]</code>.</p>','<p>The CDK ships ready-made directives in <code>@angular/cdk/menu</code>: <code>cdkMenuTriggerFor</code> on the button sets <code>aria-haspopup</code> and <code>aria-expanded</code>, <code>cdkMenu</code> and <code>cdkMenuItem</code> assign the roles and handle arrow keys, first letters, <kbd>Esc</kbd> and focus return. Angular Material offers the same as <code>mat-menu</code> with <code>[matMenuTriggerFor]</code>. If you build your own, <code>FocusKeyManager</code> from <code>@angular/cdk/a11y</code> helps move focus. For navigation use none of these – a button with <code>[attr.aria-expanded]</code> is enough there.</p>'),
  ngCode:`import { CdkMenu, CdkMenuItem, CdkMenuTrigger } from '@angular/cdk/menu';

@Component({
  selector: 'app-row-actions',
  imports: [CdkMenuTrigger, CdkMenu, CdkMenuItem],
  template: \`
    <button type="button" [cdkMenuTriggerFor]="actions">Actions</button>

    <ng-template #actions>
      <div cdkMenu>
        <button cdkMenuItem (cdkMenuItemTriggered)="edit.emit()">Edit</button>
        <button cdkMenuItem (cdkMenuItemTriggered)="duplicate.emit()">Duplicate</button>
        <button cdkMenuItem (cdkMenuItemTriggered)="remove.emit()">Delete</button>
      </div>
    </ng-template>
  \`,
})
export class RowActions {
  readonly edit = output<void>();
  readonly duplicate = output<void>();
  readonly remove = output<void>();
}`,
  why:tx('<p>Auf dem Button hört man „Aktionen, Schalter, reduziert, Untermenü“ – man weiß also schon vorher, dass sich ein Menü öffnet. Danach „Menü – Bearbeiten, Menüeintrag, 1 von 3“. Die Rolle <code>menu</code> schaltet viele Screenreader in einen Modus, in dem die Pfeiltasten direkt an die Seite gehen statt an den Lesemodus. Genau deshalb ist sie ein Versprechen: Wer <code>menu</code> sagt, muss die Pfeiltasten auch bedienen.</p><p>Deshalb schadet <code>role="menu"</code> bei einer Navigation: Der Screenreader kündigt ein Programm-Menü an, die Nutzerin drückt <kbd>↓</kbd> – und nichts passiert, oder sie springt an den Links vorbei. Ein einfacher Aufklapper mit Links („Produkte, Schalter, reduziert“) verhält sich dagegen genau so, wie man es von Websites kennt.</p>','<p>On the button you hear “Actions, button, collapsed, submenu” – so you know beforehand that a menu will open. Then “menu – Edit, menu item, 1 of 3”. The <code>menu</code> role switches many screen readers into a mode where arrow keys go straight to the page instead of browse mode. That’s exactly why it’s a promise: whoever says <code>menu</code> has to handle the arrow keys.</p><p>That’s why <code>role="menu"</code> hurts on navigation: the screen reader announces an application menu, the user presses <kbd>↓</kbd> – and nothing happens, or they skip past the links. A simple disclosure with links (“Products, button, collapsed”) behaves exactly the way people know from websites.</p>')
});

LESSONS.push({
  id:'name',cat:'basics',
  title:tx('Der zugängliche Name','The accessible name'),
  short:tx('Woher ein Element seinen Namen bekommt – und welche Quelle gewinnt.','Where an element gets its name from – and which source wins.'),
  keys:'accessible name zugänglicher name accname aria-label aria-labelledby label alt title placeholder legend caption icon button label in name 2.5.3 sprachsteuerung voice control beschriftung',
  refs:['Accessible Name and Description Computation 1.2','WCAG 2.5.3 Label in Name','WCAG 4.1.2','WCAG 1.1.1'],
  rule:tx('Der Browser nimmt die <strong>erste</strong> Quelle, die etwas liefert: <code>aria-labelledby</code> → <code>aria-label</code> → natives Label (<code>&lt;label&gt;</code>, <code>alt</code>, <code>&lt;legend&gt;</code>, <code>&lt;caption&gt;</code>) → Inhalt (nur bei Rollen wie <code>button</code>, <code>link</code>, <code>heading</code>) → <code>title</code> → <code>placeholder</code>. Alles dahinter wird ignoriert. Und steht Text sichtbar auf dem Element, muss er im Namen vorkommen.','The browser takes the <strong>first</strong> source that yields something: <code>aria-labelledby</code> → <code>aria-label</code> → native label (<code>&lt;label&gt;</code>, <code>alt</code>, <code>&lt;legend&gt;</code>, <code>&lt;caption&gt;</code>) → content (only for roles like <code>button</code>, <code>link</code>, <code>heading</code>) → <code>title</code> → <code>placeholder</code>. Everything after it is ignored. And if there is visible text on the element, it must appear in the name.'),
  attrs:[
    ['aria-labelledby','ID ID …',tx('Höchste Priorität. Setzt den Namen aus dem Text der verwiesenen Elemente zusammen, in der Reihenfolge der IDs – funktioniert sogar mit versteckten Elementen.','Highest priority. Builds the name from the text of the referenced elements, in the order of the IDs – even works with hidden elements.')],
    ['aria-label','Text',tx('Unsichtbarer Name. Schlägt Inhalt und <code>&lt;label&gt;</code>. Gedacht für Elemente ohne sichtbaren Text, etwa Icon-Buttons.','Invisible name. Beats content and <code>&lt;label&gt;</code>. Meant for elements without visible text, such as icon buttons.')],
    ['<label for>','ID',tx('Der native Name für Formularfelder. Ein Klick aufs Label fokussiert gleich das Feld.','The native name for form fields. Clicking the label focuses the field too.')],
    ['alt','Text',tx('Name eines Bilds. <code>alt=""</code> macht es zur Deko und nimmt es aus dem Baum.','Name of an image. <code>alt=""</code> marks it as decoration and removes it from the tree.')],
    ['<legend> <caption> <figcaption>','',tx('Name für <code>&lt;fieldset&gt;</code>, <code>&lt;table&gt;</code> und <code>&lt;figure&gt;</code>.','Name for <code>&lt;fieldset&gt;</code>, <code>&lt;table&gt;</code> and <code>&lt;figure&gt;</code>.')],
    ['title','Text',tx('Notlösung: wird nur Name, wenn sonst nichts da ist – sonst Beschreibung. Den Tooltip sieht nur, wer mit der Maus darüberfährt.','Fallback: only becomes the name if nothing else is there – otherwise the description. Only mouse users ever see the tooltip.')],

  demo:`<div class="name-lab">

  <div class="name-item name-yes"><p class="name-cap">${ic('ok')} &lt;label for&gt;</p><label for="name-first" class="name-l">${tx('Vorname','First name')}</label><input id="name-first" class="input" autocomplete="given-name"></div>
  <div class="name-item name-yes"><p class="name-cap">${ic('ok')} &lt;legend&gt;</p><fieldset class="name-fs"><legend>${tx('Versand','Shipping')}</legend><label class="check-row"><input type="radio" name="name-ship" checked> ${tx('Standard','Standard')}</label><label class="check-row"><input type="radio" name="name-ship"> Express</label></fieldset></div>
  <div class="name-item name-yes"><p class="name-cap">${ic('ok')} ${tx('aria-labelledby, zwei IDs','aria-labelledby, two IDs')}</p><div class="name-art"><h4 id="name-art-h" class="name-art-h">${tx('Formulare beschriften','Labelling forms')}</h4><a href="#" id="name-more" aria-labelledby="name-more name-art-h">${tx('Mehr','More')}</a></div></div>

</div>
<p class="demo-note">${tx('Im Labor: Hak die Quellen an und ab und schau, welche gewinnt – die durchgestrichenen sind da, zählen aber nicht. Mit <code>title</code> und Inhalt zusammen wird der <code>title</code> zur Beschreibung. In der Galerie: mit <kbd>Tab</kbd> durchgehen, der Inspektor zeigt bei jedem Element, woher der Name kommt.','In the lab: tick sources on and off and see which one wins – the struck-through ones are present but don’t count. With <code>title</code> and content together, the <code>title</code> becomes the description. In the gallery: <kbd>Tab</kbd> through, the inspector shows for each element where its name comes from.')}</p>`,
  init(root){
    const btn=$('#name-lab-btn',root),txt=$('#name-lab-txt',root),out=$('#name-out',root),opts=$$('.name-opt',root);
    const VAL={'aria-labelledby':'name-lab-ref','aria-label':tx('Formular abschicken','Submit form'),title:tx('Schickt die Nachricht ab','Sends the message')};
    const FROM={'aria-labelledby':tx('aus aria-labelledby','from aria-labelledby'),'aria-label':tx('aus aria-label','from aria-label'),content:tx('aus dem Inhalt','from content'),title:tx('aus title (Notlösung)','from title (fallback)')};
    const words=s=>' '+s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';
    const upd=()=>{
      opts.forEach(o=>{
        const k=o.dataset.src,on=$('input',o).checked;
        if(k==='content')txt.hidden=!on;
        else if(on)btn.setAttribute(k,VAL[k]);else btn.removeAttribute(k);
      });
      const r=typeof accName==='function'?accName(btn):{name:'',src:''};
      opts.forEach(o=>{const on=$('input',o).checked;o.classList.toggle('is-win',o.dataset.src===r.src);o.classList.toggle('is-lost',on&&o.dataset.src!==r.src)});
      const vis=txt.hidden?'':txt.textContent.trim();
      const line1=r.name
        ?`<p class="name-res">${tx('Name','Name')}: <strong>${tx('„','“')}${esc(r.name)}${tx('“','”')}</strong> <span class="name-src">${esc(FROM[r.src]||r.src)}</span></p>`
        :`<p class="name-res name-bad">${ic('alert')} ${tx('Kein Name – der Screenreader sagt nur „Schalter“.','No name – the screen reader only says “button”.')}</p>`;
      let line2='';
      if(r.name&&!vis)line2=`<p class="name-lin">${ic('info')} ${tx('Kein sichtbarer Text, nur ein Icon – „Label in Name“ greift hier nicht.','No visible text, only an icon – “label in name” doesn’t apply here.')}</p>`;
      else if(r.name&&words(r.name).includes(words(vis)))line2=`<p class="name-lin name-good">${ic('ok')} ${tx(`Der sichtbare Text „${esc(vis)}“ steckt im Namen. Sprachsteuerung findet den Button mit „Klick ${esc(vis)}“.`,`The visible text “${esc(vis)}” is part of the name. Voice control finds the button with “Click ${esc(vis)}”.`)}</p>`;
      else if(r.name)line2=`<p class="name-lin name-bad">${ic('xc')} ${tx(`Der sichtbare Text „${esc(vis)}“ fehlt im Namen – Verstoß gegen WCAG 2.5.3. „Klick ${esc(vis)}“ per Sprachsteuerung findet nichts.`,`The visible text “${esc(vis)}” is missing from the name – fails WCAG 2.5.3. Saying “Click ${esc(vis)}” with voice control finds nothing.`)}</p>`;
      out.innerHTML=line1+line2;
    };
    root.addEventListener('change',e=>{if(e.target.closest('.name-opt'))upd()});
    root.addEventListener('click',e=>{if(e.target.closest('#name-more'))e.preventDefault()});
    upd();
  },

  bad:{code:tx(`<button><svg>…</svg></button>

<a href="/formulare">Mehr</a>`,`<button><svg>…</svg></button>

    note:tx('Ein Button ohne Namen, ein Feld, dessen Name beim Tippen verschwindet, ein Name, der dem sichtbaren Text widerspricht, und ein „Mehr“, das in der Linkliste zehnmal gleich klingt.','A button without a name, a field whose name vanishes while typing, a name that contradicts the visible text, and a “More” that sounds the same ten times in the links list.')},
  good:{code:tx(`<button aria-label="Einstellungen">

<button>Send</button>

<a href="/forms" id="more" aria-labelledby="more t-form">More</a>`),
    note:tx('Sichtbarer Text ist der beste Name. <code>aria-label</code> nur, wenn nichts Sichtbares da ist; <code>aria-labelledby</code>, um vorhandenen Text wiederzuverwenden – hier „Mehr Formulare beschriften“.','Visible text is the best name. <code>aria-label</code> only when there’s nothing visible; <code>aria-labelledby</code> to reuse existing text – here “More Labelling forms”.')},
  native:tx('Meistens ja, und das ist die bessere Wahl: sichtbarer Text im <code>&lt;button&gt;</code> oder <code>&lt;a&gt;</code>, <code>&lt;label&gt;</code> für Felder, <code>alt</code> für Bilder, <code>&lt;legend&gt;</code> für Gruppen, <code>&lt;caption&gt;</code> für Tabellen. Sichtbare Namen helfen allen – auch Menschen mit Sprachsteuerung oder kognitiven Einschränkungen. <code>aria-label</code> und <code>aria-labelledby</code> brauchst du für Icon-Buttons, für Elemente, deren Beschriftung woanders steht (Dialoge, Regionen, Tab-Leisten), und für Widgets ohne natives Gegenstück.','Mostly yes, and that’s the better choice: visible text inside the <code>&lt;button&gt;</code> or <code>&lt;a&gt;</code>, <code>&lt;label&gt;</code> for fields, <code>alt</code> for images, <code>&lt;legend&gt;</code> for groups, <code>&lt;caption&gt;</code> for tables. Visible names help everyone – including people using voice control or with cognitive disabilities. You need <code>aria-label</code> and <code>aria-labelledby</code> for icon buttons, for elements whose label sits elsewhere (dialogs, regions, tab lists) and for widgets without a native counterpart.'),
  do:tx([
    'Sichtbaren Text als Namen nutzen, wo immer es geht.',
    'Wenn <code>aria-label</code> nötig ist und es sichtbaren Text gibt: den sichtbaren Text wörtlich übernehmen, am besten am Anfang (WCAG 2.5.3).',
    'Icon-Buttons immer benennen – <code>aria-label</code> oder versteckter Text mit <code>.sr-only</code> – und das Icon mit <code>aria-hidden="true"</code> ausblenden.',
    'Namen kurz halten und nach dem Zweck benennen („Löschen“), nicht nach dem Bild („Mülleimer“).',
    'Rolle und Zustand <em>nicht</em> in den Namen schreiben – „Schalter“ und „erweitert“ sagt der Screenreader selbst.'
  ],[
    'Use visible text as the name wherever possible.',
    'If you need <code>aria-label</code> and there is visible text: take over the visible text word for word, ideally at the start (WCAG 2.5.3).',
    'Always name icon buttons – <code>aria-label</code> or hidden text with <code>.sr-only</code> – and hide the icon with <code>aria-hidden="true"</code>.',
    'Keep names short and name the purpose (“Delete”), not the picture (“Trash can”).',
    'Do <em>not</em> put role and state into the name – the screen reader says “button” and “expanded” by itself.'
  ]),
  dont:tx([
    '<code>aria-label</code> auf einen Button mit sichtbarem Text, der etwas anderes sagt.',
    '<code>aria-label</code> auf <code>&lt;div&gt;</code>, <code>&lt;span&gt;</code> oder <code>&lt;p&gt;</code> ohne Rolle – dort ist Benennen verboten, viele Screenreader ignorieren es.',
    '<code>title</code> oder <code>placeholder</code> als einzigen Namen verwenden.',
    'Den Namen per <code>aria-labelledby</code> auf eine ID zeigen lassen, die es nicht gibt – dann fällt er stillschweigend auf die nächste Quelle zurück.'
  ],[
    '<code>aria-label</code> on a button with visible text that says something else.',
    '<code>aria-label</code> on a <code>&lt;div&gt;</code>, <code>&lt;span&gt;</code> or <code>&lt;p&gt;</code> without a role – naming is prohibited there, many screen readers ignore it.',
    'Using <code>title</code> or <code>placeholder</code> as the only name.',
    'Pointing <code>aria-labelledby</code> at an ID that doesn’t exist – then it silently falls back to the next source.'
  ]),
  ng:tx('<p>Statischer Text geht einfach als <code>aria-label="…"</code>; sobald ein Wert dynamisch ist, bindest du <code>[attr.aria-label]</code>. Für die Übersetzung mit Angular i18n markierst du das Attribut mit <code>i18n-aria-label</code>. Angular Material hilft mit: <code>&lt;mat-icon&gt;</code> ist standardmäßig <code>aria-hidden="true"</code>, und <code>&lt;mat-label&gt;</code> in einem <code>&lt;mat-form-field&gt;</code> wird automatisch zum <code>&lt;label&gt;</code> des Felds.</p>','<p>Static text simply goes in as <code>aria-label="…"</code>; as soon as a value is dynamic, bind <code>[attr.aria-label]</code>. For translation with Angular i18n, mark the attribute with <code>i18n-aria-label</code>. Angular Material helps: <code>&lt;mat-icon&gt;</code> is <code>aria-hidden="true"</code> by default, and <code>&lt;mat-label&gt;</code> inside a <code>&lt;mat-form-field&gt;</code> automatically becomes the field’s <code>&lt;label&gt;</code>.</p>'),
  ngCode:`@Component({
  selector: 'app-draft-toolbar',
  imports: [MatButtonModule, MatIconModule],
  template: \`
    <\!-- Icon only: name via aria-label, translatable -->
    <button mat-icon-button type="button" aria-label="Delete draft"
            i18n-aria-label (click)="remove()">
      <mat-icon>delete</mat-icon>   <\!-- aria-hidden by default -->
    </button>

    <\!-- Visible text IS the name – no aria-label -->
    <button mat-flat-button type="button" (click)="send()">Send</button>

    <\!-- Dynamic name: bind it as an attribute -->
    <button mat-icon-button type="button" (click)="close()"
            [attr.aria-label]="'Close ' + draft().title">
      <mat-icon>close</mat-icon>
    </button>
  \`,
})
export class DraftToolbar {
  readonly draft = input.required<Draft>();
}`,
  why:tx('<p>Der Name ist das Erste, was ein Screenreader sagt. Ein Icon-Button ohne Namen klingt nur nach „Schalter“ – bei einer Werkzeugleiste mit sechs Icons hört man sechsmal dasselbe. Mit <code>aria-label</code> wird daraus „Einstellungen, Schalter“. Auch Links werden gern nach Namen gesucht: In der Linkliste von NVDA steht zehnmal „Mehr“, wenn der Name nicht mehr verrät.</p><p>Nicht nur Screenreader brauchen den Namen. Wer per Sprachsteuerung bedient (Dragon, Voice Control), sagt, was auf dem Bildschirm steht: „Klick Senden“. Heißt der Button intern „Formular abschicken“, passiert nichts – deshalb verlangt WCAG 2.5.3, dass der sichtbare Text im Namen vorkommt.</p>','<p>The name is the first thing a screen reader says. An icon button without a name only sounds like “button” – with a toolbar of six icons you hear the same thing six times. With <code>aria-label</code> it becomes “Settings, button”. Links are often looked up by name too: NVDA’s links list shows “More” ten times if the name doesn’t tell more.</p><p>Screen readers aren’t the only ones that need the name. People using voice control (Dragon, Voice Control) say what they see on screen: “Click Send”. If the button is internally called “Submit form”, nothing happens – that’s why WCAG 2.5.3 requires the visible text to be part of the name.</p>')
});

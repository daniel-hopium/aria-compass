.current-steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:current-step}
.current-steps li{counter-increment:current-step;display:flex;align-items:center;gap:10px;min-height:40px;color:var(--muted)}
.current-steps li::before{content:counter(current-step);display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);font-weight:700;font-size:.875rem}
.current-steps li:has(~ [aria-current="step"]){color:var(--ink)}
.current-steps li:has(~ [aria-current="step"])::before{content:"✓";content:"✓" / "";background:var(--success);border-color:var(--success);color:var(--surface)}
.current-steps li[aria-current="step"]{color:var(--ink);font-weight:700}
.current-steps li[aria-current="step"]::before{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.current-stepbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}`,
  bad:{code:tx(`<nav>
  <a href="/" class="active">Start</a>
  <a href="/brot">Brot</a>
  <a href="/gebaeck">Gebäck</a>
</nav>

<\!-- oder: das falsche Attribut -->
<a href="/brot" aria-selected="true">Brot</a>`,`<nav>
  <a href="/" class="active">Home</a>
  <a href="/bread">Bread</a>
  <a href="/pastries">Pastries</a>
</nav>

<\!-- or: the wrong attribute -->
<a href="/bread" aria-selected="true">Bread</a>`),
    note:tx('Die Klasse <code>.active</code> sieht nur, wer sieht. Und <code>aria-selected</code> ist auf Links gar nicht erlaubt – der Screenreader ignoriert es.','Only sighted users see the <code>.active</code> class. And <code>aria-selected</code> isn’t even allowed on links – the screen reader ignores it.')},
  good:{code:tx(`<nav aria-label="Sortiment">
  <a href="/" aria-current="page">Start</a>
  <a href="/brot">Brot</a>
  <a href="/gebaeck">Gebäck</a>
</nav>

<style>
  nav a[aria-current="page"] {
    font-weight: 700;
    border-bottom: 3px solid;
  }
</style>`,`<nav aria-label="Products">
  <a href="/" aria-current="page">Home</a>
  <a href="/bread">Bread</a>
  <a href="/pastries">Pastries</a>
</nav>

<style>
  nav a[aria-current="page"] {
    font-weight: 700;
    border-bottom: 3px solid;
  }
</style>`),
    note:tx('Ein Attribut für beides: Der Screenreader sagt „aktuelle Seite“, das CSS zeichnet die Markierung. Auseinanderlaufen können die zwei nicht mehr.','One attribute for both: the screen reader says “current page”, the CSS draws the marker. The two can no longer drift apart.')},
  native:tx('Ein HTML-Gegenstück gibt es nicht – <code>aria-current</code> ist hier genau das richtige Werkzeug und eines der harmlosesten ARIA-Attribute: Es ändert weder Rolle noch Verhalten, es fügt nur eine Information hinzu. Router setzen es oft schon selbst, Angular etwa mit <code>ariaCurrentWhenActive</code>. Abgrenzung: <code>aria-selected</code> gehört zu Auswahl-Widgets – Tabs, Listboxen, Grids –, in denen man etwas <em>auswählt</em>. <code>aria-current</code> gehört zu Links und Elementen, die zeigen, <em>wo</em> man gerade ist.','There’s no HTML counterpart – <code>aria-current</code> is exactly the right tool here and one of the most harmless ARIA attributes: it changes neither role nor behaviour, it only adds information. Routers often set it for you, Angular for example with <code>ariaCurrentWhenActive</code>. The distinction: <code>aria-selected</code> belongs to selection widgets – tabs, listboxes, grids – where you <em>choose</em> something. <code>aria-current</code> belongs to links and items that show <em>where</em> you are.'),
  do:tx([
    'Genau ein Element pro Reihe markieren – und beim Wechsel das Attribut vom alten Element entfernen.',
    'Den passenden Wert wählen: <code>page</code> für Links zu Seiten, <code>step</code> für Abläufe, <code>date</code> im Kalender.',
    'Das Styling an <code>[aria-current]</code> hängen statt an <code>.active</code> – dann passen Optik und Semantik immer zusammen.',
    'Im Brotkrümelpfad das letzte Element mit <code>aria-current="page"</code> markieren und die Trenner per CSS zeichnen, nicht als Text.'
  ],[
    'Mark exactly one item per set – and remove the attribute from the old item when it changes.',
    'Pick the right value: <code>page</code> for links to pages, <code>step</code> for processes, <code>date</code> in a calendar.',
    'Hang the styling on <code>[aria-current]</code> instead of <code>.active</code> – then visuals and semantics always match.',
    'Mark the last breadcrumb item with <code>aria-current="page"</code> and draw the separators with CSS, not as text.'
  ]),
  dont:tx([
    '<code>aria-selected</code> auf Navigations-Links – dort gilt das Attribut nicht.',
    '<code>aria-current</code> auf Tabs oder Optionen einer Listbox – dort heißt es <code>aria-selected</code>.',
    '„(aktuelle Seite)“ zusätzlich in den Linktext schreiben – dann hört man es doppelt.',
    '<code>aria-current</code> auf den Container (<code>&lt;nav&gt;</code>, <code>&lt;ol&gt;</code>) statt auf das Element selbst.'
  ],[
    '<code>aria-selected</code> on navigation links – the attribute doesn’t apply there.',
    '<code>aria-current</code> on tabs or listbox options – there it’s <code>aria-selected</code>.',
    'Also writing “(current page)” into the link text – then you hear it twice.',
    '<code>aria-current</code> on the container (<code>&lt;nav&gt;</code>, <code>&lt;ol&gt;</code>) instead of the item itself.'
  ]),
  ng:tx('<p>Angular erledigt das für Router-Links selbst: <code>routerLinkActive</code> setzt die CSS-Klasse, und mit <code>ariaCurrentWhenActive="page"</code> auch <code>aria-current</code> – nur solange der Link aktiv ist. Für den Start-Link <code>[routerLinkActiveOptions]="{ exact: true }"</code> setzen, sonst ist „Start“ auf jeder Seite aktuell. Für eigene Stepper bindest du das Attribut direkt: <code>[attr.aria-current]="i === step() ? \'step\' : null"</code> – <code>null</code> entfernt es bei allen anderen Schritten.</p>','<p>Angular handles this for router links by itself: <code>routerLinkActive</code> sets the CSS class, and with <code>ariaCurrentWhenActive="page"</code> also <code>aria-current</code> – only while the link is active. For the home link set <code>[routerLinkActiveOptions]="{ exact: true }"</code>, otherwise “Home” is current on every page. For custom steppers bind the attribute directly: <code>[attr.aria-current]="i === step() ? \'step\' : null"</code> – <code>null</code> removes it from all other steps.</p>'),
  ngCode:`@Component({
  selector: 'app-main-nav',
  imports: [RouterLink, RouterLinkActive],
  template: \`
    <nav aria-label="Products">
      <ul>
        @for (link of links; track link.url) {
          <li>
            <a [routerLink]="link.url" routerLinkActive="active"
               ariaCurrentWhenActive="page"
               [routerLinkActiveOptions]="{ exact: link.url === '/' }">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>
  \`,
  styles: \`a[aria-current='page'] { font-weight: 700; border-bottom: 3px solid; }\`,
})
export class MainNav {
  protected readonly links = [
    { url: '/', label: 'Home' },
    { url: '/bread', label: 'Bread' },
    { url: '/pastries', label: 'Pastries' },
  ];
}`,
  why:tx('<p>Sehende erkennen den aktuellen Menüpunkt an Farbe oder Unterstrich. Ohne <code>aria-current</code> liest der Screenreader „Brot, Link“ – genau wie bei allen anderen Punkten. Mit dem Attribut heißt es „Brot, Link, aktuelle Seite“, im Bestellvorgang „Adresse, aktueller Schritt, 2 von 4“.</p><p>Das hilft vor allem nach einem Seitenwechsel: Man springt ins Menü und hört sofort, wo man ist, ohne erst die Überschrift der Seite suchen zu müssen. Und im Brotkrümelpfad trennt es den Ort, an dem man steht, von den Wegen zurück.</p>','<p>Sighted users recognise the current menu item by colour or underline. Without <code>aria-current</code> the screen reader reads “Bread, link” – exactly like every other item. With the attribute it’s “Bread, link, current page”, and in checkout “Address, current step, 2 of 4”.</p><p>That helps most after a page change: you jump into the menu and immediately hear where you are, without first hunting for the page heading. And in the breadcrumb it separates the place you’re standing from the ways back.</p>')
});

LESSONS.push({
  id:'describedby',cat:'basics',
  title:tx('Beschreibungen: aria-describedby','Descriptions: aria-describedby'),
  short:tx('Hinweise und Fehlermeldungen mit dem Feld verbinden, zu dem sie gehören.','Connect hints and error messages to the field they belong to.'),
  keys:'aria-describedby aria-description aria-invalid aria-errormessage beschreibung description hinweis hint fehlermeldung error message formular form passwort password name',
  refs:['WAI-ARIA 1.2: aria-describedby','Accessible Name and Description Computation 1.2','WCAG 3.3.1','WCAG 3.3.2'],
  rule:tx('Der <strong>Name</strong> sagt, <em>was</em> ein Element ist. Die <strong>Beschreibung</strong> ergänzt, was man zusätzlich wissen muss: Format, Anforderungen, Fehler. <code>aria-describedby</code> verweist per ID auf sichtbaren Text – der Screenreader liest ihn beim Fokussieren nach Name, Rolle und Zustand vor. Was unverzichtbar ist, gehört in den Namen: Beschreibungen lassen sich abschalten.','The <strong>name</strong> says <em>what</em> an element is. The <strong>description</strong> adds what you also need to know: format, requirements, errors. <code>aria-describedby</code> points to visible text by ID – the screen reader reads it on focus after name, role and state. Anything essential belongs in the name: descriptions can be switched off.'),
  attrs:[
    ['aria-describedby','ID ID …',tx('Verweist auf Hinweise, Formatangaben, Fehlermeldungen. Mehrere IDs möglich – ihre Reihenfolge ist die Vorlesereihenfolge.','Points to hints, format help, error messages. Several IDs allowed – their order is the reading order.')],
    ['aria-invalid','true | false',tx('Meldet „ungültige Eingabe“. Erst setzen, wenn geprüft wurde – nicht schon beim Laden der Seite.','Reports “invalid entry”. Only set it once you have validated – not on page load.')],
    ['aria-errormessage','ID',tx('Eigens für Fehlermeldungen, gilt nur zusammen mit <code>aria-invalid="true"</code>. Die Unterstützung ist lückenhaft – <code>aria-describedby</code> ist der sichere Weg.','Made for error messages, only applies together with <code>aria-invalid="true"</code>. Support is patchy – <code>aria-describedby</code> is the safe route.')],
    ['aria-description','Text',tx('Beschreibung als Text statt per ID (ARIA 1.3). Neuer, nicht in jeder Kombination aus Browser und Screenreader unterstützt – und für Sehende unsichtbar.','Description as text instead of an ID (ARIA 1.3). Newer, not supported by every browser/screen reader combination – and invisible to sighted users.')]
  ],
  demo:`<form class="describedby-form" id="describedby-form" novalidate>
  <h3 class="describedby-h">${tx('Konto anlegen','Create account')}</h3>
  <div class="field">
    <label for="describedby-user">${tx('Benutzername','Username')}</label>
    <p class="hint" id="describedby-user-hint">${tx('3–20 Zeichen, nur Buchstaben und Ziffern.','3–20 characters, letters and digits only.')}</p>
    <input class="input" id="describedby-user" autocomplete="username" aria-describedby="describedby-user-err describedby-user-hint">
    <p class="err" id="describedby-user-err"></p>
  </div>
  <div class="field">
    <label for="describedby-pw">${tx('Neues Passwort','New password')}</label>
    <ul class="describedby-rules" id="describedby-pw-rules">
      ${[['len',tx('Mindestens 12 Zeichen','At least 12 characters')],['num',tx('Mindestens eine Ziffer','At least one digit')],['case',tx('Groß- und Kleinbuchstaben','Upper- and lowercase letters')]].map(([k,t])=>`<li data-rule="${k}"><span class="describedby-mark">${ic('circle','describedby-off')}${ic('check','describedby-on')}</span>${t}<span class="sr-only describedby-st">${tx(' – noch offen.',' – not met yet.')}</span></li>`).join('')}
    </ul>
    <input class="input" id="describedby-pw" type="password" autocomplete="new-password" aria-describedby="describedby-pw-err describedby-pw-rules">
    <p class="err" id="describedby-pw-err"></p>
  </div>
  <button type="submit" class="btn btn-primary">${tx('Konto anlegen','Create account')}</button>
  <p class="describedby-ok" id="describedby-ok" role="status"></p>
</form>
<h3 class="describedby-h">${tx('Name oder Beschreibung?','Name or description?')}</h3>
<div class="describedby-grid">
  <div class="describedby-item describedby-yes"><p class="describedby-cap">${ic('ok')} aria-describedby</p>
    <button type="button" class="btn btn-secondary describedby-try" aria-describedby="describedby-del-note">${tx('Konto löschen','Delete account')}</button>
    <p class="hint" id="describedby-del-note">${tx('Kann nicht rückgängig gemacht werden.','This can’t be undone.')}</p></div>
  <div class="describedby-item describedby-meh"><p class="describedby-cap">${ic('info')} aria-description</p>
    <button type="button" class="btn btn-secondary describedby-try" aria-description="${tx('Kann nicht rückgängig gemacht werden.','This can’t be undone.')}">${tx('Verlauf leeren','Clear history')}</button>
    <p class="hint">${tx('Gleiche Info, aber nur für Screenreader – und nicht überall unterstützt.','Same info, but for screen readers only – and not supported everywhere.')}</p></div>
  <div class="describedby-item describedby-meh"><p class="describedby-cap">${ic('info')} ${tx('title neben Text','title next to text')}</p>
    <button type="button" class="btn btn-secondary describedby-try" title="${tx('Öffnet den Druckdialog','Opens the print dialog')}">${tx('Drucken','Print')}</button>
    <p class="hint">${tx('Hat das Element schon einen Namen, wird <code>title</code> zur Beschreibung.','If the element already has a name, <code>title</code> becomes the description.')}</p></div>
</div>
<p class="demo-note">${tx('Klick „Konto anlegen“ mit leeren Feldern: Beide Felder bekommen <code>aria-invalid</code>, der Fokus springt ins erste, und der Inspektor zeigt die Fehlermeldung als Beschreibung – vor dem Hinweis, weil ihre ID zuerst steht. Tipp dann weiter: Die Häkchen und die Meldung aktualisieren sich live, <code>aria-invalid</code> verschwindet, sobald alles passt. Beschreibungen liest der Screenreader nur beim Fokussieren – mit NVDA hörst du sie mit <kbd>NVDA</kbd> + <kbd>Tab</kbd> neu.','Click “Create account” with empty fields: both fields get <code>aria-invalid</code>, focus jumps into the first, and the inspector shows the error message as the description – before the hint, because its ID comes first. Then keep typing: the checkmarks and the message update live, <code>aria-invalid</code> disappears once everything is fine. Screen readers only read descriptions on focus – in NVDA you hear them again with <kbd>NVDA</kbd> + <kbd>Tab</kbd>.')}</p>`,
  init(root){
    const form=$('#describedby-form',root),user=$('#describedby-user',root),pw=$('#describedby-pw',root),ok=$('#describedby-ok',root);
    const RULES={len:v=>v.length>=12,num:v=>/\d/.test(v),case:v=>/\p{Lu}/u.test(v)&&/\p{Ll}/u.test(v)};
    let tried=false;
    const setErr=(input,msg)=>{
      const box=$('#'+input.id+'-err',root);
      if(msg){input.setAttribute('aria-invalid','true');box.innerHTML=`${ic('alert')}<span>${esc(msg)}</span>`}
      else{input.removeAttribute('aria-invalid');box.textContent=''}
    };
    const checkUser=()=>{
      const v=user.value.trim();
      const msg=!v?tx('Gib einen Benutzernamen ein.','Enter a username.'):/^[\p{L}\p{N}]{3,20}$/u.test(v)?'':tx('Der Benutzername braucht 3–20 Buchstaben oder Ziffern, ohne Leerzeichen.','The username needs 3–20 letters or digits, no spaces.');
      setErr(user,msg);return !msg;
    };
    const checkPw=()=>{
      const v=pw.value,open=Object.values(RULES).filter(f=>!f(v)).length;
      const msg=!v?tx('Gib ein Passwort ein.','Enter a password.'):open?tx(`Das Passwort erfüllt ${open===1?'eine Anforderung':open+' Anforderungen'} noch nicht.`,`The password doesn’t meet ${open===1?'one requirement':open+' requirements'} yet.`):'';
      setErr(pw,msg);return !msg;
    };
    const marks=()=>{
      $$('[data-rule]',root).forEach(li=>{
        const met=RULES[li.dataset.rule](pw.value);
        li.classList.toggle('is-met',met);
        $('.describedby-st',li).textContent=met?tx(' – erfüllt.',' – met.'):tx(' – noch offen.',' – not met yet.');
      });
    };
    user.addEventListener('input',()=>{ok.textContent='';if(tried||user.hasAttribute('aria-invalid'))checkUser()});
    pw.addEventListener('input',()=>{ok.textContent='';marks();if(tried||pw.hasAttribute('aria-invalid'))checkPw()});
    form.addEventListener('submit',e=>{
      e.preventDefault();tried=true;
      const u=checkUser(),p=checkPw();
      if(!u)user.focus();else if(!p)pw.focus();
      else ok.textContent=tx('Konto angelegt – nur eine Übung, nichts wurde gespeichert.','Account created – just practice, nothing was stored.');
    });
    root.addEventListener('click',e=>{if(e.target.closest('.describedby-try'))toast({msg:tx('Nur eine Übung – es ist nichts passiert.','Just practice – nothing happened.'),duration:2500})});
  },
  css:`.describedby-form{display:flex;flex-direction:column;align-items:flex-start;gap:16px;max-width:26rem;margin-bottom:28px}
.describedby-form .field{width:100%}
.lesson .describedby-h{margin:0 0 8px;font-size:1rem}
.describedby-form .describedby-h{margin:0}
.describedby-rules{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.875rem;color:var(--muted)}
.describedby-rules li{display:flex;gap:6px;align-items:center}
.describedby-mark{display:inline-flex;flex:none}
.describedby-mark .ic{width:16px;height:16px}
.describedby-on{display:none}
.describedby-rules .is-met{color:var(--success);font-weight:700}
.is-met .describedby-on{display:inline}
.is-met .describedby-off{display:none}
.describedby-form .err:empty{display:none}
.describedby-ok{margin:0;min-height:1.5em;font-weight:700;color:var(--success)}
.describedby-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;align-items:start}
.describedby-item{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.describedby-cap{margin:0;display:flex;gap:6px;align-items:center;font:700 .8125rem/1.3 var(--font-mono)}
.describedby-cap .ic{width:18px;height:18px;flex:none}
.describedby-yes .describedby-cap{color:var(--success)}
.describedby-meh .describedby-cap{color:var(--muted)}`,
  bad:{code:tx(`<label for="pw">Neues Passwort</label>
<input id="pw" type="password" class="error">
<p class="hint">Mindestens 12 Zeichen, eine Ziffer.</p>
<p class="error-text">Passwort zu kurz.</p>`,`<label for="pw">New password</label>
<input id="pw" type="password" class="error">
<p class="hint">At least 12 characters, one digit.</p>
<p class="error-text">Password too short.</p>`),
    note:tx('Hinweis und Fehler stehen nur optisch daneben. Im Feld hört man „Neues Passwort, Eingabefeld“ – vom Fehler nur ein roter Rahmen, den niemand hört.','Hint and error only sit next to the field visually. In the field you hear “New password, edit” – the error is just a red border nobody can hear.')},
  good:{code:tx(`<label for="pw">Neues Passwort</label>
<p id="pw-hint">Mindestens 12 Zeichen, eine Ziffer.</p>
<input id="pw" type="password"
       aria-describedby="pw-err pw-hint"
       aria-invalid="true">
<p id="pw-err">Passwort zu kurz.</p>`,`<label for="pw">New password</label>
<p id="pw-hint">At least 12 characters, one digit.</p>
<input id="pw" type="password"
       aria-describedby="pw-err pw-hint"
       aria-invalid="true">
<p id="pw-err">Password too short.</p>`),
    note:tx('Zwei IDs, Fehler zuerst. Ohne Fehler bleibt <code>#pw-err</code> leer im DOM – ein leeres Element trägt nichts bei, und die Verknüpfung muss nicht umgebaut werden.','Two IDs, error first. Without an error <code>#pw-err</code> stays empty in the DOM – an empty element contributes nothing, and the reference doesn’t need rewiring.')},
  native:tx('Nur zum Teil. Für den Namen hat HTML <code>&lt;label&gt;</code>, für die Beschreibung gibt es kein Gegenstück – außer <code>title</code>, das zur Beschreibung wird, wenn der Name schon anderswo herkommt; den Tooltip sieht aber nur, wer mit der Maus darüberfährt. Die eingebaute Browser-Validierung (<code>required</code>, <code>type="email"</code>) zeigt Fehler als Sprechblase, die Screenreader meist ansagen – gestalten lässt sie sich kaum, und sie verschwindet schnell. Für dauerhaft sichtbare Hinweise und Fehlermeldungen ist <code>aria-describedby</code> der Standardweg.','Only partly. For the name HTML has <code>&lt;label&gt;</code>, for the description there’s no counterpart – except <code>title</code>, which becomes the description when the name already comes from elsewhere; but only mouse users ever see the tooltip. Built-in browser validation (<code>required</code>, <code>type="email"</code>) shows errors as a bubble that screen readers usually announce – but you can barely style it and it disappears quickly. For persistently visible hints and error messages, <code>aria-describedby</code> is the standard way.'),
  do:tx([
    'Formatangaben, Anforderungen und Fehlermeldungen per <code>aria-describedby</code> ans Feld hängen.',
    'Mehrere IDs in sinnvoller Reihenfolge: Fehler vor Hinweis.',
    'Das Element für den Fehler immer im DOM lassen und nur seinen Text tauschen.',
    '<code>aria-invalid="true"</code> zusammen mit der Meldung setzen und wieder entfernen, sobald die Eingabe passt.',
    'Nach dem Absenden den Fokus ins erste fehlerhafte Feld setzen – dann wird die Meldung sofort vorgelesen.'
  ],[
    'Attach format help, requirements and error messages to the field with <code>aria-describedby</code>.',
    'Several IDs in a sensible order: error before hint.',
    'Keep the error element in the DOM at all times and only swap its text.',
    'Set <code>aria-invalid="true"</code> together with the message and remove it as soon as the input is fine.',
    'After submitting, move focus into the first invalid field – then the message is read out immediately.'
  ]),
  dont:tx([
    'Den Namen in die Beschreibung packen oder umgekehrt – „Passwort“ ist Name, „mindestens 12 Zeichen“ Beschreibung.',
    'Links, Listen oder Buttons in einer Beschreibung erwarten: Sie wird als reiner Text vorgelesen, bedienen kann man darin nichts.',
    'Einen versteckten Fehlertext mit altem Inhalt referenzieren – über <code>aria-describedby</code> wird auch versteckter Text vorgelesen.',
    'Lange Absätze als Beschreibung: Man hört sie bei jedem Fokus wieder von vorn.'
  ],[
    'Putting the name into the description or vice versa – “Password” is the name, “at least 12 characters” the description.',
    'Expecting links, lists or buttons in a description to work: it’s read as plain text, nothing in it can be operated.',
    'Referencing a hidden error element with stale content – text referenced via <code>aria-describedby</code> is read even when hidden.',
    'Long paragraphs as descriptions: you hear them from the start on every focus.'
  ]),
  ng:tx('<p>Angular Material nimmt dir die Verkabelung ab: <code>&lt;mat-form-field&gt;</code> hängt die IDs von <code>&lt;mat-hint&gt;</code> und <code>&lt;mat-error&gt;</code> automatisch an das <code>aria-describedby</code> des Felds und setzt <code>aria-invalid</code>. Ohne Material bindest du selbst: <code>[attr.aria-invalid]</code> mit <code>null</code>, solange nichts falsch ist, und ein festes <code>aria-describedby</code> auf Elemente, die immer da sind. Für Beschreibungen ohne sichtbaren Text gibt es im CDK den <code>AriaDescriber</code> aus <code>@angular/cdk/a11y</code> – ihn nutzt z. B. <code>matTooltip</code>.</p>','<p>Angular Material does the wiring for you: <code>&lt;mat-form-field&gt;</code> automatically adds the IDs of <code>&lt;mat-hint&gt;</code> and <code>&lt;mat-error&gt;</code> to the field’s <code>aria-describedby</code> and sets <code>aria-invalid</code>. Without Material you bind it yourself: <code>[attr.aria-invalid]</code> with <code>null</code> as long as nothing is wrong, and a fixed <code>aria-describedby</code> pointing to elements that are always there. For descriptions without visible text the CDK has <code>AriaDescriber</code> from <code>@angular/cdk/a11y</code> – <code>matTooltip</code> uses it, for example.</p>'),
  ngCode:`@Component({
  selector: 'app-password-field',
  imports: [ReactiveFormsModule],
  template: \`
    <label for="pw">New password</label>
    <p id="pw-hint">At least 12 characters, one digit.</p>
    <input id="pw" type="password" autocomplete="new-password" [formControl]="pw"
           aria-describedby="pw-error pw-hint"
           [attr.aria-invalid]="showError() ? 'true' : null">
    <\!-- Always rendered, only the text is conditional -->
    <p id="pw-error" class="error">
      @if (showError()) { The password must be at least 12 characters long. }
    </p>
  \`,
})
export class PasswordField {
  protected readonly pw = new FormControl('', [Validators.required, Validators.minLength(12)]);
  protected showError() {
    return this.pw.invalid && this.pw.touched;
  }
}`,
  why:tx('<p>Wer einen Screenreader nutzt, springt mit <kbd>Tab</kbd> von Feld zu Feld und hört nur, was am Feld hängt. Ohne Beschreibung heißt es „Neues Passwort, Eingabefeld“ – die Anforderungen darüber und der rote Fehler darunter bleiben unbemerkt, bis man die Seite Zeile für Zeile absucht. Mit <code>aria-describedby</code> und <code>aria-invalid</code> klingt dasselbe Feld „Neues Passwort, Eingabefeld, ungültige Eingabe, Das Passwort erfüllt 2 Anforderungen noch nicht. Mindestens 12 Zeichen – erfüllt. Mindestens eine Ziffer – noch offen. …“</p><p>Name und Beschreibung sind bewusst getrennt: Den Namen hört man immer und sofort, die Beschreibung oft erst nach einer kurzen Pause, und in vielen Screenreadern lässt sie sich abschalten. Darum gehört „Passwort“ in den Namen und „mindestens 12 Zeichen“ in die Beschreibung – und nicht umgekehrt.</p>','<p>Screen reader users jump from field to field with <kbd>Tab</kbd> and only hear what’s attached to the field. Without a description it’s “New password, edit” – the requirements above and the red error below go unnoticed until you search the page line by line. With <code>aria-describedby</code> and <code>aria-invalid</code> the same field sounds like “New password, edit, invalid entry, The password doesn’t meet 2 requirements yet. At least 12 characters – met. At least one digit – not met yet. …”</p><p>Name and description are separated on purpose: you always hear the name, immediately; the description often comes after a short pause, and many screen readers let you switch it off. That’s why “Password” goes into the name and “at least 12 characters” into the description – not the other way round.</p>')
});

  rule:tx('Ein modaler Dialog braucht vier Dinge: eine Rolle mit Namen, einen <strong>stummen Hintergrund</strong>, den <strong>Fokus im Dialog</strong> und beim Schließen den <strong>Fokus zurück auf dem Auslöser</strong>. Das native <code>&lt;dialog&gt;</code> mit <code>showModal()</code> erledigt fast alles davon selbst.','A modal dialog needs four things: a role with a name, a <strong>silent background</strong>, <strong>focus inside the dialog</strong> and, on close, <strong>focus back on the trigger</strong>. The native <code>&lt;dialog&gt;</code> with <code>showModal()</code> does almost all of it by itself.'),
  attrs:[
    ['<dialog> + showModal()','',tx('HTML: bringt Rolle <code>dialog</code>, macht den Rest der Seite inert, setzt den Fokus hinein, schließt mit <kbd>Esc</kbd> und gibt den Fokus beim Schließen zurück.','HTML: brings the <code>dialog</code> role, makes the rest of the page inert, moves focus inside, closes on <kbd>Esc</kbd> and returns focus on close.')],
    ['role="dialog"','',tx('Implizit bei <code>&lt;dialog&gt;</code>. Explizit nur bei selbst gebauten Dialogen.','Implicit on <code>&lt;dialog&gt;</code>. Explicit only for custom-built dialogs.')],

    ['aria-labelledby','ID',tx('Zeigt auf die Überschrift des Dialogs – der Name, der beim Öffnen angesagt wird.','Points to the dialog’s heading – the name announced on open.')],
    ['aria-describedby','ID',tx('Zeigt auf den erklärenden Text. Beim <code>alertdialog</code> Pflicht, damit die Frage mit angesagt wird.','Points to the explanatory text. A must for <code>alertdialog</code>, so the question is announced too.')],
    ['aria-modal','true',tx('Nur bei selbst gebauten Dialogen: sagt Hilfstechnik, dass der Rest nicht erreichbar ist. Bei <code>showModal()</code> überflüssig.','Only for custom dialogs: tells assistive tech the rest is unreachable. Redundant with <code>showModal()</code>.')],
    ['autofocus','',tx('HTML: welches Element beim Öffnen den Fokus bekommt. Beim Löschen-Dialog die harmlose Wahl („Abbrechen“).','HTML: which element gets focus on open. In a delete dialog, the harmless choice (“Cancel”).')],

<p class="demo-note">${tx('Öffne rechts beide Dialoge mit <kbd>Enter</kbd>: Der Fokus springt hinein (beim Umbenennen ins Feld, beim Löschen auf „Abbrechen“), <kbd>Tab</kbd> bleibt im Dialog, <kbd>Esc</kbd> schließt, danach steht der Fokus wieder am Auslöser. Links bleibt der Fokus draußen, <kbd>Tab</kbd> wandert in die Seite dahinter und <kbd>Esc</kbd> tut nichts. Solange ein Dialog offen ist, liegt der Inspektor abgedunkelt dahinter – genau das heißt modal.','Open both dialogs on the right with <kbd>Enter</kbd>: focus jumps inside (into the field for rename, onto “Cancel” for delete), <kbd>Tab</kbd> stays in the dialog, <kbd>Esc</kbd> closes, and focus is back on the trigger. On the left, focus stays outside, <kbd>Tab</kbd> wanders into the page behind and <kbd>Esc</kbd> does nothing. While a dialog is open, the inspector sits dimmed behind it – that’s exactly what modal means.')}</p>`,
  init(root){
    const fake=$('#dialog-fake',root);
    $('#dialog-bad-open',root).addEventListener('click',()=>{fake.hidden=false});
    fake.addEventListener('click',e=>{if(e.target.closest('[data-close]'))fake.hidden=true});

    const ren=$('#dialog-rename',root),del=$('#dialog-delete',root),input=$('#dialog-input',root),status=$('#dialog-status',root);
    const row=$('#dialog-row',root),gone=$('#dialog-gone',root),renBtn=$('#dialog-rename-open',root),delBtn=$('#dialog-del-open',root);
    let name=tx('Q3-Bericht','Q3 report'),off=false;
    const say=m=>{status.textContent=m};
    renBtn.addEventListener('click',()=>{say('');input.value=name;ren.returnValue='';ren.showModal();input.select()});
    // Abbrechen als type="button": sonst wäre es der erste Submit-Button und Enter im Feld würde abbrechen
    $('#dialog-rename-cancel',root).addEventListener('click',()=>ren.close('cancel'));
    delBtn.addEventListener('click',()=>{say('');del.returnValue='';del.showModal()});
    // Der Browser gibt den Fokus beim Schließen selbst zurück; explizit ist es robuster
    // und nötig, wenn der Auslöser danach verschwindet (Löschen).
    ren.addEventListener('close',()=>{
      if(off)return;
      const v=input.value.trim();
      if(ren.returnValue==='save'&&v&&v!==name){name=v;$$('.dialog-name',root).forEach(s=>{s.textContent=v});say(tx(`Umbenannt in „${v}“.`,`Renamed to “${v}”.`))}
      renBtn.focus();
    });
    del.addEventListener('close',()=>{
      if(off)return;
      if(del.returnValue==='delete'){row.hidden=true;gone.hidden=false;$('#dialog-restore',root).focus();say(tx(`„${name}“ gelöscht.`,`“${name}” deleted.`))}
      else delBtn.focus();
    });
    $('#dialog-restore',root).addEventListener('click',()=>{gone.hidden=true;row.hidden=false;delBtn.focus();say(tx(`„${name}“ wiederhergestellt.`,`“${name}” restored.`))});
    return()=>{off=true;[ren,del].forEach(d=>{if(d.open)d.close()})};
  },

    note:tx('<code>showModal()</code> macht die Seite inert, setzt den Fokus auf <code>autofocus</code> und schließt bei <kbd>Esc</kbd>. <code>&lt;form method="dialog"&gt;</code> schließt beim Klick auf einen Button und legt dessen <code>value</code> in <code>returnValue</code>.','<code>showModal()</code> makes the page inert, puts focus on <code>autofocus</code> and closes on <kbd>Esc</kbd>. <code>&lt;form method="dialog"&gt;</code> closes on a button click and puts its <code>value</code> into <code>returnValue</code>.')},
  native:tx('Ja – nimm <code>&lt;dialog&gt;</code> mit <code>showModal()</code>. Es läuft in allen aktuellen Browsern und liefert Rolle, inerten Hintergrund, Fokus hinein, <kbd>Esc</kbd> und den Fokus zurück. Wichtig: nur <code>showModal()</code> ist modal; <code>show()</code> oder das <code>open</code>-Attribut öffnen einen nicht-modalen Dialog ohne all das. Selbst bauen musst du nur, wenn du ältere Browser unterstützen musst: dann <code>role="dialog"</code> (oder <code>alertdialog</code>) mit <code>aria-modal="true"</code>, eine Fokusfalle für <kbd>Tab</kbd>/<kbd>Umschalt</kbd>+<kbd>Tab</kbd>, <kbd>Esc</kbd>-Handler, <code>inert</code> auf allen Geschwistern des Dialogs und die Fokus-Rückgabe von Hand.','Yes – use <code>&lt;dialog&gt;</code> with <code>showModal()</code>. It works in all current browsers and provides the role, an inert background, focus inside, <kbd>Esc</kbd> and focus return. Important: only <code>showModal()</code> is modal; <code>show()</code> or the <code>open</code> attribute open a non-modal dialog without any of that. You only need to build it yourself if you must support older browsers: then <code>role="dialog"</code> (or <code>alertdialog</code>) with <code>aria-modal="true"</code>, a focus trap for <kbd>Tab</kbd>/<kbd>Shift</kbd>+<kbd>Tab</kbd>, an <kbd>Esc</kbd> handler, <code>inert</code> on all siblings of the dialog and manual focus return.'),
  do:tx([
    'Den Dialog über <code>aria-labelledby</code> nach seiner sichtbaren Überschrift benennen.',
    'Beim Öffnen den Fokus sinnvoll setzen: aufs erste Feld – bei destruktiven Rückfragen auf die harmlose Option.',
    '<code>role="alertdialog"</code> plus <code>aria-describedby</code> für Rückfragen wie „Wirklich löschen?“.',
    'Beim Schließen den Fokus auf den Auslöser zurücksetzen – und wenn der nicht mehr existiert, auf das nächste sinnvolle Element.',
    'Bei selbst gebauten Dialogen den Hintergrund mit <code>inert</code> sperren, nicht nur optisch abdunkeln.'
  ],[
    'Name the dialog after its visible heading via <code>aria-labelledby</code>.',
    'Place focus sensibly on open: on the first field – for destructive questions, on the harmless option.',
    '<code>role="alertdialog"</code> plus <code>aria-describedby</code> for questions like “Really delete?”.',
    'On close, return focus to the trigger – and if that no longer exists, to the next sensible element.',
    'In custom dialogs, lock the background with <code>inert</code>, don’t just dim it visually.'
  ]),
  dont:tx([
    'Ein &lt;div&gt; mit hohem <code>z-index</code> als „Dialog“, ohne Rolle, Namen und Fokusmanagement.',
    '<code>aria-modal="true"</code> setzen, ohne den Hintergrund wirklich zu sperren – dann lügt das Attribut.',
    'Den Hintergrund mit <code>aria-hidden="true"</code> verstecken, aber fokussierbar lassen – der Fokus landet im Nichts.',

  ],[

  ng:tx('<p>Der native <code>&lt;dialog&gt;</code> funktioniert in Angular direkt: Referenz per <code>viewChild</code>, dann <code>showModal()</code>; auf das <code>(close)</code>-Event reagieren. Hast du <code>FormsModule</code> importiert, hängt sich <code>ngForm</code> an jedes <code>&lt;form&gt;</code> – stört es <code>method="dialog"</code>, schaltest du es mit dem Attribut <code>ngNoForm</code> ab. Für Dialoge aus dem Code heraus gibt es <code>Dialog</code> aus <code>@angular/cdk/dialog</code> und <code>MatDialog</code> aus Angular Material: Beide sperren den Hintergrund, fangen den Fokus und geben ihn zurück; per Konfiguration setzt du <code>role: \'alertdialog\'</code>, <code>ariaLabelledBy</code>, <code>ariaDescribedBy</code>, <code>autoFocus</code> und <code>restoreFocus</code>. Für eigene Overlays gibt es <code>cdkTrapFocus</code> aus <code>@angular/cdk/a11y</code>.</p>','<p>The native <code>&lt;dialog&gt;</code> works in Angular directly: get a reference via <code>viewChild</code>, call <code>showModal()</code>, react to the <code>(close)</code> event. If you imported <code>FormsModule</code>, <code>ngForm</code> attaches to every <code>&lt;form&gt;</code> – if it gets in the way of <code>method="dialog"</code>, switch it off with the <code>ngNoForm</code> attribute. For dialogs opened from code there is <code>Dialog</code> from <code>@angular/cdk/dialog</code> and <code>MatDialog</code> from Angular Material: both lock the background, trap focus and return it; via the config you set <code>role: \'alertdialog\'</code>, <code>ariaLabelledBy</code>, <code>ariaDescribedBy</code>, <code>autoFocus</code> and <code>restoreFocus</code>. For custom overlays there is <code>cdkTrapFocus</code> from <code>@angular/cdk/a11y</code>.</p>'),
  ngCode:`@Component({
  selector: 'app-delete-draft',
  template: \`
    <button type="button" (click)="open()">Delete</button>

    <dialog #dlg role="alertdialog" aria-labelledby="del-h"
            aria-describedby="del-p" (close)="onClose()">
      <form method="dialog">
        <h2 id="del-h">Delete draft?</h2>
        <p id="del-p">“{{ name() }}” will be deleted permanently.</p>
        <button value="cancel" autofocus>Cancel</button>
        <button value="delete">Delete</button>
      </form>
    </dialog>
  \`,
})
export class DeleteDraft {
  readonly name = input.required<string>();
  readonly deleted = output<void>();
  private readonly dlg = viewChild.required<ElementRef<HTMLDialogElement>>('dlg');

  protected open() {
    const d = this.dlg().nativeElement;
    d.returnValue = '';
    d.showModal();
  }
  protected onClose() {
    if (this.dlg().nativeElement.returnValue === 'delete') this.deleted.emit();
  }
}`,
  why:tx('<p>Ohne Dialog-Semantik drückt ein Screenreader-Nutzer auf „Löschen“ – und hört nichts. Der Fokus bleibt auf dem Button, das Pop-up steht irgendwo im Code, und wer weiterliest oder <kbd>Tab</kbd> drückt, landet in der Seite dahinter. Mit <code>showModal()</code> und <code>alertdialog</code> heißt es sofort: „Entwurf löschen?, Warndialog, ‚Q3-Bericht‘ wird endgültig gelöscht. – Abbrechen, Schalter“. Die Frage, der Kontext und die sichere Antwort in einem Satz.</p><p>„Modal“ bedeutet für Hilfstechnik: Außerhalb des Dialogs gibt es nichts. Auch der Lesemodus kommt nicht mehr in den Hintergrund, man kann sich nicht verirren. Und weil der Fokus beim Schließen auf den Auslöser zurückkehrt, geht es genau dort weiter, wo man war – statt wieder ganz oben auf der Seite.</p>','<p>Without dialog semantics a screen reader user presses “Delete” – and hears nothing. Focus stays on the button, the pop-up sits somewhere in the code, and reading on or pressing <kbd>Tab</kbd> leads into the page behind it. With <code>showModal()</code> and <code>alertdialog</code> it’s right there: “Delete draft?, alert dialog, ‘Q3 report’ will be deleted permanently. – Cancel, button”. The question, the context and the safe answer in one go.</p><p>For assistive tech, “modal” means: nothing exists outside the dialog. Browse mode can’t reach the background either, so you can’t get lost. And because focus returns to the trigger on close, you continue exactly where you were – instead of back at the top of the page.</p>')
});

LESSONS.push({
  id:'expanded',cat:'states',
  title:tx('Auf- und zuklappen: aria-expanded','Expand and collapse: aria-expanded'),
  short:tx('Der Button sagt, ob das, was er steuert, gerade offen ist.','The button says whether what it controls is open right now.'),
  keys:'aria-expanded aria-controls aufklappen zuklappen disclosure akkordeon details summary expand collapse accordion',
  refs:['WAI-ARIA 1.2: aria-expanded','APG: Disclosure','WCAG 4.1.2'],
  rule:tx('<code>aria-expanded</code> gehört auf den Auslöser – den Button –, nicht auf den Inhalt, der auf- und zuklappt. Es sagt nur eins: Ist der gesteuerte Bereich gerade offen?','<code>aria-expanded</code> belongs on the trigger – the button –, not on the content that expands and collapses. It says one thing only: is the controlled area open right now?'),
  attrs:[
    ['aria-expanded','true | false',tx('Am Button. Zeigt, ob der gesteuerte Bereich offen ist. Bei jedem Klick aktualisieren.','On the button. Tells whether the controlled area is open. Update it on every click.')],
    ['aria-controls','ID',tx('Verweist auf den Bereich, der auf- und zuklappt. Nur wenige Screenreader nutzen es – schadet nicht, ersetzt aber nichts.','Points to the area that expands and collapses. Few screen readers use it – harmless, but it replaces nothing.')],
    ['hidden','',tx('HTML, kein ARIA: versteckt den zugeklappten Inhalt visuell und im Accessibility Tree.','HTML, not ARIA: hides the collapsed content visually and from the accessibility tree.')]
  ],
  demo:`<div class="expanded-grid">
  <div class="expanded-col expanded-no">
    <p class="expanded-cap">${ic('xc')} ${tx('So nicht: &lt;div&gt; mit Klick','Don’t: &lt;div&gt; with click')}</p>
    <div class="expanded-q" id="expanded-bad-q">${tx('Wie hoch sind die Versandkosten?','How much is shipping?')} ${ic('down')}</div>
    <div class="expanded-a" id="expanded-bad-a" hidden>${tx('Ab 50 € versenden wir kostenlos, darunter kostet es 4,90 €.','Shipping is free from €50, below that it’s €4.90.')}</div>
  </div>
  <div class="expanded-col expanded-yes">

    <button type="button" class="expanded-q" id="expanded-good-q" aria-expanded="false" aria-controls="expanded-good-a">${tx('Wie hoch sind die Versandkosten?','How much is shipping?')} ${ic('down')}</button>
    <div class="expanded-a" id="expanded-good-a" hidden>${tx('Ab 50 € versenden wir kostenlos, darunter kostet es 4,90 €.','Shipping is free from €50, below that it’s €4.90.')}</div>
  </div>
  <div class="expanded-col expanded-yes">
    <p class="expanded-cap">${ic('ok')} ${tx('Nativ: &lt;details&gt;','Native: &lt;details&gt;')}</p>
    <details class="expanded-details"><summary class="expanded-q">${tx('Wie lange dauert die Lieferung?','How long does delivery take?')} ${ic('down')}</summary><div class="expanded-a">${tx('Ein bis zwei Werktage innerhalb Österreichs.','One to two business days within Austria.')}</div></details>
  </div>
</div>
<p class="demo-note">${tx('Probier alle drei mit <kbd>Tab</kbd> und <kbd>Enter</kbd>. Das &lt;div&gt; erreichst du gar nicht – und der Inspektor zeigt: keine Rolle, kein Zustand.','Try all three with <kbd>Tab</kbd> and <kbd>Enter</kbd>. You can’t even reach the &lt;div&gt; – and the inspector shows: no role, no state.')}</p>`,
  init(root){
    $('#expanded-bad-q',root).addEventListener('click',()=>{const a=$('#expanded-bad-a',root);a.hidden=!a.hidden});
    const b=$('#expanded-good-q',root),p=$('#expanded-good-a',root);
    b.addEventListener('click',()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));p.hidden=open});
  },
  css:`.expanded-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;align-items:start}
.expanded-cap{margin:0 0 8px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:.875rem}
.expanded-cap .ic{width:18px;height:18px}
.expanded-no .expanded-cap{color:var(--danger)}
.expanded-yes .expanded-cap{color:var(--success)}
.expanded-q{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;list-style:none}
.expanded-q::-webkit-details-marker{display:none}
.expanded-q .ic{transition:transform .15s}
.expanded-q[aria-expanded="true"] .ic,.expanded-details[open] .ic{transform:rotate(180deg)}
.expanded-a{padding:10px 12px;font-size:.9375rem}`,
  bad:{code:tx(`<div class="faq-question" onclick="toggle()">
  Wie hoch sind die Versandkosten?
</div>
<div class="faq-answer" style="display:none">…</div>`,`<div class="faq-question" onclick="toggle()">
  How much is shipping?
</div>
<div class="faq-answer" style="display:none">…</div>`),
    note:tx('Keine Rolle, nicht fokussierbar, kein Zustand. Mit Tastatur unerreichbar, der Screenreader liest nur Text.','No role, not focusable, no state. Unreachable by keyboard, the screen reader just reads text.')},
  good:{code:tx(`<button type="button" aria-expanded="false" aria-controls="versand">
  Wie hoch sind die Versandkosten?
</button>
<div id="versand" hidden>…</div>

<\x73cript>
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
  });
<\/script>`,`<button type="button" aria-expanded="false" aria-controls="shipping">
  How much is shipping?
</button>
<div id="shipping" hidden>…</div>

<\x73cript>
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
  });
<\/script>`),
    note:tx('Der Button bringt Rolle, Fokus und Enter/Leertaste mit; ARIA ergänzt nur den Zustand.','The button brings role, focus and Enter/Space; ARIA only adds the state.')},
  native:tx('Für einfache Aufklapper ja: <code>&lt;details&gt;</code> mit <code>&lt;summary&gt;</code> bringt Rolle, Zustand und Tastatur von selbst mit. Schalte „ARIA zeigen“ ein: Der Inspektor meldet <code>expanded</code>, ohne dass ein aria-Attribut im Code steht. ARIA brauchst du, wenn der Auslöser woanders steht als der Inhalt – Menü-Buttons, Filter-Panels, die Navigation am Handy.','For simple disclosures, yes: <code>&lt;details&gt;</code> with <code>&lt;summary&gt;</code> brings role, state and keyboard support by itself. Turn on “Show ARIA”: the inspector reports <code>expanded</code> without a single aria attribute in the code. You need ARIA when the trigger sits apart from the content – menu buttons, filter panels, the mobile navigation.'),
  do:tx([
    '<code>aria-expanded</code> auf den Auslöser setzen und bei jedem Öffnen und Schließen aktualisieren.',
    'Immer einen echten <code>&lt;button&gt;</code> als Auslöser nehmen.',
    'Den Zustand als Styling-Hook nutzen: <code>[aria-expanded="true"]</code> dreht den Pfeil – so kann die Anzeige nie vom ARIA-Zustand abweichen.',
    'Zugeklappten Inhalt mit <code>hidden</code> verstecken, damit er auch im Accessibility Tree fehlt.'
  ],[
    'Put <code>aria-expanded</code> on the trigger and update it on every open and close.',
    'Always use a real <code>&lt;button&gt;</code> as the trigger.',
    'Use the state as a styling hook: <code>[aria-expanded="true"]</code> rotates the arrow – so the visuals can never drift from the ARIA state.',
    'Hide collapsed content with <code>hidden</code> so it’s gone from the accessibility tree too.'
  ]),
  dont:tx([
    '<code>aria-expanded</code> auf den Inhalt setzen statt auf den Button.',
    'Den Zustand zusätzlich in den Namen schreiben („Details anzeigen“ / „Details ausblenden“) – dann hört man ihn doppelt.',
    '<code>aria-expanded</code> auf Links, die zu einer anderen Seite führen.',
    'Zugeklappten Inhalt nur mit <code>opacity:0</code> oder <code>height:0</code> verstecken – der Screenreader liest ihn trotzdem vor.'
  ],[
    'Putting <code>aria-expanded</code> on the content instead of the button.',
    'Also writing the state into the name (“Show details” / “Hide details”) – then you hear it twice.',
    '<code>aria-expanded</code> on links that lead to another page.',
    'Hiding collapsed content only with <code>opacity:0</code> or <code>height:0</code> – the screen reader still reads it.'
  ]),
  ng:tx('<p>ARIA-Attribute sind HTML-Attribute, keine DOM-Properties – darum bindet man sie mit <code>[attr.aria-expanded]</code>. Angular schreibt <code>true</code>/<code>false</code> als Text hinein; <code>null</code> würde das Attribut entfernen, und ein fehlendes <code>aria-expanded</code> heißt „nicht aufklappbar“, nicht „zu“. Angular Material (<code>mat-expansion-panel</code>) setzt die Attribute selbst; das CDK-Akkordeon (<code>cdkAccordionItem</code>) liefert nur den Zustand, die Attribute bindest du selbst.</p>','<p>ARIA attributes are HTML attributes, not DOM properties – so you bind them with <code>[attr.aria-expanded]</code>. Angular writes <code>true</code>/<code>false</code> as text; <code>null</code> would remove the attribute, and a missing <code>aria-expanded</code> means “not expandable”, not “closed”. Angular Material (<code>mat-expansion-panel</code>) sets the attributes itself; the CDK accordion (<code>cdkAccordionItem</code>) only provides the state, you bind the attributes yourself.</p>'),
  ngCode:`let nextId = 0;

@Component({
  selector: 'app-faq-item',
  template: \`
    <button type="button" (click)="open.set(!open())"
            [attr.aria-expanded]="open()" [attr.aria-controls]="panelId">
      <ng-content select="[question]" />
    </button>
    <div [id]="panelId" [hidden]="!open()">
      <ng-content />
    </div>
  \`,
})
export class FaqItem {
  protected readonly open = signal(false);
  protected readonly panelId = \`faq-panel-\${nextId++}\`;
}`,
  why:tx('<p>Ein Screenreader sieht nicht, dass ein Pfeil nach unten zeigt. Ohne <code>aria-expanded</code> hört man nur „Wie hoch sind die Versandkosten, Schalter“ – und weiß nicht, ob ein Klick etwas öffnet, schließt oder woanders hinführt. Mit dem Attribut heißt es „…, Schalter, reduziert“ und nach dem Klick „erweitert“.</p><p>Der Zustand hängt am Button, weil man ihn genau dort braucht: auf dem Element, auf dem man gerade steht. Der geöffnete Inhalt folgt danach im Lesefluss.</p>','<p>A screen reader can’t see that an arrow points down. Without <code>aria-expanded</code> you only hear “How much is shipping, button” – and don’t know whether a click opens, closes or goes somewhere else. With the attribute it’s “…, button, collapsed”, and after the click “expanded”.</p><p>The state lives on the button because that’s exactly where you need it: on the element you’re on. The opened content follows right after in reading order.</p>')
});

LESSONS.push({
  id:'focusmgmt',cat:'focus',
  title:tx('Fokusmanagement: wohin nach dem Klick?','Focus management: where to after the click?'),
  short:tx('Wenn etwas verschwindet oder sich die Ansicht ändert, setzt du den Fokus bewusst neu.','When something disappears or the view changes, you move focus on purpose.'),
  keys:'fokusmanagement focus management fokus verloren lost focus body löschen delete dialog overlay auslöser trigger seitenwechsel route change h1 skip link sprunglink tabindex -1',
  refs:['WCAG 2.4.3','WCAG 2.4.1','APG: Dialog (Modal)','APG: Developing a Keyboard Interface'],
  rule:tx('Verschwindet das fokussierte Element oder ändert sich die Ansicht, entscheidest <em>du</em>, wo der Fokus hingeht: aufs nächste sinnvolle Element, zurück auf den Auslöser oder auf die neue Überschrift. Nie auf <code>&lt;body&gt;</code> fallen lassen.','When the focused element disappears or the view changes, <em>you</em> decide where focus goes: to the next sensible element, back to the trigger or to the new heading. Never let it drop to <code>&lt;body&gt;</code>.'),
  attrs:[
    ['tabindex="-1"','',tx('Auf Überschriften und Containern, die per Script Fokus bekommen sollen, ohne ein Tab-Stopp zu werden.','On headings and containers that should receive focus by script without becoming a tab stop.')],
    ['element.focus()','{ preventScroll }',tx('JavaScript: verschiebt den Fokus. Das Ziel muss sichtbar und fokussierbar sein.','JavaScript: moves focus. The target must be visible and focusable.')],
    ['document.activeElement','',tx('JavaScript: wer gerade den Fokus hat. Vor dem Öffnen eines Overlays merken, beim Schließen wieder fokussieren.','JavaScript: who has focus right now. Remember it before opening an overlay, focus it again on close.')],
    ['inert','',tx('HTML: macht einen Bereich unerreichbar – für Maus, Tastatur und Screenreader. Hinter modalen Overlays.','HTML: makes an area unreachable – for mouse, keyboard and screen reader. Behind modal overlays.')],
    ['<a href="#main">','',tx('Skip-Link: das erste fokussierbare Element der Seite, springt direkt zum Hauptinhalt.','Skip link: the first focusable element on the page, jumps straight to the main content.')]
  ],
  demo:`<div class="focusmgmt-grid">
  <div class="focusmgmt-col focusmgmt-no">
    <h3 class="focusmgmt-cap" id="focusmgmt-bad-h">${ic('xc')} ${tx('Ohne Fokusmanagement','Without focus management')}</h3>
    <ul class="focusmgmt-list" id="focusmgmt-bad" aria-labelledby="focusmgmt-bad-h"></ul>
    <p class="focusmgmt-empty" id="focusmgmt-bad-empty" hidden>${tx('Alles erledigt.','All done.')}</p>
  </div>
  <div class="focusmgmt-col focusmgmt-yes">
    <h3 class="focusmgmt-cap" id="focusmgmt-good-h" tabindex="-1">${ic('ok')} ${tx('Mit Fokusmanagement','With focus management')}</h3>
    <ul class="focusmgmt-list" id="focusmgmt-good" aria-labelledby="focusmgmt-good-h"></ul>
    <p class="focusmgmt-empty" id="focusmgmt-good-empty" hidden>${tx('Alles erledigt.','All done.')}</p>
  </div>
</div>
<div class="focusmgmt-bar">
  <p class="focusmgmt-read" id="focusmgmt-read"><span class="focusmgmt-read-k">${tx('Fokus liegt auf:','Focus is on:')}</span> <code id="focusmgmt-where">—</code></p>
  <button type="button" class="btn btn-secondary" id="focusmgmt-reset">${ic('refresh')} ${tx('Listen zurücksetzen','Reset lists')}</button>
</div>
<p class="demo-note">${tx('<kbd>Tab</kbd> zu einem Mülleimer und <kbd>Enter</kbd>. Links landet der Fokus auf <code>&lt;body&gt;</code> – je nach Browser beginnt das nächste <kbd>Tab</kbd> wieder oben auf der Seite. Rechts springt er auf den nächsten Löschen-Button, nach dem letzten Eintrag auf den vorigen und bei leerer Liste auf die Überschrift. Einen Skip-Link hat diese Seite übrigens auch: Lade sie neu und drück einmal <kbd>Tab</kbd>.','<kbd>Tab</kbd> to a trash can and press <kbd>Enter</kbd>. On the left, focus lands on <code>&lt;body&gt;</code> – depending on the browser, the next <kbd>Tab</kbd> starts again at the top of the page. On the right, it jumps to the next delete button, after the last item to the previous one, and when the list is empty to the heading. By the way, this page has a skip link too: reload it and press <kbd>Tab</kbd> once.')}</p>`,
  init(root){
    const items=tx(['Milch','Brot','Äpfel','Kaffee'],['Milk','Bread','Apples','Coffee']);
    const fill=()=>['bad','good'].forEach(k=>{
      $(`#focusmgmt-${k}`,root).innerHTML=items.map(t=>`<li class="focusmgmt-item"><span>${esc(t)}</span><button type="button" class="icon-btn focusmgmt-del">${ic('trash')}<span class="sr-only">${tx('Löschen: ','Delete: ')}${esc(t)}</span></button></li>`).join('');
      $(`#focusmgmt-${k}-empty`,root).hidden=true;
    });
    const where=$('#focusmgmt-where',root),read=$('#focusmgmt-read',root);
    const show=()=>{
      const el=document.activeElement;
      const lost=!el||el===document.body||el===document.documentElement;
      if(lost)where.textContent=tx('<body> – der Fokus ist verloren gegangen','<body> – focus has been lost');
      else{
        let name=(el.getAttribute('aria-label')||el.textContent||el.value||'').replace(/\s+/g,' ').trim();
        if(name.length>40)name=name.slice(0,38)+'…';
        where.textContent=`<${el.localName}>${name?' '+tx(`„${name}“`,`“${name}”`):''}${root.contains(el)?'':tx(' – außerhalb des Beispiels',' – outside the example')}`;
      }
      read.classList.toggle('focusmgmt-lost',lost);
    };
    /* focusout feuert, bevor der neue Fokus feststeht – darum kurz warten und dann nachsehen */
    let t=0;
    const later=()=>{clearTimeout(t);t=setTimeout(show,0)};
    document.addEventListener('focusin',show);
    document.addEventListener('focusout',later);
    root.addEventListener('click',e=>{
      const b=e.target.closest('.focusmgmt-del');if(!b)return;
      const li=b.closest('li'),ul=li.parentElement,good=ul.id==='focusmgmt-good',name=li.firstElementChild.textContent;
      const next=li.nextElementSibling||li.previousElementSibling;
      li.remove();
      if(!ul.children.length)$(`#${ul.id}-empty`,root).hidden=false;
      if(good){
        (next?$('.focusmgmt-del',next):$('#focusmgmt-good-h',root)).focus();
        announce(tx(`„${name}“ gelöscht.`,`“${name}” deleted.`));
      }
      show();
    });
    $('#focusmgmt-reset',root).addEventListener('click',()=>{fill();show()});
    fill();show();
    return()=>{document.removeEventListener('focusin',show);document.removeEventListener('focusout',later);clearTimeout(t)};
  },
  css:`.focusmgmt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;align-items:start}
.focusmgmt-col{min-width:0}

.focusmgmt-read.focusmgmt-lost code{color:var(--danger);font-weight:700}`,
  bad:{code:tx(`loeschen.addEventListener('click', () => {
  eintrag.remove();       // Fokus fällt auf <body>
});

schliessen.addEventListener('click', () => {
  overlay.hidden = true;  // Fokus war im Overlay – jetzt nirgends

router.navigate('/konto');  // neue Ansicht, Fokus bleibt irgendwo`,`deleteBtn.addEventListener('click', () => {

});

closeBtn.addEventListener('click', () => {

router.navigate('/account');  // new view, focus stays somewhere`),
    note:tx('Jedes Mal verschwindet das Element, auf dem der Fokus stand. Der Screenreader verliert die Position, und das nächste <kbd>Tab</kbd> beginnt je nach Browser von vorn.','Every time, the element that had focus disappears. The screen reader loses its position, and depending on the browser the next <kbd>Tab</kbd> starts from the beginning.')},
  good:{code:tx(`loeschen.addEventListener('click', () => {

const ausloeser = document.activeElement;   // vor dem Öffnen merken

// … beim Schließen:

// nach dem Seitenwechsel: <h1 tabindex="-1">Konto</h1>
document.querySelector('h1').focus();`,`deleteBtn.addEventListener('click', () => {

const trigger = document.activeElement;   // remember before opening

    note:tx('Drei Situationen, eine Regel: Bevor das fokussierte Element verschwindet, steht fest, wer den Fokus als Nächstes bekommt.','Three situations, one rule: before the focused element disappears, it’s settled who gets focus next.')},
  native:tx('Teilweise. Ein mit <code>showModal()</code> geöffneter <code>&lt;dialog&gt;</code> macht den Rest der Seite unerreichbar und gibt den Fokus beim Schließen an das vorher fokussierte Element zurück. Ein Skip-Link ist nur ein <code>&lt;a href="#main"&gt;</code> auf ein Ziel mit ID – ein <code>tabindex="-1"</code> auf dem Ziel macht ihn zuverlässiger. Für Löschen und Seitenwechsel in Single-Page-Apps gibt es nichts Natives: Ein klassischer Seitenaufruf setzt den Fokus von selbst an den Anfang, eine SPA nicht – das musst du nachbauen.','Partly. A <code>&lt;dialog&gt;</code> opened with <code>showModal()</code> makes the rest of the page unreachable and returns focus to the previously focused element on close. A skip link is just an <code>&lt;a href="#main"&gt;</code> to a target with an ID – a <code>tabindex="-1"</code> on the target makes it more reliable. For deleting and for route changes in single-page apps there’s nothing native: a classic page load resets focus to the start by itself, an SPA doesn’t – you have to rebuild that.'),
  do:tx([
    'Nach dem Löschen den nächsten Eintrag fokussieren, beim letzten den vorigen, bei leerer Liste die Überschrift.',
    'Vor dem Öffnen eines Overlays <code>document.activeElement</code> merken und beim Schließen dorthin zurück.',
    'Nach einem Seitenwechsel in der SPA die neue <code>&lt;h1 tabindex="-1"&gt;</code> fokussieren und <code>document.title</code> anpassen.',
    'Einen Skip-Link als erstes fokussierbares Element: „Zum Inhalt springen“.',
    'Nicht Selbsterklärendes zusätzlich ansagen, etwa „Milch gelöscht“ über eine Live-Region.'
  ],[
    'After deleting, focus the next item, for the last one the previous, for an empty list the heading.',
    'Before opening an overlay, remember <code>document.activeElement</code> and return there on close.',
    'After a route change in an SPA, focus the new <code>&lt;h1 tabindex="-1"&gt;</code> and update <code>document.title</code>.',
    'A skip link as the first focusable element: “Skip to content”.',
    'Announce what isn’t self-evident, e.g. “Milk deleted” via a live region.'
  ]),
  dont:tx([
    'Das fokussierte Element entfernen oder verstecken, ohne zu entscheiden, wohin der Fokus geht.',
    'Den Fokus weit weg schicken, nur weil es bequem ist – etwa an den Seitenanfang.',
    'Den Fokus verschieben, ohne dass die Nutzerin etwas ausgelöst hat – beim Tippen oder durch Timer.',
    'Den Fokus nach dem Schließen eines Overlays auf ein Element setzen, das es gar nicht mehr gibt.'
  ],[
    'Removing or hiding the focused element without deciding where focus goes.',
    'Sending focus far away just because it’s convenient – like the top of the page.',
    'Moving focus without the user having triggered anything – while typing or by timers.',
    'Setting focus after closing an overlay to an element that no longer exists.'
  ]),
  ng:tx('<p>Angular rendert nach einer Signal-Änderung erst im nächsten Durchlauf – den Fokus setzt du deshalb in <code>afterNextRender()</code>, wenn das DOM schon stimmt. Für Overlays hilft das CDK: <code>cdkTrapFocus</code> mit <code>cdkTrapFocusAutoCapture</code> holt den Fokus beim Öffnen hinein und gibt ihn beim Zerstören zurück; <code>MatDialog</code> macht das von selbst (<code>restoreFocus</code> ist standardmäßig an). Für Seitenwechsel hörst du auf <code>NavigationEnd</code> aus <code>Router.events</code> und fokussierst dann die <code>h1</code>.</p>','<p>After a signal change Angular only renders in the next pass – so you set focus in <code>afterNextRender()</code>, when the DOM is already right. For overlays the CDK helps: <code>cdkTrapFocus</code> with <code>cdkTrapFocusAutoCapture</code> pulls focus in on open and hands it back on destroy; <code>MatDialog</code> does this by itself (<code>restoreFocus</code> is on by default). For route changes, listen for <code>NavigationEnd</code> from <code>Router.events</code> and then focus the <code>h1</code>.</p>'),
  ngCode:`@Component({
  selector: 'app-todo-list',
  template: \`
    <h2 #heading tabindex="-1">Shopping list</h2>
    <ul>
      @for (item of items(); track item.id; let i = $index) {
        <li>
          {{ item.text }}
          <button #deleteBtn type="button" (click)="remove(i)">
            Delete<span class="sr-only">: {{ item.text }}</span>
          </button>
        </li>
      }
    </ul>
  \`,
})
export class TodoList {
  protected readonly items = signal([{ id: 1, text: 'Milk' }, { id: 2, text: 'Bread' }]);
  private readonly heading = viewChild.required<ElementRef<HTMLElement>>('heading');
  private readonly buttons = viewChildren<ElementRef<HTMLButtonElement>>('deleteBtn');
  private readonly injector = inject(Injector);

  protected remove(i: number) {
    this.items.update(list => list.filter((_, j) => j !== i));
    afterNextRender(() => {
      const next = this.buttons()[Math.min(i, this.buttons().length - 1)];
      (next ?? this.heading()).nativeElement.focus();
    }, { injector: this.injector });
  }
}`,
  why:tx('<p>Links, nach dem Löschen: NVDA sagt nichts oder beginnt irgendwo oben. Die Nutzerin weiß nicht, ob das Löschen geklappt hat, und muss sich zur Liste zurückarbeiten. Rechts hört sie sofort „Löschen: Brot, Schalter“ – die Aktion hat funktioniert, sie steht wieder in der Liste und kann gleich weiterlöschen.</p><p>Bei Seitenwechseln in einer SPA ist es dasselbe: Sehende sehen die neue Seite, ein Screenreader-Nutzer hört nichts, weil der Fokus noch am angeklickten Link hängt. Mit Fokus auf der neuen Überschrift hört er „Konto, Überschrift, Ebene 1“ – die Bestätigung, dass er angekommen ist. Und nach dem Schließen eines Dialogs steht er wieder genau dort, wo er vorher war.</p>','<p>On the left, after deleting: NVDA says nothing or starts somewhere near the top. The user doesn’t know whether the delete worked and has to work her way back to the list. On the right she immediately hears “Delete: Bread, button” – the action worked, she’s back in the list and can keep deleting.</p><p>Route changes in an SPA are the same: sighted users see the new page, a screen reader user hears nothing because focus still hangs on the clicked link. With focus on the new heading he hears “Account, heading, level 1” – confirmation that he has arrived. And after closing a dialog he’s back exactly where he was before.</p>')
});

LESSONS.push({
  id:'forms',cat:'states',
  title:tx('Formularzustände: required, invalid, disabled','Form states: required, invalid, disabled'),
  short:tx('Pflichtfeld, Fehler, gesperrt, schreibgeschützt – und wie die Fehlermeldung zum Feld kommt.','Required, error, disabled, read-only – and how the error message gets to its field.'),
  keys:'formular form required aria-required aria-invalid fehler fehlermeldung error validation validierung aria-describedby aria-errormessage disabled aria-disabled readonly aria-readonly autocomplete pflichtfeld',
  refs:['WAI-ARIA 1.2: aria-invalid','WCAG 3.3.1','WCAG 1.3.5','WCAG 4.1.2'],
  rule:tx('Zustände kommen, wo immer es geht, aus HTML: <code>required</code>, <code>disabled</code>, <code>readonly</code>. <code>aria-invalid</code> setzt du erst, <strong>nachdem geprüft wurde</strong>, und verknüpfst die sichtbare Fehlermeldung per <code>aria-describedby</code> mit dem Feld – dann hört man Feld, Problem und Lösung, sobald der Fokus dort landet.','States come from HTML wherever possible: <code>required</code>, <code>disabled</code>, <code>readonly</code>. Set <code>aria-invalid</code> only <strong>after validation has happened</strong>, and link the visible error message to the field with <code>aria-describedby</code> – then you hear field, problem and fix as soon as focus lands there.'),
  attrs:[
    ['required','',tx('HTML: Pflichtfeld. Der Screenreader sagt „erforderlich“, der Browser prüft es beim Absenden (außer bei <code>novalidate</code>).','HTML: required field. The screen reader says “required”, the browser checks it on submit (unless <code>novalidate</code>).')],
    ['aria-required','true | false',tx('Dasselbe für eigene Widgets (<code>role="combobox"</code>, <code>role="radiogroup"</code> …). Auf <code>&lt;input&gt;</code> reicht <code>required</code>.','The same for custom widgets (<code>role="combobox"</code>, <code>role="radiogroup"</code> …). On <code>&lt;input&gt;</code>, <code>required</code> is enough.')],
    ['aria-invalid','true | false | grammar | spelling',tx('Der Wert ist ungültig. Erst nach der Prüfung setzen, wieder entfernen, sobald der Fehler behoben ist.','The value is invalid. Set it only after validation, remove it once the error is fixed.')],
    ['aria-describedby',tx('ID-Liste','ID list'),tx('Verknüpft Fehlermeldung und Hinweis mit dem Feld – Fehler zuerst. Wird nach Name, Rolle und Zustand vorgelesen.','Links the error message and hint to the field – error first. Read after name, role and state.')],
    ['aria-errormessage','ID',tx('Eigens für Fehlermeldungen, zählt nur bei <code>aria-invalid="true"</code>. Die Unterstützung ist lückenhaft – verlass dich auf <code>aria-describedby</code>.','Made for error messages, only counts with <code>aria-invalid="true"</code>. Support is patchy – rely on <code>aria-describedby</code>.')],
    ['disabled','',tx('HTML: gesperrt. Nicht fokussierbar, fehlt in der Tab-Reihenfolge, wird nicht mitgesendet.','HTML: disabled. Not focusable, missing from the tab order, not submitted.')],
    ['aria-disabled','true | false',tx('Gesperrt, aber <strong>fokussierbar und klickbar</strong>: Man findet den Button und hört den Grund. Die Aktion musst du im Klick-Handler selbst verhindern.','Disabled, but <strong>focusable and clickable</strong>: people find the button and hear why. You have to block the action in the click handler yourself.')],
    ['readonly / aria-readonly','true | false',tx('Lesbar und fokussierbar, aber nicht änderbar. <code>readonly</code> für <code>&lt;input&gt;</code> und <code>&lt;textarea&gt;</code>, <code>aria-readonly</code> für eigene Widgets wie <code>grid</code> oder <code>textbox</code>.','Readable and focusable, but not editable. <code>readonly</code> for <code>&lt;input&gt;</code> and <code>&lt;textarea&gt;</code>, <code>aria-readonly</code> for custom widgets such as <code>grid</code> or <code>textbox</code>.')],
    ['autocomplete','name | email | tel | street-address …',tx('HTML: sagt Browser und Hilfsmitteln, was ins Feld gehört. Sie können es ausfüllen – spart Tipparbeit und Fehler (WCAG 1.3.5).','HTML: tells browsers and assistive tech what belongs in the field. They can fill it in – saves typing and mistakes (WCAG 1.3.5).')]
  ],
  demo:`<form class="forms-form" id="forms-form" novalidate>
  <h3 class="forms-h">${tx('Schritt 1: Kontaktdaten','Step 1: Contact details')}</h3>
  <p class="hint">${tx('Felder mit * sind Pflichtfelder.','Fields marked * are required.')}</p>
  <div class="forms-fields">
    <div class="field">
      <label for="forms-name">${tx('Name','Name')} <span aria-hidden="true">*</span></label>
      <input class="input" id="forms-name" name="name" required autocomplete="name">
      <p class="err forms-err" id="forms-name-err"></p>
    </div>
    <div class="field">
      <label for="forms-email">${tx('E-Mail','Email')} <span aria-hidden="true">*</span></label>
      <input class="input" id="forms-email" name="email" type="email" required autocomplete="email" aria-describedby="forms-email-hint">
      <p class="err forms-err" id="forms-email-err"></p>
      <p class="hint" id="forms-email-hint">${tx('Hierhin schicken wir die Bestellbestätigung.','We’ll send the order confirmation here.')}</p>
    </div>
    <div class="field">
      <label for="forms-cust">${tx('Kundennummer','Customer number')}</label>
      <input class="input" id="forms-cust" name="customer" readonly value="AT-40711">
    </div>
  </div>
  <button type="submit" class="btn btn-primary">${tx('Weiter','Next')}</button>
  <p role="status" class="forms-status" id="forms-status"></p>
</form>
<div class="forms-step2">
  <h3 class="forms-h">${tx('Schritt 2: Bestellung absenden','Step 2: Place the order')}</h3>
  <p class="hint" id="forms-lock-why">${tx('Verfügbar, sobald Schritt 1 gültig ist.','Available once step 1 is valid.')}</p>
  <div class="forms-cmp">
    <div class="forms-col">
      <p class="forms-cap"><code>disabled</code></p>
      <button type="button" class="btn btn-secondary forms-lock" id="forms-dis" disabled>${tx('Bestellung absenden','Place order')}</button>
    </div>
    <div class="forms-col">
      <p class="forms-cap"><code>aria-disabled="true"</code></p>
      <button type="button" class="btn btn-secondary forms-lock" id="forms-adis" aria-disabled="true" aria-describedby="forms-lock-why">${tx('Bestellung absenden','Place order')}</button>
    </div>
  </div>
  <p role="status" class="forms-status" id="forms-status2"></p>
</div>
<p class="demo-note">${tx('Drück „Weiter“ mit leeren Feldern: <code>aria-invalid</code> erscheint erst jetzt, die Fehlermeldung hängt per <code>aria-describedby</code> am Feld, und der Fokus springt ins erste fehlerhafte Feld. Geh dann mit <kbd>Tab</kbd> weiter: Den <code>disabled</code>-Button überspringt der Fokus, den <code>aria-disabled</code>-Button erreichst du – samt Begründung. Es wird nichts gesendet.','Press “Next” with empty fields: <code>aria-invalid</code> only appears now, the error message is tied to the field via <code>aria-describedby</code>, and focus jumps to the first invalid field. Then keep pressing <kbd>Tab</kbd>: focus skips the <code>disabled</code> button, but reaches the <code>aria-disabled</code> one – including the reason. Nothing is sent.')}</p>`,
  init(root){
    const form=$('#forms-form',root),status=$('#forms-status',root),status2=$('#forms-status2',root);
    const dis=$('#forms-dis',root),adis=$('#forms-adis',root),why=$('#forms-lock-why',root);
    const fields=[
      {el:$('#forms-name',root),err:$('#forms-name-err',root),hint:'',
        msg:el=>el.value.trim()?'':tx('Bitte gib deinen Namen ein.','Please enter your name.')},
      {el:$('#forms-email',root),err:$('#forms-email-err',root),hint:'forms-email-hint',
        msg:el=>!el.value.trim()?tx('Bitte gib deine E-Mail-Adresse ein.','Please enter your email address.'):el.validity.typeMismatch?tx('Die E-Mail-Adresse ist unvollständig – zum Beispiel name@beispiel.at.','This email address is incomplete – for example name@example.com.'):''}
    ];
    const show=(f,m)=>{
      if(m){
        f.el.setAttribute('aria-invalid','true');
        f.err.innerHTML=`${ic('alert')}<span></span>`;$('span',f.err).textContent=m;
        f.el.setAttribute('aria-describedby',[f.err.id,f.hint].filter(Boolean).join(' '));
      }else{
        f.el.removeAttribute('aria-invalid');f.err.textContent='';
        if(f.hint)f.el.setAttribute('aria-describedby',f.hint);else f.el.removeAttribute('aria-describedby');
      }
    };
    const lock=on=>{
      dis.disabled=on;adis.setAttribute('aria-disabled',String(on));
      why.textContent=on?tx('Verfügbar, sobald Schritt 1 gültig ist.','Available once step 1 is valid.'):tx('Jetzt verfügbar.','Available now.');
    };
    form.addEventListener('submit',e=>{
      e.preventDefault();
      status.textContent='';
      const bad=fields.filter(f=>{const m=f.msg(f.el);show(f,m);return m});
      if(bad.length){lock(true);bad[0].el.focus();return}
      lock(false);
      status.textContent=tx('Schritt 1 ist gültig. „Bestellung absenden“ ist jetzt verfügbar.','Step 1 is valid. “Place order” is now available.');
    });
    /* Nur Felder, die schon als fehlerhaft markiert sind, beim Tippen neu prüfen – so verschwindet der Fehler, sobald er behoben ist */
    fields.forEach(f=>f.el.addEventListener('input',()=>{if(f.el.getAttribute('aria-invalid')==='true')show(f,f.msg(f.el))}));
    const click=()=>{status2.textContent=adis.getAttribute('aria-disabled')==='true'
      ?tx('Noch nicht verfügbar: Fülle zuerst Schritt 1 aus.','Not available yet: complete step 1 first.')
      :tx('Demo: Es wird nichts gesendet.','Demo: nothing is sent.')};
    adis.addEventListener('click',click);
    dis.addEventListener('click',click);
  },
  css:`.forms-form,.forms-step2{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.forms-step2{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}

.forms-fields .input[readonly]{background:var(--surface-2);border-style:dashed}

.forms-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.forms-cap{margin:0;font-size:.875rem;font-weight:700}
.forms-lock:disabled{opacity:.5;cursor:not-allowed}`,
  bad:{code:tx(`<label>E-Mail *</label>
<input type="email" aria-invalid="true">
<span class="error">Ungültig</span>

<button type="submit" disabled>Absenden</button>`,`<label>Email *</label>
<input type="email" aria-invalid="true">
<span class="error">Invalid</span>

<button type="submit" disabled>Submit</button>`),
    note:tx('Label nicht verknüpft, „Stern“ wird mitgelesen, <code>aria-invalid</code> steht schon beim Laden da, die Meldung hängt nirgends dran und sagt nicht, was zu tun ist. Und den gesperrten Button findet man mit <kbd>Tab</kbd> gar nicht – geschweige denn den Grund.','Label not linked, “star” is read out, <code>aria-invalid</code> is there from page load, the message is attached to nothing and doesn’t say what to do. And you can’t even reach the disabled button with <kbd>Tab</kbd> – let alone find out why.')},
  good:{code:tx(`<form novalidate>
  <label for="email">E-Mail <span aria-hidden="true">*</span></label>
  <input id="email" type="email" required autocomplete="email"
         aria-describedby="email-hint">
  <p id="email-err" class="err"></p>

  <button type="submit">Weiter</button>
</form>

<\x73cript>
  form.addEventListener('submit', e => {

    if (email.checkValidity()) return send();

<\/script>`,`<form novalidate>

</form>

<\x73cript>
  form.addEventListener('submit', e => {

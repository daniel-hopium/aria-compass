  short:tx('Ein Button, der eingerastet bleibt: Der Name bleibt gleich, nur der Zustand wechselt.','A button that stays pushed in: the name stays the same, only the state changes.'),
  keys:'aria-pressed toggle umschalten umschaltbutton toolbar symbolleiste fett kursiv stumm mute folgen follow aria-checked switch aria-selected aria-expanded',
  refs:['WAI-ARIA 1.2: aria-pressed','APG: Button','APG: Toolbar','WCAG 4.1.2'],
  rule:tx('<code>aria-pressed</code> macht aus einem <code>&lt;button&gt;</code> einen Umschaltbutton. Der <strong>Name bleibt fest</strong> („Fett“, „Stummschalten“), nur der Zustand wechselt zwischen <code>true</code> und <code>false</code>. Wer Name und Zustand gleichzeitig ändert, sagt denselben Zustand zweimal – und meistens widersprüchlich.','<code>aria-pressed</code> turns a <code>&lt;button&gt;</code> into a toggle button. The <strong>name stays fixed</strong> (“Bold”, “Mute”), only the state flips between <code>true</code> and <code>false</code>. Changing name and state at the same time says the same state twice – and usually contradicts itself.'),
  attrs:[
    ['aria-pressed','true | false | mixed',tx('<strong>Wann:</strong> ein Button, der wie eine Taste einrastet – Fett, Kursiv, Stumm, Folgen. <code>mixed</code> heißt „teilweise“, etwa wenn nur ein Teil der Markierung fett ist. Weglassen heißt: normaler Button, kein Umschalter.','<strong>When:</strong> a button that latches like a key – bold, italic, mute, follow. <code>mixed</code> means “partly”, e.g. when only part of the selection is bold. Leaving it out means: plain button, not a toggle.')],
    ['role="switch" + aria-checked','true | false',tx('<strong>Wann:</strong> eine Einstellung, die an oder aus ist – wie ein Lichtschalter. Man hört „an“/„aus“ statt „gedrückt“.','<strong>When:</strong> a setting that is on or off – like a light switch. You hear “on”/“off” instead of “pressed”.')],
    ['aria-selected','true | false',tx('<strong>Wann:</strong> eines von mehreren Elementen <em>innerhalb</em> eines Widgets ist ausgewählt – <code>tab</code>, <code>option</code>, <code>gridcell</code>. Nie auf einem einzelnen Button.','<strong>When:</strong> one of several items <em>inside</em> a widget is selected – <code>tab</code>, <code>option</code>, <code>gridcell</code>. Never on a standalone button.')],
    ['aria-expanded','true | false',tx('<strong>Wann:</strong> der Button öffnet oder schließt etwas anderes – ein Menü, ein Panel. Das ist kein Umschalten, sondern Auf- und Zuklappen.','<strong>When:</strong> the button opens or closes something else – a menu, a panel. That’s not toggling, it’s expanding and collapsing.')],
    ['role="toolbar"','',tx('Gruppiert zusammengehörige Buttons. Ein Tab-Stopp, zwischen den Buttons wechselt man mit den Pfeiltasten. Mit <code>aria-label</code> benennen.','Groups related buttons. One tab stop, you move between the buttons with the arrow keys. Name it with <code>aria-label</code>.')]
  ],

<p class="demo-note">${tx('<kbd>Tab</kbd> in die Symbolleiste, dann <kbd>←</kbd> <kbd>→</kbd> und <kbd>Leertaste</kbd>. Klick dann beide „Stummschalten“-Buttons und vergleich im Inspektor: Im „So nicht“-Beispiel heißt es „Ton einschalten, Umschaltfläche, gedrückt“ – ist der Ton jetzt an oder aus? Im „So“-Beispiel „Stummschalten, Umschaltfläche, gedrückt“. Der Umschalter zum Vergleich sagt „an“ und „aus“ statt „gedrückt“.','<kbd>Tab</kbd> into the toolbar, then <kbd>←</kbd> <kbd>→</kbd> and <kbd>Space</kbd>. Then click both “Mute” buttons and compare in the inspector: the “Don’t” example says “Unmute, toggle button, pressed” – is the sound on or off now? The “Do” example says “Mute, toggle button, pressed”. The switch for comparison says “on” and “off” instead of “pressed”.')}</p>`,
  init(root){
    const flip=b=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));return on};
    const bar=$('#pressed-bar',root),text=$('#pressed-text',root),btns=$$('.pressed-btn',bar);
    bar.addEventListener('click',e=>{const b=e.target.closest('.pressed-btn');if(!b)return;const on=flip(b);text.classList.toggle('pressed-is-'+b.dataset.fmt,on);btns.forEach(x=>x.tabIndex=x===b?0:-1)});
    bar.addEventListener('keydown',e=>{
      const i=btns.indexOf(e.target);if(i<0)return;
      const n={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:btns.length-1}[e.key];if(n===undefined)return;
      e.preventDefault();const t=btns[(n+btns.length)%btns.length];btns.forEach(x=>x.tabIndex=x===t?0:-1);t.focus();
    });
    const bad=$('#pressed-bad',root);
    bad.addEventListener('click',()=>{const on=flip(bad);bad.textContent=on?tx('Ton einschalten','Unmute'):tx('Stummschalten','Mute')});
    $('#pressed-mute',root).addEventListener('click',e=>flip(e.currentTarget));

  },

    note:tx('Nach dem Klick hört man „Ton einschalten, Umschaltfläche, gedrückt“. Beschreibt der Name den Zustand oder die nächste Aktion? Ist „gedrückt“ jetzt „Ton an“? Zwei Quellen für denselben Zustand – und sie widersprechen sich.','After the click you hear “Unmute, toggle button, pressed”. Does the name describe the state or the next action? Does “pressed” mean “sound on”? Two sources for the same state – and they contradict each other.')},
  good:{code:tx(`<button type="button" aria-pressed="false">Stummschalten</button>

<\x73cript>
  btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';

<\x73cript>

<\/script>`),
    note:tx('Eine Quelle der Wahrheit: „Stummschalten, Umschaltfläche, gedrückt“. Die andere saubere Lösung: Nur der Name wechselt („Abspielen“ ↔ „Pause“) und <code>aria-pressed</code> fehlt ganz – dann beschreibt der Name immer die Aktion.','One source of truth: “Mute, toggle button, pressed”. The other clean option: only the name changes (“Play” ↔ “Pause”) and <code>aria-pressed</code> is left out entirely – then the name always describes the action.')},
  native:tx('Einen nativen Umschaltbutton gibt es nicht – <code>&lt;button aria-pressed&gt;</code> ist hier genau richtig, denn der Button bringt Rolle, Fokus und Tastatur schon mit, ARIA ergänzt nur den Zustand. Ist es eigentlich eine Einstellung („Newsletter erhalten“), nimm eine echte <code>&lt;input type="checkbox"&gt;</code> mit <code>&lt;label&gt;</code>. Safari kennt außerdem <code>&lt;input type="checkbox" switch&gt;</code> als nativen Umschalter; andere Browser zeigen dafür eine normale Checkbox – was ebenfalls zugänglich ist.','There is no native toggle button – <code>&lt;button aria-pressed&gt;</code> is exactly right here, because the button already brings role, focus and keyboard, and ARIA only adds the state. If it’s really a setting (“Receive newsletter”), use a real <code>&lt;input type="checkbox"&gt;</code> with a <code>&lt;label&gt;</code>. Safari also supports <code>&lt;input type="checkbox" switch&gt;</code> as a native switch; other browsers render a plain checkbox instead – which is accessible too.'),
  do:tx([
    '<code>aria-pressed</code> gleich beim Laden auf <code>"false"</code> setzen – sonst ist der Button bis zum ersten Klick kein Umschalter.',
    'Einen festen Namen wählen, der sagt, was „gedrückt“ bedeutet: „Stummschalten“, „Fett“, „Folgen“.',
    'Den Zustand als Styling-Hook nutzen: <code>[aria-pressed="true"]</code> – so kann die Anzeige nie vom ARIA-Zustand abweichen.',
    'Nach der Bedeutung wählen: rastet ein → <code>aria-pressed</code>; Einstellung an/aus → <code>role="switch"</code>; Auswahl in einem Widget → <code>aria-selected</code>; öffnet etwas → <code>aria-expanded</code>.',
    'Zusammengehörige Umschalter in eine <code>role="toolbar"</code> mit Pfeiltasten-Navigation packen.'
  ],[
    'Set <code>aria-pressed</code> to <code>"false"</code> right on load – otherwise the button isn’t a toggle until the first click.',
    'Pick a fixed name that says what “pressed” means: “Mute”, “Bold”, “Follow”.',
    'Use the state as a styling hook: <code>[aria-pressed="true"]</code> – so the visuals can never drift from the ARIA state.',
    'Choose by meaning: latches → <code>aria-pressed</code>; on/off setting → <code>role="switch"</code>; selection inside a widget → <code>aria-selected</code>; opens something → <code>aria-expanded</code>.',
    'Put related toggles into a <code>role="toolbar"</code> with arrow-key navigation.'

  dont:tx([
    'Name und <code>aria-pressed</code> gleichzeitig umschalten („Stummschalten“ → „Ton einschalten“).',
    '<code>aria-pressed</code> auf einen Button setzen, der etwas öffnet – dafür ist <code>aria-expanded</code> da.',
    '<code>aria-pressed</code> auf Tabs oder Listenoptionen – die brauchen <code>aria-selected</code>.',
    'Den gedrückten Zustand nur mit einer CSS-Klasse wie <code>.active</code> zeigen.'
  ],[
    'Toggling the name and <code>aria-pressed</code> at the same time (“Mute” → “Unmute”).',
    'Putting <code>aria-pressed</code> on a button that opens something – that’s what <code>aria-expanded</code> is for.',
    '<code>aria-pressed</code> on tabs or list options – they need <code>aria-selected</code>.',
    'Showing the pressed state only with a CSS class like <code>.active</code>.'

  ng:tx('<p>Bind den Zustand mit <code>[attr.aria-pressed]="bold()"</code> – Angular schreibt <code>true</code>/<code>false</code> als Text. Vorsicht mit <code>null</code>: Das entfernt das Attribut, und der Button ist kein Umschalter mehr. Angular Material bringt fertige Varianten mit: <code>mat-button-toggle-group</code> mit <code>multiple</code> setzt <code>aria-pressed</code> auf jeden Button; ohne <code>multiple</code> (nur eine Wahl möglich) verwenden aktuelle Versionen <code>role="radio"</code> und <code>aria-checked</code> – denn „eines von mehreren“ ist eine Radiogruppe. <code>mat-slide-toggle</code> ist ein <code>role="switch"</code>. Die Pfeiltasten in einer eigenen Symbolleiste übernimmt der <code>FocusKeyManager</code> aus <code>@angular/cdk/a11y</code> mit <code>withHorizontalOrientation(\'ltr\')</code>.</p>','<p>Bind the state with <code>[attr.aria-pressed]="bold()"</code> – Angular writes <code>true</code>/<code>false</code> as text. Careful with <code>null</code>: it removes the attribute, and the button stops being a toggle. Angular Material ships ready-made variants: <code>mat-button-toggle-group</code> with <code>multiple</code> puts <code>aria-pressed</code> on every button; without <code>multiple</code> (only one choice) current versions use <code>role="radio"</code> and <code>aria-checked</code> – because “one of several” is a radio group. <code>mat-slide-toggle</code> is a <code>role="switch"</code>. For arrow keys in your own toolbar, use <code>FocusKeyManager</code> from <code>@angular/cdk/a11y</code> with <code>withHorizontalOrientation(\'ltr\')</code>.</p>'),
  ngCode:`@Component({
  selector: 'app-format-toolbar',
  template: \`
    <\!-- Arrow keys: FocusKeyManager from @angular/cdk/a11y -->
    <div role="toolbar" aria-label="Text formatting">
      <button type="button" [attr.aria-pressed]="bold()" (click)="bold.set(!bold())">Bold</button>
      <button type="button" [attr.aria-pressed]="italic()" (click)="italic.set(!italic())">Italic</button>
    </div>

    <\!-- The label stays "Mute", only the state changes -->
    <button type="button" [attr.aria-pressed]="muted()" (click)="toggleMute()">Mute</button>
  \`,
})
export class FormatToolbar {
  private readonly player = inject(PlayerService);
  protected readonly bold = signal(false);

  }
}`,
  why:tx('<p>Ohne <code>aria-pressed</code> hört man „Fett, Schalter“ – ob Fett gerade eingeschaltet ist, verrät nur die Hintergrundfarbe. Mit dem Attribut heißt es „Fett, Umschaltfläche, nicht gedrückt“ und nach der <kbd>Leertaste</kbd> „gedrückt“. Die Nutzerin weiß vorher, was der Button tut, und hört danach, dass es geklappt hat.</p><p>Wechseln Name und Zustand zugleich, wird es zum Rätsel: „Ton einschalten, Umschaltfläche, gedrückt“ kann „der Ton ist aus, drück zum Einschalten“ heißen – oder „Ton einschalten ist aktiv“. In einer Videokonferenz rät man da schnell falsch. Darum gilt: genau eine Quelle für den Zustand – entweder fester Name mit <code>aria-pressed</code> oder wechselnder Name ohne.</p>','<p>Without <code>aria-pressed</code> you hear “Bold, button” – whether bold is currently on is only revealed by the background colour. With the attribute it’s “Bold, toggle button, not pressed”, and after <kbd>Space</kbd> “pressed”. The user knows beforehand what the button does and hears afterwards that it worked.</p><p>When name and state change together, it becomes a riddle: “Unmute, toggle button, pressed” can mean “sound is off, press to turn it on” – or “unmute is active”. In a video call, that’s an easy wrong guess. So: exactly one source for the state – either a fixed name with <code>aria-pressed</code> or a changing name without it.</p>')
});

  keys:'regeln rules erste regel first rule of aria native semantik semantics tastatur keyboard aria-hidden presentation name no aria is better than bad aria fünf five using aria',
  refs:['W3C: Using ARIA – Rules of ARIA use','WAI-ARIA 1.2: Presentational Roles Conflict Resolution','WCAG 2.1.1','WCAG 4.1.2'],
  rule:tx('<strong>1.</strong> Natives HTML zuerst. <strong>2.</strong> Native Semantik nicht überschreiben. <strong>3.</strong> Alles, was per ARIA bedienbar aussieht, muss mit der Tastatur gehen. <strong>4.</strong> Kein <code>role="presentation"</code> und kein <code>aria-hidden="true"</code> auf Fokussierbarem. <strong>5.</strong> Jedes Bedienelement braucht einen zugänglichen Namen. Und über allem: <strong>Kein ARIA ist besser als schlechtes ARIA.</strong>','<strong>1.</strong> Native HTML first. <strong>2.</strong> Don’t override native semantics. <strong>3.</strong> Everything ARIA makes look operable must work with the keyboard. <strong>4.</strong> No <code>role="presentation"</code> and no <code>aria-hidden="true"</code> on focusable elements. <strong>5.</strong> Every interactive element needs an accessible name. And above all: <strong>no ARIA is better than bad ARIA.</strong>'),
  attrs:[
    ['role','button | tab | …',tx('Ändert nur, was der Screenreader ansagt. Fokus, Tastatur und Verhalten kommen <em>nicht</em> mit.','Only changes what the screen reader announces. Focus, keyboard and behaviour do <em>not</em> come with it.')],
    ['tabindex','0 | -1',tx('<code>0</code> macht ein Element per <kbd>Tab</kbd> erreichbar, <code>-1</code> nur per Skript. Nötig, sobald ein Nicht-Button eine Bedienrolle bekommt.','<code>0</code> makes an element reachable with <kbd>Tab</kbd>, <code>-1</code> only via script. Required as soon as a non-button gets an interactive role.')],
    ['aria-hidden','true',tx('Entfernt ein Element samt Inhalt aus dem Accessibility Tree. Nur für Deko – nie auf etwas, das den Fokus bekommen kann.','Removes an element and its content from the accessibility tree. Only for decoration – never on anything that can take focus.')],
    ['aria-label','Text',tx('Gibt einem Bedienelement ohne sichtbaren Text einen Namen, z. B. einem Icon-Button.','Gives an interactive element without visible text a name, e.g. an icon button.')]

<p class="demo-note">${tx('Geh mit <kbd>Tab</kbd> durch alle Karten und drück <kbd>Enter</kbd> oder <kbd>Leertaste</kbd>. Der erste „Speichern“-Button wird übersprungen, klicken lässt er sich trotzdem. Der Inspektor warnt bei jedem Regelverstoß – und zeigt bei „aria-hidden auf dem Button“: Fokus da, im Accessibility Tree nichts. Im „Baum“-Modus fehlt die Überschrift „Versand“.','Go through all cards with <kbd>Tab</kbd> and press <kbd>Enter</kbd> or <kbd>Space</kbd>. The first “Save” button is skipped, though you can still click it. The inspector warns about every rule violation – and for “aria-hidden on the button” it shows: focus is there, the accessibility tree has nothing. In “Tree” mode the heading “Shipping” is missing.')}</p>`,
  init(root){
    const counts=new Map();
    const act=(el,byKey)=>{
      if(el.hasAttribute('aria-expanded')){
        const open=el.getAttribute('aria-expanded')==='true';
        el.setAttribute('aria-expanded',String(!open));
        $('#'+el.getAttribute('aria-controls'),root).hidden=open;
      }
      const n=(counts.get(el)||0)+1;counts.set(el,n);
      $('.rules-out',el.closest('.rules-card')).textContent=byKey
        ?tx(`${el.dataset.l}: per Tastatur ausgelöst (${n}×)`,`${el.dataset.l}: triggered by keyboard (${n}×)`)
        :tx(`${el.dataset.l}: per Maus oder Finger ausgelöst (${n}×)`,`${el.dataset.l}: triggered by mouse or touch (${n}×)`);
    };
    const own=e=>{const el=e.target.closest('.rules-el');return el&&el.localName!=='button'&&el.hasAttribute('tabindex')?el:null};
    /* Echte Buttons lösen bei Enter/Leertaste selbst ein click aus – mit detail 0 */
    root.addEventListener('click',e=>{const el=e.target.closest('.rules-el');if(el)act(el,e.detail===0)});
    /* Nachgebaute Buttons: Enter beim Drücken, Leertaste beim Loslassen – wie ein echter Button */
    root.addEventListener('keydown',e=>{const el=own(e);if(!el)return;if(e.key==='Enter'){e.preventDefault();act(el,true)}else if(e.key===' ')e.preventDefault()});
    root.addEventListener('keyup',e=>{const el=own(e);if(el&&e.key===' ')act(el,true)});
  },

.rules-panel{margin:0;padding:0 12px;font-size:.9375rem}
.rules-out{margin:0;min-height:1.5em;font-size:.875rem;font-weight:700;color:var(--brand)}`,
  bad:{code:tx(`<div role="button" onclick="speichern()">Speichern</div>

<h3 role="button" onclick="toggle()">Versand</h3>

<button aria-hidden="true" aria-label="Schließen">✕</button>

<button><svg>…</svg></button>`,`<div role="button" onclick="save()">Save</div>

<h3 role="button" onclick="toggle()">Shipping</h3>

<button aria-hidden="true" aria-label="Close">✕</button>

<button><svg>…</svg></button>`),
    note:tx('Vier Regeln, vier Brüche: nicht per Tastatur erreichbar, Überschrift verschwindet, Fokus landet im Nichts, Button ohne Namen.','Four rules, four violations: unreachable by keyboard, heading disappears, focus lands on nothing, button without a name.')},
  good:{code:tx(`<button type="button" onclick="speichern()">Speichern</button>

<h3>
  <button type="button" aria-expanded="false">Versand</button>
</h3>

<button type="button" aria-label="Schließen">
  <svg aria-hidden="true">…</svg>
</button>`,`<button type="button" onclick="save()">Save</button>

<h3>
  <button type="button" aria-expanded="false">Shipping</button>
</h3>

<button type="button" aria-label="Close">
  <svg aria-hidden="true">…</svg>
</button>`),
    note:tx('Native Elemente liefern Rolle, Fokus und Tastatur. ARIA ergänzt nur, was HTML nicht kann: den Zustand und den Namen fürs Icon.','Native elements provide role, focus and keyboard support. ARIA only adds what HTML can’t: the state and the name for the icon.')},
  native:tx('Das ist Regel 1: Fast immer gibt es ein natives Element – <code>&lt;button&gt;</code>, <code>&lt;a href&gt;</code>, <code>&lt;input type="checkbox"&gt;</code>, <code>&lt;details&gt;</code>, <code>&lt;dialog&gt;</code>. Sie bringen Rolle, Fokus, Tastatur, Formularverhalten und Hochkontrast-Darstellung mit, ohne eine Zeile Skript. ARIA brauchst du dort, wo HTML nichts hat: Zustände wie <code>aria-expanded</code>, Live-Regionen und zusammengesetzte Widgets wie Tabs, Baumansicht oder Combobox.','That’s rule 1: there’s almost always a native element – <code>&lt;button&gt;</code>, <code>&lt;a href&gt;</code>, <code>&lt;input type="checkbox"&gt;</code>, <code>&lt;details&gt;</code>, <code>&lt;dialog&gt;</code>. They bring role, focus, keyboard, form behaviour and high-contrast rendering without a single line of script. You need ARIA where HTML has nothing: states like <code>aria-expanded</code>, live regions and composite widgets such as tabs, tree views or comboboxes.'),
  do:tx([
    'Zuerst fragen: Gibt es dafür ein HTML-Element? Erst wenn nicht, zu <code>role</code> greifen.',
    'Muss es doch eine eigene Rolle sein: <code>tabindex="0"</code> dazu und die Tasten nachbauen, die zur Rolle gehören – beim Button <kbd>Enter</kbd> und <kbd>Leertaste</kbd>.',
    'Bedienelemente in eine Überschrift <em>hineinsetzen</em> (<code>&lt;h3&gt;&lt;button&gt;</code>), statt die Überschrift umzudeuten.',
    '<code>aria-hidden="true"</code> nur auf reine Deko: Icons, Trennlinien, doppelte Bilder.',
    'Jedem Bedienelement einen Namen geben – sichtbarer Text ist der beste.'
  ],[
    'Ask first: is there an HTML element for this? Only reach for <code>role</code> if there isn’t.',
    'If it really must be a custom role: add <code>tabindex="0"</code> and rebuild the keys that belong to the role – for a button <kbd>Enter</kbd> and <kbd>Space</kbd>.',
    'Put controls <em>inside</em> a heading (<code>&lt;h3&gt;&lt;button&gt;</code>) instead of redefining the heading.',
    '<code>aria-hidden="true"</code> only on pure decoration: icons, dividers, duplicate images.',
    'Give every control a name – visible text is the best one.'
  ]),
  dont:tx([
    '<code>role="button"</code> auf ein <code>&lt;div&gt;</code> setzen und glauben, damit sei es ein Button.',
    'Die Rolle eines Elements mit Bedeutung ändern (<code>&lt;h2 role="tab"&gt;</code>, <code>&lt;a role="button"&gt;</code> für echte Links).',
    '<code>aria-hidden="true"</code> oder <code>role="presentation"</code> auf einen Button, Link oder ein Eingabefeld – oder auf einen Container, in dem eines steckt.',
    'ARIA „zur Sicherheit“ dazuschreiben: <code>&lt;button role="button"&gt;</code> ist doppelt, <code>aria-label</code> auf einem beschrifteten Button überschreibt den sichtbaren Text.'
  ],[
    'Putting <code>role="button"</code> on a <code>&lt;div&gt;</code> and believing that makes it a button.',
    'Changing the role of an element that has meaning (<code>&lt;h2 role="tab"&gt;</code>, <code>&lt;a role="button"&gt;</code> for real links).',
    '<code>aria-hidden="true"</code> or <code>role="presentation"</code> on a button, link or input – or on a container that holds one.',
    'Adding ARIA “just to be safe”: <code>&lt;button role="button"&gt;</code> is redundant, <code>aria-label</code> on a labelled button overrides the visible text.'
  ]),
  ng:tx('<p>Die Regeln lassen sich in Angular automatisch prüfen: <code>angular-eslint</code> bringt eine Konfiguration <code>templateAccessibility</code> mit – unter anderem <code>interactive-supports-focus</code> und <code>click-events-have-key-events</code> (Regel 3), <code>valid-aria</code> und <code>role-has-required-aria</code>. Für eigene Buttons nimm einen <strong>Attribut-Selektor</strong> wie Angular Material (<code>&lt;button mat-flat-button&gt;</code>): Der Host bleibt ein echter <code>&lt;button&gt;</code>, statt dass ein <code>&lt;app-button&gt;</code> eine Rolle nachspielen muss.</p>','<p>Angular can check these rules automatically: <code>angular-eslint</code> ships a <code>templateAccessibility</code> config – including <code>interactive-supports-focus</code> and <code>click-events-have-key-events</code> (rule 3), <code>valid-aria</code> and <code>role-has-required-aria</code>. For your own buttons use an <strong>attribute selector</strong> like Angular Material does (<code>&lt;button mat-flat-button&gt;</code>): the host stays a real <code>&lt;button&gt;</code> instead of an <code>&lt;app-button&gt;</code> having to fake a role.</p>'),
  ngCode:`// Attribute selector: the host stays a real <button> (rules 1 + 3)
@Component({
  selector: 'button[appIconButton]',
  host: { type: 'button', '[attr.aria-label]': 'label()' },   // rule 5
  template: \`<ng-content />\`,
})
export class IconButton {
  readonly label = input.required<string>();
}

// Usage – the icon is decoration, only the icon is hidden (rule 4)
<button appIconButton label="Delete draft" (click)="remove()">
  <svg aria-hidden="true" focusable="false">…</svg>
</button>`,
  why:tx('<p>ARIA ist ein Versprechen an den Screenreader. <code>role="button"</code> lässt ihn „Speichern, Schalter“ sagen – und die Nutzerin erwartet, dass <kbd>Tab</kbd> hinführt und <kbd>Enter</kbd> auslöst. Beim <code>&lt;div&gt;</code> ohne <code>tabindex</code> passiert nichts. Im Lesemodus von NVDA klappt es manchmal trotzdem, weil NVDA einen Klick simuliert; wer nur die Tastatur nutzt, ohne Screenreader, kommt nie hin. Ein Element, das seine Rolle verspricht und nicht hält, ist schlimmer als eines ohne Rolle: Ohne ARIA hätte man wenigstens gemerkt, dass es kein Button ist.</p><p>Die anderen Regeln brechen dasselbe Versprechen von der anderen Seite. <code>&lt;h3 role="button"&gt;</code> sagt „Versand, Schalter“ – aus der Liste der Überschriften, mit der viele Screenreader-Nutzer eine Seite überfliegen, ist „Versand“ verschwunden. Ein Button mit <code>aria-hidden</code> bekommt den Fokus, aber im Accessibility Tree gibt es ihn nicht: Je nach Browser hört man gar nichts oder nur Bruchstücke. Und ein Icon-Button ohne Namen klingt nur nach „Schalter“ – welcher, bleibt ein Rätsel.</p>','<p>ARIA is a promise to the screen reader. <code>role="button"</code> makes it say “Save, button” – and the user expects <kbd>Tab</kbd> to get there and <kbd>Enter</kbd> to trigger it. With a <code>&lt;div&gt;</code> without <code>tabindex</code> nothing happens. In NVDA’s browse mode it sometimes works anyway, because NVDA simulates a click; people who only use the keyboard, without a screen reader, never get there. An element that makes a promise with its role and doesn’t keep it is worse than one without a role: without ARIA you’d at least have noticed it isn’t a button.</p><p>The other rules break the same promise from the other side. <code>&lt;h3 role="button"&gt;</code> says “Shipping, button” – and “Shipping” has vanished from the headings list many screen reader users skim a page with. A button with <code>aria-hidden</code> gets focus but doesn’t exist in the accessibility tree: depending on the browser you hear nothing or just fragments. And an icon button without a name only sounds like “button” – which one remains a mystery.</p>')
});

LESSONS.push({
  id:'switch',cat:'widgets',
  title:tx('Umschalter: role="switch"','Switch: role="switch"'),
  short:tx('An oder aus, und zwar sofort – nicht erst nach dem Speichern.','On or off, and right away – not only after saving.'),
  keys:'switch schalter umschalter toggle kippschalter aria-checked aria-pressed checkbox kontrollkästchen an aus on off einstellungen settings',
  refs:['WAI-ARIA 1.2: switch','APG: Switch','ARIA in HTML: input type=checkbox','WCAG 4.1.2'],
  rule:tx('Ein <code>switch</code> ist an oder aus und <strong>wirkt sofort</strong> – wie ein Lichtschalter. Gehört die Auswahl zu einem Formular, das erst beim Absenden gilt, ist es eine <strong>Checkbox</strong>. Und die Beschriftung bleibt immer gleich: Den Zustand sagt <code>aria-checked</code>, nicht der Text.','A <code>switch</code> is on or off and <strong>takes effect immediately</strong> – like a light switch. If the choice belongs to a form that only applies on submit, it’s a <strong>checkbox</strong>. And the label always stays the same: <code>aria-checked</code> tells the state, not the text.'),
  attrs:[
    ['role="switch"','',tx('An/Aus-Schalter mit sofortiger Wirkung. Ist technisch eine Unterart von <code>checkbox</code>.','On/off switch with immediate effect. Technically a subtype of <code>checkbox</code>.')],
    ['aria-checked','true | false',tx('Pflicht bei <code>role="switch"</code> auf einem Button oder &lt;div&gt;. <code>mixed</code> gibt es beim Schalter nicht.','Required for <code>role="switch"</code> on a button or &lt;div&gt;. There is no <code>mixed</code> for a switch.')],
    ['<input type="checkbox" role="switch">','',tx('Nativer Weg: Der Zustand kommt aus <code>checked</code>, Tastatur und Label bringt HTML mit. Kein <code>aria-checked</code> dazuschreiben.','Native way: the state comes from <code>checked</code>, HTML brings keyboard and label. Don’t add <code>aria-checked</code>.')],
    ['aria-pressed','true | false',tx('Nicht verwechseln: Umschalt-Button wie „Fett“ in einer Symbolleiste – gedrückt oder nicht.','Don’t confuse: toggle button like “Bold” in a toolbar – pressed or not.')]
  ],
  demo:`<div class="switch-grid">
  <div class="switch-col switch-yes">
    <p class="switch-cap">${ic('ok')} ${tx('So: Umschalter, die sofort wirken','Do: switches that act immediately')}</p>
    <ul class="switch-list">
      <li><label class="switch-row"><input type="checkbox" role="switch" class="switch-input" id="switch-dark"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('Dunkle Vorschau','Dark preview')}</span></label></li>
      <li><button type="button" class="switch" role="switch" aria-checked="false" id="switch-big"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span>${tx('Große Schrift','Large text')}</span></button></li>
    </ul>
    <div class="switch-preview" id="switch-preview"><p>${tx('Vorschau: So sieht deine Karte gerade aus.','Preview: this is how your card looks right now.')}</p></div>
  </div>
  <div class="switch-col switch-no">
    <p class="switch-cap">${ic('xc')} ${tx('So nicht: &lt;div&gt; als Umschalter','Don’t: &lt;div&gt; as a switch')}</p>
    <div class="switch-fake" id="switch-fake"><span class="track"><span class="thumb"></span></span><span>${tx('Benachrichtigungen','Notifications')}</span></div>
  </div>
  <div class="switch-col switch-cmp">
    <p class="switch-cap">${ic('info')} ${tx('Nicht verwechseln','Don’t confuse')}</p>
    <form class="switch-form" id="switch-form">
      <label class="check-row"><input type="checkbox" name="news" id="switch-news">${tx('Newsletter abonnieren','Subscribe to newsletter')}</label>
      <button type="submit" class="btn btn-secondary">${tx('Speichern','Save')}</button>
      <p class="switch-out" id="switch-saved" role="status"></p>
    </form>
    <div class="switch-tool">
      <button type="button" class="btn btn-secondary switch-press" id="switch-bold" aria-pressed="false">${tx('Fett','Bold')}</button>
      <p class="switch-sample" id="switch-sample">${tx('Beispieltext','Sample text')}</p>
    </div>
  </div>
</div>
<p class="demo-note">${tx('Mit <kbd>Tab</kbd> auf einen Umschalter und <kbd>Leertaste</kbd>: Die Vorschau ändert sich sofort, der Inspektor zeigt <code>checked</code> an/aus – der Name bleibt gleich. Die Checkbox gilt erst nach „Speichern“, „Fett“ meldet <code>pressed</code>. Das &lt;div&gt; in der Mitte erreichst du mit der Tastatur gar nicht, und der Inspektor findet weder Rolle noch Zustand.','<kbd>Tab</kbd> to a switch and press <kbd>Space</kbd>: the preview changes immediately, the inspector shows <code>checked</code> on/off – the name stays the same. The checkbox only applies after “Save”, “Bold” reports <code>pressed</code>. You can’t even reach the &lt;div&gt; in the middle by keyboard, and the inspector finds neither role nor state.')}</p>`,
  init(root){
    const preview=$('#switch-preview',root);
    $('#switch-dark',root).addEventListener('change',e=>{preview.classList.toggle('is-dark',e.target.checked)});
    const big=$('#switch-big',root);
    big.addEventListener('click',()=>{const on=big.getAttribute('aria-checked')!=='true';big.setAttribute('aria-checked',String(on));preview.classList.toggle('is-big',on)});
    const fake=$('#switch-fake',root);
    fake.addEventListener('click',()=>fake.classList.toggle('is-on'));
    const saved=$('#switch-saved',root),news=$('#switch-news',root);
    news.addEventListener('change',()=>{saved.textContent=''});
    $('#switch-form',root).addEventListener('submit',e=>{e.preventDefault();saved.textContent=news.checked?tx('Gespeichert: Newsletter abonniert.','Saved: subscribed to newsletter.'):tx('Gespeichert: kein Newsletter.','Saved: no newsletter.')});
    const bold=$('#switch-bold',root),sample=$('#switch-sample',root);
    bold.addEventListener('click',()=>{const on=bold.getAttribute('aria-pressed')!=='true';bold.setAttribute('aria-pressed',String(on));sample.classList.toggle('is-bold',on)});
  },
  css:`.switch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px;align-items:start}
.switch-cap{margin:0 0 8px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:.875rem}
.switch-cap .ic{width:18px;height:18px}
.switch-no .switch-cap{color:var(--danger)}
.switch-yes .switch-cap{color:var(--success)}
.switch-cmp .switch-cap{color:var(--muted)}
.switch-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.switch-row{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;border-radius:var(--radius-ctl);font-weight:700;cursor:pointer}
.switch-row:hover{background:var(--surface-2)}
.switch-input{position:absolute;left:6px;top:50%;width:42px;height:26px;margin:-13px 0 0;opacity:0;cursor:pointer}
.switch-input:checked+.track{background:var(--brand)}
.switch-input:checked+.track .thumb{transform:translateX(16px);background:var(--brand-ink)}
.switch-input:focus-visible+.track{outline:3px solid var(--focus);outline-offset:2px}
.switch-preview{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);transition:background-color .15s,color .15s,font-size .15s}
.switch-preview p{margin:0}
.switch-preview.is-dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.switch-preview.is-big{font-size:1.25rem}
.switch-fake{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;font-weight:700;cursor:pointer;user-select:none}
.switch-fake.is-on .track{background:var(--brand)}
.switch-fake.is-on .thumb{transform:translateX(16px);background:var(--brand-ink)}
.switch-form{display:grid;gap:6px;justify-items:start;margin:0}
.switch-form .btn,.switch-tool .btn{margin:0}
.switch-out{margin:0;min-height:1.5em;font-weight:700;color:var(--success)}
.switch-tool{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.switch-press[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.switch-sample{margin:0}
.switch-sample.is-bold{font-weight:700}`,
  bad:{code:tx(`<div class="toggle" onclick="toggle(this)">
  <span class="track"><span class="thumb"></span></span>
  Benachrichtigungen
</div>

<\!-- oder: Zustand im Text -->
<button onclick="toggle(this)">Benachrichtigungen: aus</button>`,`<div class="toggle" onclick="toggle(this)">
  <span class="track"><span class="thumb"></span></span>
  Notifications
</div>

<\!-- or: state in the text -->
<button onclick="toggle(this)">Notifications: off</button>`),
    note:tx('Das &lt;div&gt; hat keine Rolle, keinen Zustand und keinen Tab-Stopp. Beim Button steckt der Zustand im Namen: Er wird doppelt oder gar nicht angesagt, und Sprachsteuerung findet „Benachrichtigungen: an“ nicht mehr unter dem alten Namen.','The &lt;div&gt; has no role, no state and no tab stop. With the button, the state lives in the name: it’s announced twice or not at all, and voice control no longer finds “Notifications: on” under its old name.')},
  good:{code:tx(`<\!-- nativ: Checkbox mit Schalter-Rolle -->
<label>
  <input type="checkbox" role="switch">
  Dunkle Vorschau
</label>

<\!-- oder: Button als Umschalter -->
<button type="button" role="switch" aria-checked="false">
  <span class="track" aria-hidden="true"><span class="thumb"></span></span>
  Große Schrift
</button>

<\x73cript>
  sw.addEventListener('click', () => {
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(on));
    applyLargeText(on);   // sofort wirksam
  });
<\/script>`,`<\!-- native: checkbox with switch role -->
<label>
  <input type="checkbox" role="switch">
  Dark preview
</label>

<\!-- or: button as a switch -->
<button type="button" role="switch" aria-checked="false">
  <span class="track" aria-hidden="true"><span class="thumb"></span></span>
  Large text
</button>

<\x73cript>
  sw.addEventListener('click', () => {
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(on));
    applyLargeText(on);   // takes effect immediately
  });
<\/script>`),
    note:tx('Die Checkbox bringt Label, Fokus und <kbd>Leertaste</kbd> mit; <code>role="switch"</code> ändert nur die Ansage. Beim Button liefert HTML Fokus und Tastatur, ARIA Rolle und Zustand.','The checkbox brings label, focus and <kbd>Space</kbd>; <code>role="switch"</code> only changes the announcement. With the button, HTML provides focus and keyboard, ARIA the role and state.')},
  native:tx('Fast: <code>&lt;input type="checkbox" role="switch"&gt;</code> ist die robusteste Lösung. Label, Tastatur, Formularwert und Zustand kommen aus HTML, nur die Rolle aus ARIA – und wo ein Screenreader <code>switch</code> nicht kennt, fällt er auf „Kontrollkästchen“ zurück, was immer noch stimmt. Safari kennt zusätzlich das neue Attribut <code>switch</code> (<code>&lt;input type="checkbox" switch&gt;</code>), andere Browser noch nicht – bis dahin <code>role="switch"</code> dazuschreiben. Und oft ist die einfache Checkbox richtig: immer dann, wenn die Auswahl erst mit dem Absenden gilt.','Almost: <code>&lt;input type="checkbox" role="switch"&gt;</code> is the most robust solution. Label, keyboard, form value and state come from HTML, only the role from ARIA – and where a screen reader doesn’t know <code>switch</code>, it falls back to “check box”, which is still true. Safari also knows the new <code>switch</code> attribute (<code>&lt;input type="checkbox" switch&gt;</code>), other browsers don’t yet – until then, add <code>role="switch"</code>. And often the plain checkbox is right: whenever the choice only applies on submit.'),
  do:tx([
    '<code>role="switch"</code> nur für Einstellungen, die sofort wirken – ohne „Speichern“-Button.',
    'Wenn möglich <code>&lt;input type="checkbox" role="switch"&gt;</code> mit echtem <code>&lt;label&gt;</code>.',
    'Beim Button als Umschalter <code>aria-checked</code> von Anfang an setzen und bei jedem Klick umschalten.',
    'Die Beschriftung beschreibt, <em>was</em> geschaltet wird („Große Schrift“) – der Zustand kommt von <code>aria-checked</code>.',
    'Ein sichtbares „An“/„Aus“ ist erlaubt, wenn es mit <code>aria-hidden="true"</code> außerhalb des Namens bleibt.'
  ],[
    'Use <code>role="switch"</code> only for settings that take effect immediately – without a “Save” button.',
    'Whenever possible, <code>&lt;input type="checkbox" role="switch"&gt;</code> with a real <code>&lt;label&gt;</code>.',
    'On a button switch, set <code>aria-checked</code> from the start and flip it on every click.',
    'The label describes <em>what</em> is switched (“Large text”) – the state comes from <code>aria-checked</code>.',
    'A visible “On”/“Off” is fine as long as it stays out of the name with <code>aria-hidden="true"</code>.'
  ]),
  dont:tx([
    'Die Beschriftung mit dem Zustand ändern („Ton an“ ↔ „Ton aus“) – dann sagt der Name das Gegenteil des Zustands, oder beides doppelt.',
    'Einen Schalter in ein Formular setzen, dessen Werte erst beim Absenden gelten – das ist eine Checkbox.',
    '<code>aria-checked</code> auf eine native Checkbox schreiben – der Zustand kommt dort aus <code>checked</code>.',
    '<code>aria-pressed</code> und <code>role="switch"</code> mischen – entweder Umschalt-Button oder Umschalter.'
  ],[
    'Changing the label with the state (“Sound on” ↔ “Sound off”) – then the name says the opposite of the state, or both say it twice.',
    'Putting a switch into a form whose values only apply on submit – that’s a checkbox.',
    'Writing <code>aria-checked</code> onto a native checkbox – there the state comes from <code>checked</code>.',
    'Mixing <code>aria-pressed</code> and <code>role="switch"</code> – it’s either a toggle button or a switch.'
  ]),
  ng:tx('<p>Angular Material hat mit <code>mat-slide-toggle</code> einen fertigen Umschalter; er rendert einen <code>&lt;button role="switch"&gt;</code> mit <code>aria-checked</code>. Baust du selbst, bindest du den Zustand mit <code>[attr.aria-checked]</code> und hältst ihn in einem <code>model()</code>-Signal – dann funktioniert auch <code>[(checked)]</code> von außen. Für die native Variante reicht <code>&lt;input type="checkbox" role="switch"&gt;</code> mit <code>[(ngModel)]</code> oder <code>[formControl]</code>.</p>','<p>Angular Material has a ready-made switch: <code>mat-slide-toggle</code>; it renders a <code>&lt;button role="switch"&gt;</code> with <code>aria-checked</code>. If you build your own, bind the state with <code>[attr.aria-checked]</code> and keep it in a <code>model()</code> signal – then <code>[(checked)]</code> works from the outside too. For the native variant, <code>&lt;input type="checkbox" role="switch"&gt;</code> with <code>[(ngModel)]</code> or <code>[formControl]</code> is enough.</p>'),
  ngCode:`@Component({
  selector: 'app-switch',
  template: \`
    <button type="button" role="switch" class="switch"
            [attr.aria-checked]="checked()" (click)="checked.set(!checked())">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      {{ label() }}
    </button>
  \`,
})
export class Switch {
  readonly label = input.required<string>();
  readonly checked = model(false);
}

// Usage: <app-switch label="Large text" [(checked)]="largeText" />`,
  why:tx('<p>Mit der Rolle hört man „Große Schrift, Umschalter, aus“, nach der <kbd>Leertaste</kbd> „an“. Die Wörter „an“ und „aus“ sagen: Das wirkt jetzt, ich muss nichts mehr bestätigen. Eine Checkbox klingt dagegen wie „Newsletter abonnieren, Kontrollkästchen, nicht aktiviert“ – man erwartet, dass irgendwo noch ein „Speichern“ kommt. Und „Fett, Umschaltfläche, nicht gedrückt“ ist ein Werkzeug, das man ein- und ausschaltet. Drei Ansagen, drei Erwartungen.</p><p>Das nachgebaute &lt;div&gt; sagt nur „Benachrichtigungen“ – wenn man es überhaupt erreicht. Ob es an ist, sieht nur, wer die Farbe des Schiebers erkennt. Und ändert sich die Beschriftung mit dem Zustand, weiß niemand mehr, ob „Ton aus“ der Zustand ist oder die Aktion, die ein Klick auslöst.</p>','<p>With the role you hear “Large text, switch, off”, and after <kbd>Space</kbd> “on”. The words “on” and “off” say: this takes effect now, nothing left to confirm. A checkbox, on the other hand, sounds like “Subscribe to newsletter, check box, not checked” – you expect a “Save” to come somewhere. And “Bold, toggle button, not pressed” is a tool you turn on and off. Three announcements, three expectations.</p><p>The home-made &lt;div&gt; only says “Notifications” – if you can reach it at all. Whether it’s on is only visible to those who can tell the colour of the slider. And if the label changes with the state, nobody knows anymore whether “Sound off” is the state or the action a click will trigger.</p>')
});

LESSONS.push({
  id:'tabindex',cat:'focus',
  title:tx('Fokussierbar machen: tabindex','Making things focusable: tabindex'),
  short:tx('0 für eigene Widgets, -1 für Fokus per Script, positive Werte nie.','0 for custom widgets, -1 for focus by script, positive values never.'),
  keys:'tabindex tab-reihenfolge tab order fokus focus fokussierbar focusable focus-visible fokusrahmen focus ring tastatur keyboard role button enter leertaste space',
  refs:['HTML: tabindex','WCAG 2.1.1','WCAG 2.4.3','WCAG 2.4.7'],
  rule:tx('<code>tabindex="0"</code> nimmt ein Element an seiner Stelle im DOM in die Tab-Reihenfolge auf, <code>tabindex="-1"</code> macht es nur per Script fokussierbar, positive Werte verwendest du nie. Und: ARIA ändert nur, was vorgelesen wird – <code>role="button"</code> macht ein &lt;div&gt; weder fokussierbar noch per Tastatur bedienbar.','<code>tabindex="0"</code> puts an element into the tab order at its place in the DOM, <code>tabindex="-1"</code> makes it focusable by script only, and you never use positive values. And: ARIA only changes what gets announced – <code>role="button"</code> makes a &lt;div&gt; neither focusable nor operable by keyboard.'),
  attrs:[
    ['tabindex="0"','',tx('Fokussierbar und per <kbd>Tab</kbd> erreichbar, in DOM-Reihenfolge. Für eigene Widgets ohne natives Gegenstück.','Focusable and reachable with <kbd>Tab</kbd>, in DOM order. For custom widgets without a native counterpart.')],
    ['tabindex="-1"','',tx('Nicht per <kbd>Tab</kbd>, aber per <code>element.focus()</code> fokussierbar. Für Fokusziele wie Überschriften und für Roving Tabindex.','Not reachable with <kbd>Tab</kbd>, but focusable via <code>element.focus()</code>. For focus targets like headings and for roving tabindex.')],
    ['tabindex="1" …','1 – 32767',tx('Zieht das Element vor alle anderen der Seite. Nie verwenden.','Pulls the element ahead of everything else on the page. Never use it.')],
    [':focus-visible','',tx('CSS, kein ARIA: zeigt den Fokusrahmen, wenn der Browser ihn für nötig hält – bei Tastaturbedienung immer.','CSS, not ARIA: shows the focus ring whenever the browser deems it necessary – always for keyboard use.')]
  ],
  demo:`<div class="tabindex-grid">
  <div class="tabindex-card">
    <p class="tabindex-cap">${tx('Verschiedene Werte','Different values')}</p>
    <div class="tabindex-row">
      <button type="button" class="tabindex-item" data-label="${tx('Speichern','Save')}">${tx('Speichern','Save')} <span class="tabindex-val" aria-hidden="true">&lt;button&gt;</span></button>
      <div role="button" tabindex="0" class="tabindex-item tabindex-act" data-label="${tx('Teilen','Share')}">${tx('Teilen','Share')} <span class="tabindex-val" aria-hidden="true">tabindex="0"</span></div>
      <div role="button" class="tabindex-item tabindex-act tabindex-bad" data-label="${tx('Drucken','Print')}">${tx('Drucken','Print')} <span class="tabindex-val" aria-hidden="true">${tx('kein tabindex','no tabindex')}</span></div>
      <div role="button" tabindex="0" class="tabindex-item tabindex-act tabindex-noring" data-label="${tx('Exportieren','Export')}">${tx('Exportieren','Export')} <span class="tabindex-val" aria-hidden="true">0 + outline:none</span></div>
    </div>
    <button type="button" class="btn btn-secondary tabindex-jump" id="tabindex-jump" data-label="${tx('Zu den Ergebnissen','To the results')}">${ic('down')} ${tx('Zu den Ergebnissen','To the results')}</button>
    <h3 id="tabindex-results" class="tabindex-target" tabindex="-1" data-label="${tx('Überschrift „Ergebnisse“','Heading “Results”')}">${tx('Ergebnisse','Results')} <span class="tabindex-val" aria-hidden="true">tabindex="-1"</span></h3>
  </div>
  <div class="tabindex-card">
    <p class="tabindex-cap tabindex-no">${ic('xc')} ${tx('So nicht: positive Werte','Don’t: positive values')}</p>
    <button type="button" class="btn btn-secondary" id="tabindex-pos-toggle" aria-pressed="false" data-label="${tx('Positive Werte setzen','Set positive values')}">${tx('Positive Werte setzen','Set positive values')}</button>
    <div class="tabindex-row" id="tabindex-pos">
      ${[['A','3'],['B','1'],['C',''],['D','2']].map(([l,v])=>`<button type="button" class="tabindex-item" data-label="${l}" data-pos="${v}">${l} <span class="tabindex-val" aria-hidden="true">—</span></button>`).join('')}
    </div>
  </div>
  <div class="tabindex-card tabindex-logcard">
    <p class="tabindex-cap" id="tabindex-log-h">${tx('Reihenfolge, in der der Fokus gerade wandert','Order in which focus is moving right now')}</p>
    <ol class="tabindex-log" id="tabindex-log" aria-labelledby="tabindex-log-h"></ol>
    <p class="tabindex-empty" id="tabindex-empty">${tx('Noch leer – drück <kbd>Tab</kbd>.','Empty so far – press <kbd>Tab</kbd>.')}</p>
    <button type="button" class="btn btn-ghost" id="tabindex-clear" data-label="${tx('Liste leeren','Clear list')}">${ic('refresh')} ${tx('Liste leeren','Clear list')}</button>
  </div>
</div>
<p class="demo-note">${tx('Klick vor „Speichern“ in die leere Fläche und drück mehrmals <kbd>Tab</kbd>: „Drucken“ wird übersprungen, „Exportieren“ bekommt den Fokus, aber du siehst es nicht. „Teilen“ reagiert auf <kbd>Enter</kbd> und <kbd>Leertaste</kbd>, weil ein Script das nachrüstet. Dann „Positive Werte setzen“, auf B klicken und weiter <kbd>Tab</kbd>: B → D → A – und dann raus an den Seitenanfang. C kommt erst, wenn du die ganze Seite durchlaufen hast.','Click the empty space before “Save” and press <kbd>Tab</kbd> a few times: “Print” is skipped, “Export” gets focus but you can’t see it. “Share” reacts to <kbd>Enter</kbd> and <kbd>Space</kbd> because a script adds that. Then “Set positive values”, click B and keep pressing <kbd>Tab</kbd>: B → D → A – and then out to the top of the page. C only comes after you’ve gone through the whole page.')}</p>`,
  init(root){
    const log=$('#tabindex-log',root),empty=$('#tabindex-empty',root);
    let byScript=false;
    const add=(text,cls)=>{
      const li=document.createElement('li');li.textContent=text;if(cls)li.className=cls;
      log.append(li);while(log.children.length>14)log.firstElementChild.remove();
      empty.hidden=true;
    };
    root.addEventListener('focusin',e=>{
      const el=e.target;
      const tab=el.getAttribute('tabindex');
      add(`${el.dataset.label||el.textContent.trim()}${tab!==null?` (${tab})`:''}${byScript?tx(' – per Script',' – by script'):''}`,byScript?'tabindex-script':'');
      byScript=false;
    });
    root.addEventListener('focusout',e=>{
      if(e.relatedTarget&&root.contains(e.relatedTarget))return;
      if(log.lastElementChild?.classList.contains('tabindex-out'))return;
      add(tx('↗ raus aus dem Beispiel','↗ out of the example'),'tabindex-out');
    });
    $('#tabindex-clear',root).addEventListener('click',()=>{log.replaceChildren();empty.hidden=false});
    /* Eigene Buttons: Klick, Enter (beim Drücken) und Leertaste (beim Loslassen) wie ein <button> */
    const act=el=>toast({msg:tx(`„${el.dataset.label}“ ausgelöst.`,`“${el.dataset.label}” activated.`),duration:2500});
    $$('.tabindex-act',root).forEach(el=>{
      el.addEventListener('click',()=>act(el));
      if(el.classList.contains('tabindex-bad'))return;
      el.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();act(el)}
        else if(e.key===' ')e.preventDefault();
      });
      el.addEventListener('keyup',e=>{if(e.key===' ')act(el)});
    });
    $('#tabindex-jump',root).addEventListener('click',()=>{byScript=true;$('#tabindex-results',root).focus()});
    const toggle=$('#tabindex-pos-toggle',root);
    toggle.addEventListener('click',()=>{
      const on=toggle.getAttribute('aria-pressed')!=='true';
      toggle.setAttribute('aria-pressed',String(on));
      $$('[data-pos]',root).forEach(b=>{
        const v=on?b.dataset.pos:'';
        if(v)b.setAttribute('tabindex',v);else b.removeAttribute('tabindex');
        $('.tabindex-val',b).textContent=v?`tabindex="${v}"`:'—';
      });
    });
  },
  css:`.tabindex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;align-items:start}

  bad:{code:tx(`<div class="btn" role="button" onclick="teilen()">Teilen</div>

<input name="plz" tabindex="2">
<input name="ort" tabindex="1">

<style>
  *:focus { outline: none; }
</style>`,`<div class="btn" role="button" onclick="share()">Share</div>

<input name="zip" tabindex="2">
<input name="city" tabindex="1">

<style>
  *:focus { outline: none; }
</style>`),
    note:tx('Das &lt;div&gt; heißt zwar „Schalter“, ist aber mit <kbd>Tab</kbd> unerreichbar und reagiert nicht auf <kbd>Enter</kbd>. Die positiven Werte ziehen beide Felder vor den Rest der Seite. Und ohne Fokusrahmen weiß niemand, wo er gerade steht.','The &lt;div&gt; is announced as “button” but can’t be reached with <kbd>Tab</kbd> and ignores <kbd>Enter</kbd>. The positive values pull both fields ahead of the rest of the page. And without a focus ring nobody knows where they are.')},
  good:{code:tx(`<button type="button" class="btn" onclick="teilen()">Teilen</button>

<\!-- nur wenn es wirklich kein <button> sein kann: -->
<div class="btn" role="button" tabindex="0">Teilen</div>
<\x73cript>
  div.addEventListener('keydown', e => {
    if (e.key === 'Enter') teilen();
    if (e.key === ' ') e.preventDefault(); // nicht scrollen
  });
  div.addEventListener('keyup', e => { if (e.key === ' ') teilen(); });
<\/script>

<style>
  .btn:focus-visible { outline: 3px solid var(--focus); }
</style>`,`<button type="button" class="btn" onclick="share()">Share</button>

<\!-- only if it really can't be a <button>: -->
<div class="btn" role="button" tabindex="0">Share</div>
<\x73cript>
  div.addEventListener('keydown', e => {
    if (e.key === 'Enter') share();
    if (e.key === ' ') e.preventDefault(); // don't scroll
  });
  div.addEventListener('keyup', e => { if (e.key === ' ') share(); });
<\/script>

<style>
  .btn:focus-visible { outline: 3px solid var(--focus); }
</style>`),
    note:tx('Ein <code>&lt;button&gt;</code> kann das alles von selbst. Beim &lt;div&gt; musst du Fokus (<code>tabindex="0"</code>), Rolle und beide Tasten selbst nachbauen. Die Felder stehen einfach in der richtigen Reihenfolge im HTML.','A <code>&lt;button&gt;</code> does all of this by itself. With the &lt;div&gt; you have to rebuild focus (<code>tabindex="0"</code>), role and both keys yourself. The fields simply appear in the right order in the HTML.')},
  native:tx('Fast immer: <code>&lt;button&gt;</code>, <code>&lt;a href&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> und <code>&lt;summary&gt;</code> sind von Haus aus fokussierbar und bedienbar – dort ist <code>tabindex</code> überflüssig. <code>tabindex="0"</code> brauchst du nur für eigene Widgets, die es nativ nicht gibt, und für scrollbare Bereiche ohne fokussierbaren Inhalt. <code>tabindex="-1"</code> hat kein natives Gegenstück: Es ist das Werkzeug, um Überschriften, Dialoge oder Fehlerzusammenfassungen per Script anzuspringen.','Almost always: <code>&lt;button&gt;</code>, <code>&lt;a href&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> and <code>&lt;summary&gt;</code> are focusable and operable out of the box – <code>tabindex</code> is pointless there. You only need <code>tabindex="0"</code> for custom widgets that don’t exist natively, and for scrollable areas without focusable content. <code>tabindex="-1"</code> has no native counterpart: it’s the tool for jumping to headings, dialogs or error summaries by script.'),
  do:tx([
    'Die Tab-Reihenfolge über die Reihenfolge im HTML steuern, nicht über Zahlen.',
    'Jedes Element mit <code>role="button"</code>, <code>role="checkbox"</code> usw. fokussierbar machen <em>und</em> die passenden Tasten selbst verdrahten.',
    '<code>tabindex="-1"</code> für Ziele, die nur per Script Fokus bekommen: Überschrift nach einem Seitenwechsel, Fehlerzusammenfassung, Dialog-Container.',
    'Einen deutlich sichtbaren Fokusrahmen mit <code>:focus-visible</code> gestalten – Kontrast mindestens 3:1 zum Hintergrund.'
  ],[
    'Control the tab order through the order in the HTML, not through numbers.',
    'Make every element with <code>role="button"</code>, <code>role="checkbox"</code> etc. focusable <em>and</em> wire up the matching keys yourself.',
    '<code>tabindex="-1"</code> for targets that only get focus by script: heading after a view change, error summary, dialog container.',
    'Design a clearly visible focus ring with <code>:focus-visible</code> – at least 3:1 contrast against the background.'
  ]),
  dont:tx([
    'Positive <code>tabindex</code>-Werte – sie gelten für die ganze Seite und lassen den Fokus springen.',
    '<code>tabindex="0"</code> auf Text, Überschriften oder Bilder, die man nicht bedienen kann – das sind nur zusätzliche Tab-Stopps.',
    '<code>tabindex</code> auf native Buttons und Links setzen.',
    '<code>outline:none</code> ohne gleichwertigen Ersatz.'
  ],[
    'Positive <code>tabindex</code> values – they apply to the whole page and make focus jump around.',
    '<code>tabindex="0"</code> on text, headings or images you can’t operate – that just adds tab stops.',
    'Putting <code>tabindex</code> on native buttons and links.',
    '<code>outline:none</code> without an equivalent replacement.'
  ]),
  ng:tx('<p>Bind den Tabindex als Property: <code>[tabIndex]="active ? 0 : -1"</code> – für <code>null</code> (Attribut entfernen) nimm <code>[attr.tabindex]</code>. Braucht eine Komponente ein eigenes Tastaturverhalten, gehören Rolle, Tabindex und Tasten in die <code>host</code>-Metadaten, dann kann niemand eines davon vergessen. <code>FocusMonitor</code> aus <code>@angular/cdk/a11y</code> meldet, ob der Fokus per Tastatur, Maus oder Script kam, und setzt Klassen wie <code>cdk-keyboard-focused</code>. Angular-Material-Buttons bringen das alles fertig mit.</p>','<p>Bind the tab index as a property: <code>[tabIndex]="active ? 0 : -1"</code> – for <code>null</code> (remove the attribute) use <code>[attr.tabindex]</code>. If a component needs its own keyboard behaviour, put role, tab index and keys into the <code>host</code> metadata so nobody can forget one of them. <code>FocusMonitor</code> from <code>@angular/cdk/a11y</code> tells you whether focus came from keyboard, mouse or script and sets classes like <code>cdk-keyboard-focused</code>. Angular Material buttons ship all of this ready-made.</p>'),
  ngCode:`// Only if it really can't be a <button>:
@Directive({
  selector: '[appButton]',
  host: {
    role: 'button',
    tabindex: '0',
    '(keydown.enter)': 'press($event)',
    '(keydown.space)': '$event.preventDefault()',
    '(keyup.space)': 'press($event)',
  },
})
export class AppButton {
  private readonly el = inject<ElementRef<HTMLElement>>(ElementRef);

  protected press(e: Event) {
    e.preventDefault();
    this.el.nativeElement.click(); // runs the normal (click) handler
  }
}

// <div appButton (click)="share()">Share</div>`,
  why:tx('<p>ARIA ist nur ein Etikett für den Accessibility Tree. Ein <code>&lt;div role="button"&gt;</code> ohne <code>tabindex</code> hört man im Lesemodus als „Drucken, Schalter“ – wer aber nur mit der Tastatur arbeitet, erreicht ihn nie, und im Fokusmodus passiert auf <kbd>Enter</kbd> nichts. Das Etikett verspricht etwas, das das Element nicht hält.</p><p>Positive Werte zerreißen die Reihenfolge: Der Screenreader liest die Seite von oben nach unten, die <kbd>Tab</kbd>-Taste springt aber quer darüber. Wer sich an der Tab-Reihenfolge orientiert, verliert den Zusammenhang – und ohne sichtbaren Fokusrahmen wissen sehende Tastaturnutzerinnen nicht einmal, wo sie gerade stehen.</p>','<p>ARIA is just a label for the accessibility tree. A <code>&lt;div role="button"&gt;</code> without <code>tabindex</code> is announced in browse mode as “Print, button” – but anyone using only the keyboard never reaches it, and in focus mode <kbd>Enter</kbd> does nothing. The label promises something the element doesn’t deliver.</p><p>Positive values tear the order apart: the screen reader reads the page top to bottom, but the <kbd>Tab</kbd> key jumps across it. People who orient themselves by tab order lose the context – and without a visible focus ring, sighted keyboard users don’t even know where they are.</p>')
});

LESSONS.push({
  id:'tabs',cat:'widgets',
  title:tx('Tabs: tablist, tab, tabpanel','Tabs: tablist, tab, tabpanel'),
  short:tx('Drei Rollen, ein Tab-Stopp, Pfeiltasten dazwischen.','Three roles, one tab stop, arrow keys in between.'),
  keys:'tabs registerkarten tablist tab tabpanel aria-selected roving tabindex pfeiltasten arrow keys',
  refs:['APG: Tabs','WAI-ARIA 1.2: tablist','WCAG 2.1.1','WCAG 4.1.2'],
  rule:tx('Tabs sind ein zusammengesetztes Widget: <code>tablist</code> hält die <code>tab</code>s, jeder <code>tab</code> steuert ein <code>tabpanel</code>. Die ganze Leiste ist nur ein Tab-Stopp – zwischen den Tabs wechselt man mit den Pfeiltasten.','Tabs are a composite widget: <code>tablist</code> holds the <code>tab</code>s, each <code>tab</code> controls a <code>tabpanel</code>. The whole bar is a single tab stop – you move between tabs with the arrow keys.'),
  attrs:[
    ['role="tablist"','',tx('Container der Tabs. Mit <code>aria-label</code> oder <code>aria-labelledby</code> benennen.','Container of the tabs. Name it with <code>aria-label</code> or <code>aria-labelledby</code>.')],
    ['role="tab"','',tx('Jeder einzelne Tab – am besten auf einem <code>&lt;button&gt;</code>.','Each single tab – ideally on a <code>&lt;button&gt;</code>.')],
    ['aria-selected','true | false',tx('Welcher Tab aktiv ist. Genau einer ist <code>true</code>.','Which tab is active. Exactly one is <code>true</code>.')],
    ['aria-controls','ID',tx('Verbindet den Tab mit seinem Panel.','Connects the tab to its panel.')],
    ['tabindex','0 | -1',tx('Roving Tabindex: Der aktive Tab hat <code>0</code>, alle anderen <code>-1</code>.','Roving tabindex: the active tab has <code>0</code>, all others <code>-1</code>.')],
    ['role="tabpanel"','',tx('Der Inhalt zum Tab. Mit <code>aria-labelledby</code> auf seinen Tab benannt.','The content for a tab. Named via <code>aria-labelledby</code> pointing at its tab.')]
  ],
  demo:`<div class="tabs-wrap">
  <div role="tablist" aria-label="${tx('Kontoeinstellungen','Account settings')}" class="tabs-list">
    ${[['profile',tx('Profil','Profile')],['password',tx('Passwort','Password')],['notify',tx('Benachrichtigungen','Notifications')]].map(([id,t],i)=>`<button type="button" role="tab" class="tabs-tab" id="tabs-t-${id}" aria-selected="${i?'false':'true'}" aria-controls="tabs-p-${id}" tabindex="${i?'-1':'0'}">${t}</button>`).join('')}
  </div>
  <div role="tabpanel" class="tabs-panel" id="tabs-p-profile" aria-labelledby="tabs-t-profile" tabindex="0"><p>${tx('Name, Foto und die Sprache der Oberfläche.','Name, photo and interface language.')}</p></div>
  <div role="tabpanel" class="tabs-panel" id="tabs-p-password" aria-labelledby="tabs-t-password" tabindex="0" hidden><p>${tx('Passwort ändern und Zwei-Faktor-Anmeldung.','Change password and two-factor sign-in.')}</p></div>
  <div role="tabpanel" class="tabs-panel" id="tabs-p-notify" aria-labelledby="tabs-t-notify" tabindex="0" hidden><p>${tx('E-Mails bei neuen Rechnungen und Erinnerungen.','Emails for new invoices and reminders.')}</p></div>
</div>
<p class="demo-note">${tx('<kbd>Tab</kbd> in die Leiste, dann <kbd>←</kbd> <kbd>→</kbd>, <kbd>Pos1</kbd>, <kbd>Ende</kbd>. Noch einmal <kbd>Tab</kbd> springt ins Panel, nicht zum nächsten Tab. Mit „ARIA zeigen“ siehst du <code>aria-selected</code> und <code>tabindex</code> wandern.','<kbd>Tab</kbd> into the bar, then <kbd>←</kbd> <kbd>→</kbd>, <kbd>Home</kbd>, <kbd>End</kbd>. Another <kbd>Tab</kbd> jumps into the panel, not to the next tab. With “Show ARIA” you see <code>aria-selected</code> and <code>tabindex</code> move.')}</p>`,
  init(root){
    const tabs=$$('[role="tab"]',root);
    const select=(t,focus)=>{
      tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',String(on));x.tabIndex=on?0:-1;$('#'+x.getAttribute('aria-controls'),root).hidden=!on});
      if(focus)t.focus();
    };
    root.addEventListener('click',e=>{const t=e.target.closest('[role="tab"]');if(t)select(t)});

  native:tx('Ein natives Tab-Element gibt es nicht. Prüf aber, ob du wirklich Tabs brauchst: Führt jeder „Tab“ zu einer eigenen Adresse (<code>/profil</code>, <code>/passwort</code>), ist es eine Navigation – dann <code>&lt;nav&gt;</code> mit Links und <code>aria-current="page"</code>, kein <code>role="tablist"</code>. Und oft sind untereinander stehende Abschnitte mit Überschriften einfacher und besser.','There is no native tab element. But check whether you really need tabs: if each “tab” leads to its own address (<code>/profile</code>, <code>/password</code>), it’s navigation – use <code>&lt;nav&gt;</code> with links and <code>aria-current="page"</code>, not <code>role="tablist"</code>. And often stacked sections with headings are simpler and better.'),

  ng:tx('<p>Angular Material bringt mit <code>mat-tab-group</code> fertige, zugängliche Tabs. Baust du selbst, übernimmt das CDK die Tastatur: <code>FocusKeyManager</code> aus <code>@angular/cdk/a11y</code> verwaltet Pfeiltasten, <kbd>Pos1</kbd>/<kbd>Ende</kbd> und den Fokus. Die Attribute bindest du mit <code>[attr.aria-selected]</code>, den Tabindex mit <code>[tabIndex]</code>.</p>','<p>Angular Material ships accessible tabs with <code>mat-tab-group</code>. If you build your own, the CDK handles the keyboard: <code>FocusKeyManager</code> from <code>@angular/cdk/a11y</code> manages arrow keys, <kbd>Home</kbd>/<kbd>End</kbd> and focus. Bind the attributes with <code>[attr.aria-selected]</code> and the tab index with <code>[tabIndex]</code>.</p>'),

export class Tabs {
  protected readonly tabs = [{ id: 'profile', label: 'Profile' }, { id: 'password', label: 'Password' }];
  protected readonly active = signal(0);
  private readonly buttons = viewChildren<ElementRef<HTMLButtonElement>>('tabBtn');

  protected onKey(e: KeyboardEvent) {
    const n = this.tabs.length, i = this.active();
    const next = ({ ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 } as Record<string, number>)[e.key];
    if (next === undefined) return;
    e.preventDefault();
    this.active.set(next);
    this.buttons()[next].nativeElement.focus();
  }
}`,
  why:tx('<p>Mit den Rollen hört man: „Kontoeinstellungen, Registerkartenliste – Profil, Registerkarte, ausgewählt, 1 von 3“. Das sagt alles: dass es Tabs sind, wie viele, welcher aktiv ist – und damit auch, wie man sie bedient.</p><p>Der Roving Tabindex hält die Tab-Reihenfolge kurz: Die ganze Leiste zählt als ein Stopp. Das ist die Konvention aus Desktop-Programmen, die Screenreader-Nutzer erwarten, sobald sie „Registerkarte“ hören.</p>','<p>With the roles you hear: “Account settings, tab control – Profile, tab, selected, 1 of 3”. That says it all: that these are tabs, how many, which one is active – and therefore how to operate them.</p><p>The roving tabindex keeps the tab order short: the whole bar counts as one stop. That’s the desktop-app convention screen reader users expect as soon as they hear “tab”.</p>')
});

  title:tx('Tooltips: role="tooltip" und aria-describedby','Tooltips: role="tooltip" and aria-describedby'),

  keys:'tooltip quickinfo hinweis title attribut aria-describedby aria-labelledby aria-label icon button symbol hover fokus focus esc 1.4.13 popover beschreibung description',
  refs:['WAI-ARIA 1.2: tooltip','APG: Tooltip','WCAG 1.4.13','WCAG 4.1.2'],
  rule:tx('Ein Tooltip ist eine kurze <strong>Zusatzbeschreibung</strong>: <code>role="tooltip"</code> am Text, <code>aria-describedby</code> am Auslöser. Er erscheint bei Hover <em>und</em> Fokus, lässt sich mit <kbd>Esc</kbd> schließen, ohne dass Fokus oder Maus sich bewegen, und enthält nie etwas Anklickbares. Den Namen eines Icon-Buttons ersetzt er nicht automatisch.','A tooltip is a short <strong>supplementary description</strong>: <code>role="tooltip"</code> on the text, <code>aria-describedby</code> on the trigger. It appears on hover <em>and</em> focus, can be dismissed with <kbd>Esc</kbd> without moving focus or pointer, and never contains anything clickable. It doesn’t automatically replace an icon button’s name.'),
  attrs:[

<p class="demo-note">${tx('Geh mit <kbd>Tab</kbd> durch beide Reihen: Links erscheint nie ein Tooltip, rechts bei jedem Fokus. Drück <kbd>Esc</kbd> – der Tooltip verschwindet, der Fokus bleibt. Mit der Maus kannst du auf den Tooltip fahren, ohne dass er verschwindet. Im Inspektor: „Kopieren“ bekommt den Namen aus dem Tooltip (<code>aria-labelledby</code>), „Löschen“ aus <code>aria-label</code> – dessen Tooltip ist nur die sichtbare Kopie und darum <code>aria-hidden</code>, sonst hörst du „Löschen“ doppelt. „Speichern“ hat den Tooltip als Beschreibung.','<kbd>Tab</kbd> through both rows: on the left no tooltip ever appears, on the right one appears on every focus. Press <kbd>Esc</kbd> – the tooltip disappears, focus stays. With the mouse you can move onto the tooltip without it vanishing. In the inspector: “Copy” gets its name from the tooltip (<code>aria-labelledby</code>), “Delete” from <code>aria-label</code> – its tooltip is only the visible copy and therefore <code>aria-hidden</code>, otherwise you’d hear “Delete” twice. “Save” has the tooltip as its description.')}</p>`,
  init(root){
    const tips=$$('.tooltip-wrap',root).map(w=>({w,btn:$('button',w),tip:$('.tooltip-tip',w),hover:false,focus:false}));
    /* Sichtbar, solange Maus oder Fokus da sind – immer nur ein Tooltip auf einmal */
    const update=s=>{
      const show=s.hover||s.focus;
      if(show)tips.forEach(o=>{if(o!==s)o.tip.hidden=true});
      s.tip.hidden=!show;
    };
    tips.forEach(s=>{
      s.w.addEventListener('pointerenter',()=>{s.hover=true;update(s)});
      s.w.addEventListener('pointerleave',()=>{s.hover=false;update(s)});
      s.btn.addEventListener('focus',()=>{s.focus=true;update(s)});
      s.btn.addEventListener('blur',()=>{s.focus=false;update(s)});
    });
    root.addEventListener('click',e=>{const b=e.target.closest('button[data-done]');if(b)toast({msg:b.dataset.done})});
    /* Esc am document: Der Tooltip muss sich auch schließen lassen, wenn nur die Maus darüber steht und der Fokus woanders ist */
    const onKey=e=>{if(e.key==='Escape')tips.forEach(s=>{s.tip.hidden=true})};
    document.addEventListener('keydown',onKey);
    return()=>document.removeEventListener('keydown',onKey);
  },

  native:tx('Nicht wirklich. Das <code>title</code>-Attribut ist der einzige „native Tooltip“, und der erfüllt WCAG 1.4.13 nicht: Er erscheint nur bei Maus-Hover, nicht bei Fokus und nicht auf Touch-Geräten, man kann ihn nicht mit der Maus erreichen, und ob Screenreader ihn vorlesen, hängt von Browser und Einstellungen ab. Die Popover-API (<code>popover</code>) hilft beim Anzeigen über allem anderen, bringt aber keine Tooltip-Semantik – Rolle, Verknüpfung und Hover-/Fokus-Logik brauchst du trotzdem. Oft ist die beste Lösung gar kein Tooltip: ein sichtbarer Text neben dem Symbol.','Not really. The <code>title</code> attribute is the only “native tooltip”, and it fails WCAG 1.4.13: it only appears on mouse hover, not on focus and not on touch devices, you can’t move the pointer onto it, and whether screen readers read it depends on browser and settings. The Popover API (<code>popover</code>) helps with showing things above everything else, but brings no tooltip semantics – you still need the role, the reference and the hover/focus logic. Often the best solution is no tooltip at all: visible text next to the icon.'),

/* ---------- ARIA-Engine ----------
   Berechnet für ein Element, was im Accessibility Tree ankommt: Rolle (explizit oder implizit),
   Name samt Quelle, Beschreibung, Zustände. Vereinfacht nach „Accessible Name and Description

const SECTIONING='article,aside,main,nav,section';

  switch(t){
    case 'a':case 'area':return el.hasAttribute('href')?'link':'';
    case 'button':case 'summary':return 'button';
    case 'nav':return 'navigation';
    case 'main':return 'main';
    case 'aside':return el.parentElement?.closest(SECTIONING)&&!named()?'':'complementary';
    case 'search':return 'search';
    case 'header':return el.parentElement?.closest(SECTIONING)?'':'banner';
    case 'footer':return el.parentElement?.closest(SECTIONING)?'':'contentinfo';
    case 'section':return named()?'region':'';
    case 'form':return named()?'form':'';
    case 'article':return 'article';
    case 'dialog':return 'dialog';
    case 'figure':return 'figure';
    case 'ul':case 'ol':case 'menu':return 'list';
    case 'li':return 'listitem';
    case 'table':return 'table';
    case 'tr':return 'row';
    case 'td':return 'cell';
    case 'th':return el.getAttribute('scope')==='row'?'rowheader':'columnheader';
    case 'img':return el.getAttribute('alt')===''?'presentation':'img';
    case 'textarea':return 'textbox';
    case 'select':return el.multiple||el.size>1?'listbox':'combobox';
    case 'option':return 'option';
    case 'progress':return 'progressbar';
    case 'meter':return 'meter';
    case 'output':return 'status';
    case 'fieldset':case 'details':case 'optgroup':return 'group';
    case 'hr':return 'separator';
    case 'p':return 'paragraph';
    case 'input':
      if(['button','submit','reset','image'].includes(type))return 'button';
      if(type==='checkbox')return 'checkbox';
      if(type==='radio')return 'radio';
      if(type==='range')return 'slider';
      if(type==='number')return 'spinbutton';
      if(type==='hidden')return '';
      if(type==='search')return el.hasAttribute('list')?'combobox':'searchbox';
      return el.hasAttribute('list')?'combobox':'textbox';
  }

const roleOf=el=>{const r=(el.getAttribute('role')||'').trim().split(/\s+/)[0];return r?{role:r,explicit:true}:{role:implicitRole(el),explicit:false}};
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
/* Versteckt für den Accessibility Tree: aria-hidden, hidden, inert, display:none, visibility:hidden */

const FROM_CONTENT=new Set(['button','link','tab','menuitem','menuitemcheckbox','menuitemradio','option','heading','cell','columnheader','rowheader','gridcell','checkbox','radio','switch','treeitem','tooltip','row']);
const byIds=v=>clean(v).split(' ').filter(Boolean).map(id=>document.getElementById(id));

const INTERACTIVE=new Set(['button','link','checkbox','radio','switch','tab','textbox','searchbox','combobox','slider','spinbutton','menuitem','menuitemcheckbox','menuitemradio','option','treeitem','gridcell','listbox']);

  const pressed=a('aria-pressed');if(pressed!=null)add('pressed',pressed,pressed==='true'?tx('gedrückt','pressed'):pressed==='mixed'?tx('teilweise gedrückt','half pressed'):tx('nicht gedrückt','not pressed'));

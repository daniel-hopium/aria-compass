  <section class="demo" aria-labelledby="demo-h">
    <div class="demo-head"><h2 id="demo-h">${tx('Live-Beispiel','Live example')}</h2><span>${tx('Schalte oben „ARIA zeigen“ ein und bediene das Beispiel – mit Maus und Tastatur.','Turn on “Show ARIA” at the top and use the example – with mouse and keyboard.')}</span></div>
    <div class="demo-body">${l.demo}</div>
    ${inspectorHTML('insp-'+l.id)}
  </section>
  ${l.bad||l.good?`<h2>${tx('So nicht – so','Don’t – do')}</h2><div class="k-code">${l.bad?codeFig(false,tx('So nicht','Don’t'),l.bad.code):''}${l.good?codeFig(true,tx('So','Do'),l.good.code):''}</div>
  ${l.bad?.note||l.good?.note?`<div class="code-notes">${l.bad?.note?`<p><b>${tx('So nicht','Don’t')}:</b> ${l.bad.note}</p>`:''}${l.good?.note?`<p><b>${tx('So','Do')}:</b> ${l.good.note}</p>`:''}</div>`:''}`:''}
  ${l.native?`<aside class="here native" aria-labelledby="native-h"><h2 id="native-h">${tx('Geht es ohne ARIA?','Can native HTML do it?')}</h2><p>${l.native}</p></aside>`:''}
  <div class="dodont">
    <section class="dd do" aria-labelledby="do-h"><h2 id="do-h">${ic('ok')} ${tx('Richtig','Do')}</h2><ul>${l.do.map(x=>`<li>${x}</li>`).join('')}</ul></section>
    <section class="dd dont" aria-labelledby="dont-h"><h2 id="dont-h">${ic('xc')} ${tx('Falsch','Don’t')}</h2><ul>${l.dont.map(x=>`<li>${x}</li>`).join('')}</ul></section>
  </div>
  ${l.ng?`<section class="ng" aria-labelledby="ng-h"><h2 id="ng-h">${tx('In Angular','In Angular')}</h2><div class="prose">${l.ng}</div>${l.ngCode?`<div class="k-code k-code-1">${codeFig(true,'Angular',l.ngCode)}</div>`:''}</section>`:''}
  <h2>${tx('Warum?','Why?')}</h2>
  <div class="prose">${l.why}</div>
  <div class="learned"><input type="checkbox" id="learned-cb" ${learned.has(l.id)?'checked':''}><label for="learned-cb">${tx('Als gelernt markieren','Mark as learned')}<span class="hint">${tx('Wird nur in diesem Browser gespeichert.','Only stored in this browser.')}</span></label></div>
  <nav class="pager" aria-label="${tx('Weitere Lektionen','More lessons')}">${prev?`<a class="prev" href="#${prev.id}"><small>${tx('← Vorherige','← Previous')}</small>${prev.title}</a>`:`<a class="prev" href="#start"><small>${tx('← Zurück zum','← Back to the')}</small>${tx('Start','start page')}</a>`}${next?`<a class="next" href="#${next.id}"><small>${tx('Nächste →','Next →')}</small>${next.title}</a>`:`<a class="next" href="#reference"><small>${tx('Weiter →','Next →')}</small>${REF.title}</a>`}</nav>
</article>`;
}
function startHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Willkommen','Welcome')}</p>
  <h1 id="lesson-title" tabindex="-1">${tx('ARIA zum Anfassen','ARIA you can touch')}</h1>
  <p class="rule">${tx('ARIA ergänzt HTML um Rollen, Namen und Zustände für Screenreader. Richtig eingesetzt macht es eigene Widgets zugänglich – falsch eingesetzt macht es alles schlimmer. Hier siehst du live, was jedes Attribut im Accessibility Tree bewirkt.','ARIA adds roles, names and states to HTML for screen readers. Used right, it makes custom widgets accessible – used wrong, it makes everything worse. Here you see live what each attribute does in the accessibility tree.')}</p>
  <div class="start-grid">
    <div class="tile"><h3>${ic('tag')} ${tx('ARIA zeigen','Show ARIA')}</h3><p>${tx('Beschriftet jedes Element mit Rolle und aria-Attributen – live, während du klickst. Rosa: explizites ARIA. Grau gestrichelt: die Rolle, die HTML von selbst mitbringt.','Labels every element with its role and aria attributes – live, while you click. Pink: explicit ARIA. Grey dashed: the role HTML brings by itself.')}</p><button type="button" class="btn btn-secondary" id="st-aria">${tx('Jetzt einschalten','Turn on now')}</button></div>
    <div class="tile"><h3>${ic('search')} ${tx('Inspektor','Inspector')}</h3><p>${tx('Unter jedem Live-Beispiel: Rolle, Name (und woher er kommt), Zustände und ungefähr die Ansage eines Screenreaders. Mit Warnungen bei typischen Fehlern.','Below every live example: role, name (and where it comes from), states and roughly what a screen reader says. With warnings for common mistakes.')}</p></div>
    <div class="tile"><h3>${ic('menu')} ${tx('Baum','Tree')}</h3><p>${tx('Der Inspektor zeigt auf Wunsch den Accessibility Tree des Beispiels – so, wie Hilfstechnik die Seite sieht.','On request the inspector shows the example’s accessibility tree – the page as assistive technology sees it.')}</p></div>
    <div class="tile"><h3>${ic('keyboard')} ${tx('Tastatur','Keyboard')}</h3><p>${tx('<kbd>Tab</kbd> zum Weiterspringen, <kbd>Strg</kbd> + <kbd>K</kbd> für die Suche. Die Widgets reagieren auf Pfeiltasten wie im APG beschrieben.','<kbd>Tab</kbd> to move on, <kbd>Ctrl</kbd> + <kbd>K</kbd> for search. The widgets respond to arrow keys as described in the APG.')}</p></div>
  </div>
  <h2>${tx('Die erste Regel','The first rule')}</h2>
  <p class="prose-p">${tx('Wenn ein natives HTML-Element das kann, was du brauchst: nimm es. <code>&lt;button&gt;</code> statt <code>&lt;div role="button"&gt;</code>. Die WebAIM-Million-Studie findet jedes Jahr auf Seiten mit ARIA mehr Fehler als auf Seiten ohne – nicht weil ARIA schadet, sondern weil es oft falsch eingesetzt wird. Jede Lektion hat darum einen Abschnitt „Geht es ohne ARIA?“.','If a native HTML element does what you need: use it. <code>&lt;button&gt;</code> instead of <code>&lt;div role="button"&gt;</code>. Every year the WebAIM Million study finds more errors on pages with ARIA than on pages without – not because ARIA hurts, but because it is so often used wrong. That’s why every lesson has a section “Can native HTML do it?”.')}</p>
  <h2>${tx('Die Kapitel','The chapters')}</h2>
  <ul class="chapters">${CHAPTERS.map(c=>{const ls=LESSONS.filter(l=>l.cat===c.id);return ls.length?`<li><a href="#${ls[0].id}">${c.title}<span>${tx(`${ls.length} Lektionen`,`${ls.length} lessons`)}</span></a></li>`:''}).join('')}</ul>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  <div class="start-grid sisters"><div class="tile"><h3>${ic('button')} Daumenregel</h3><p>${tx('UI-Regeln mit Live-Beispielen und Negativbeispielen – dazu der WCAG-Kompass und Gut &amp; Schlecht mit Quiz.','UI rules with live examples and counter-examples – plus the WCAG compass and Good &amp; Bad with a quiz.')}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/pattern-library/?lang=${LANG}">${tx('Daumenregel öffnen','Open Daumenregel')}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div><div class="tile"><h3>${ic('palette')} CSS-Atlas</h3><p>${tx('Die CSS-Referenz mit Live-Vorschau: 53 Eigenschaften und Selektoren – Wert anklicken, Wirkung sehen.','The CSS reference with live previews: 53 properties and selectors – click a value, see the effect.')}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/css-atlas/?lang=${LANG}">${tx('CSS-Atlas öffnen','Open CSS Atlas')}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div></div>
  <p style="margin-top:28px"><a class="btn btn-primary" href="#${LESSONS[0].id}">${tx('Mit Lektion 1 starten','Start with lesson 1')} ${ic('fwd')}</a></p>
</article>`;
}
function refHTML(){
  const rows=LESSONS.flatMap(l=>(l.attrs||[]).map(a=>({a,l})));
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Nachschlagen','Reference')}</p>
  <h1 id="lesson-title" tabindex="-1">${REF.title}</h1>
  <p class="rule">${tx(`${rows.length} Einträge aus allen Lektionen. Der Link führt zur Lektion mit Live-Beispiel.`,`${rows.length} entries from all lessons. The link leads to the lesson with a live example.`)}</p>
  <div class="field ref-find"><label for="ref-q">${tx('Attribut oder Rolle suchen','Search attribute or role')}</label><input class="input" id="ref-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ref-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${REF.title}"><table class="kb-table attrs"><caption class="sr-only">${REF.title}</caption><thead><tr><th scope="col">${tx('Attribut','Attribute')}</th><th scope="col">${tx('Werte','Values')}</th><th scope="col">${tx('Wozu','Purpose')}</th><th scope="col">${tx('Lektion','Lesson')}</th></tr></thead>
  <tbody>${rows.map(({a:[a,v,t],l})=>`<tr data-q="${esc(norm(`${a} ${v} ${t.replace(/<[^>]+>/g,'')} ${l.title}`))}"><td><code>${esc(a)}</code></td><td>${v?`<code>${esc(v)}</code>`:''}</td><td>${t}</td><td><a href="#${l.id}">${l.title}</a></td></tr>`).join('')}</tbody></table></div>
</article>`;
}
function refInit(root){
  const q=$('#ref-q',root),rows=$$('tbody tr',root),count=$('#ref-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${rows.length} Einträgen`,`${n} of ${rows.length} entries`):tx(`${rows.length} Einträge`,`${rows.length} entries`)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> ist keine Lektion. Vielleicht hat der Link einen Tippfehler.`,`There is no lesson at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zur Startseite','Go to start page')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Lektion suchen','Search lessons')}</button></div>
  </div></article>`;
}
const APP=tx('ARIA-Kompass','ARIA Compass');
let lastId=null,masterScroll=0;
function route(fromUser){
  cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  shell.dataset.view=overview?'master':'detail';
  let title;
  if(overview||id==='start'){currentId='start';view.innerHTML=startHTML();title=START.title}
  else if(id==='reference'){currentId=id;view.innerHTML=refHTML();cleanup.push(refInit(view));title=REF.title}
  else if(BY_ID[id]){
    const l=BY_ID[id];currentId=id;view.innerHTML=lessonHTML(l);title=l.title;
    const demo=$('.demo-body',view);
    const c=l.init?.(demo);if(typeof c==='function')cleanup.push(c);
    cleanup.push(initInspector(demo,$('.insp',view)));
  }
  else{currentId=null;view.innerHTML=notFoundHTML(id);title=tx('Nicht gefunden','Not found')}
  document.title=`${title} · ${APP}`;
  markActive(currentId);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`.item[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{detail.scrollTop=0;$('#lesson-title').focus({preventScroll:true})}
  if(!overview&&currentId)lastId=currentId;
}

/* ---------- Globale Ereignisse ---------- */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});
document.addEventListener('click',e=>{
  if(e.target.closest('#aria-switch')){setAria(!axOn);toast({msg:axOn?tx('ARIA wird angezeigt.','ARIA is shown.'):tx('ARIA-Beschriftung aus.','ARIA labels off.'),duration:2500})}
  if(e.target.closest('#st-aria'))setAria(true);
  if(e.target.closest('#nf-search'))focusSearch();
});
view.addEventListener('change',e=>{
  if(e.target.id!=='learned-cb'||!BY_ID[currentId])return;
  const l=BY_ID[currentId];
  if(e.target.checked)learned.add(l.id);else learned.delete(l.id);
  store.set('learned',[...learned]);renderList();updateProgress();
  toast(e.target.checked?{msg:tx(`„${l.title}“ als gelernt markiert – ${learned.size} von ${LESSONS.length}.`,`“${l.title}” marked as learned – ${learned.size} of ${LESSONS.length}.`),type:'success',duration:3500}:{msg:tx('Markierung entfernt.','Mark removed.'),duration:3000});
});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Kürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&activeUndo&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();activeUndo.run()}
});

/* ---------- Start ---------- */
updateLangLink();
setAria(!!store.get('aria-show',false));
updateProgress();
renderList();
route(false);
})();
</script>
</body>
</html>

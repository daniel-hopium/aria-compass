<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ARIA-Kompass</title>
<meta name="description" content="WAI-ARIA zum Anfassen: Rollen, Namen und Zustände mit Live-Beispielen, Accessibility-Inspektor und Angular-Hinweisen.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --anno:#A3135F; --anno-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --ph-bad:#A3A3A3;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#0F766E; --brand-ink-l:#FFFFFF; --brand-soft-l:#E3F3F1;
  --brand-d:#5EEAD4; --brand-ink-d:#042F2E; --brand-soft-d:#0E2B29;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --anno:#FF7AB8; --anno-ink:#2A0717;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --ph-bad:#555B64;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --anno:#FF7AB8; --anno-ink:#2A0717;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --ph-bad:#555B64;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Switch */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;background:transparent;border:0;border-radius:var(--radius-ctl);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.switch:hover{background:var(--surface-2)}
.track{width:42px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .15s;flex:none}
.thumb{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch[aria-checked="true"] .track{background:var(--brand)}
.switch[aria-checked="true"] .thumb{transform:translateX(16px);background:var(--brand-ink)}

/* Segmented control */
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:700;padding:0;margin-bottom:8px}
.seg-opts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface)}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:.9375rem}
.seg label:hover{background:var(--surface-2)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.progress{display:grid;gap:6px;position:relative}
.progress-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>span{display:block;height:100%;width:var(--p,0%);background:var(--brand);transition:width .3s}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.lessons-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;position:relative}
.refs li{font:600 .75rem/1.2 var(--font-mono);padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--muted);background:var(--surface)}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0;position:relative}
@container (min-width:620px){.numbers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.num{background:var(--surface);padding:14px 16px}
.num dt{font:600 1.0625rem/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num dd{margin:5px 0 0;font-size:.875rem;color:var(--muted);line-height:1.4}
.demo{margin-top:40px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);position:relative}
.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.lesson .demo-head h2{margin:0;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase}
.demo-head span{font-size:.875rem;color:var(--muted)}
.demo-body{padding:20px 18px 22px;display:grid;gap:28px;min-width:0}
.demo-body h3{font:700 1rem/1.3 var(--font-body);margin:0 0 10px}
.demo-note{font-size:.875rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:40px;position:relative}
.dd{border-top:4px solid var(--success);padding-top:12px}
.dd.dont{border-top-color:var(--danger)}
.lesson .dd h2{display:flex;align-items:center;gap:8px;font:700 1rem/1.3 var(--font-body);margin:0 0 10px;color:var(--success)}
.lesson .dd.dont h2{color:var(--danger)}
.dd ul{margin:0;padding-left:1.15em;display:grid;gap:8px}
.prose p{margin:0 0 12px;max-width:68ch}
.here{margin-top:40px;padding:16px 18px 18px;background:var(--brand-soft);border-radius:var(--radius-lg);position:relative}
.lesson .here h2{margin:0 0 6px;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.here p{margin:0;max-width:68ch}
.learned{margin-top:32px;display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);position:relative;min-height:56px}
.learned input{width:24px;height:24px;accent-color:var(--brand);margin:0;flex:none}
.learned label{font-weight:700;cursor:pointer;flex:1}
.learned .hint{display:block;font-weight:400}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Tags used in comparisons */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;margin:0 0 8px}
.tag .ic{width:18px;height:18px}
.tag-good{color:var(--success)}
.tag-bad{color:var(--danger)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.compare figure{margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);min-width:0}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.anatomy{margin:0;padding-left:1.4em;display:grid;gap:6px}
.anatomy li::marker{font-family:var(--font-mono);color:var(--muted)}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chapters a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-weight:700}
.chapters a:hover{color:var(--brand)}
.chapters span{font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:.875rem;white-space:nowrap}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.kb-table{width:100%;border-collapse:collapse;font-size:.9375rem}
.kb-table th,.kb-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kb-table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}

#aria-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.ax-box{position:absolute;border:2px solid var(--ax);border-radius:3px}
.ax-box.imp{border:1.5px dashed var(--ax-imp)}
.ax-box.warn{border-color:var(--ax-warn);border-style:dotted}

.ax-tag.imp{background:var(--ax-imp);color:var(--ax-imp-ink)}
.ax-tag.warn{background:var(--ax-warn);color:var(--ax-warn-ink)}

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={
  get(k,d){try{const v=localStorage.getItem('aria-kompass:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},

/* ---------- Sprache ----------
   Die Sprache gilt für den ganzen Seitenaufruf, der Umschalter lädt neu. Darum darf tx() auch in Daten
   stehen, die beim Start einmal ausgewertet werden. Reihenfolge: ?lang=, gespeicherte Wahl, Browsersprache. */
const LANG=(()=>{
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='de'||q==='en'){store.set('lang',q);return q}
  const s=store.get('lang',null);
  return s==='de'||s==='en'?s:/^de/i.test(navigator.language||'')?'de':'en';
})();
const tx=(de,en)=>LANG==='en'?en:de;
const LOCALE=tx('de-AT','en-US');
document.documentElement.lang=LANG;
const langHref=l=>{const u=new URL(location.href);u.searchParams.set('lang',l);return u.href};
/* Statische Texte der Hülle: data-en ersetzt den Text, data-en-anno und data-en-label die Attribute */
if(LANG==='en')$$('[data-en],[data-en-anno],[data-en-label]').forEach(el=>{
  if(el.dataset.en)el.textContent=el.dataset.en;
  if(el.dataset.enAnno)el.dataset.anno=el.dataset.enAnno;
  if(el.dataset.enLabel)el.setAttribute('aria-label',el.dataset.enLabel);
});
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow=()=>matchMedia('(max-width: 799px)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmt=n=>tx(n.toFixed(2).replace('.',','),n.toFixed(2));

const P={

const ic=(n,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ic ${cls}">${P[n]}</svg>`;

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.dataset.anno='Toast';
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}
function focusMainHeading(){const h=$('#lesson-title');if(h)h.focus({preventScroll:true})}

/* ---------- Kapitel ---------- */

];
const LESSONS=[];
LESSONS.push({
  id:'activedescendant',cat:'focus',
  title:tx('Virtueller Fokus: aria-activedescendant','Virtual focus: aria-activedescendant'),
  short:tx('Der echte Fokus bleibt stehen, ein Attribut zeigt auf das aktive Kind.','Real focus stays put, an attribute points to the active child.'),
  keys:'aria-activedescendant activedescendant roving tabindex virtueller fokus virtual focus listbox option combobox pfeiltasten arrow keys grid tree',
  refs:['WAI-ARIA 1.2: aria-activedescendant','APG: Developing a Keyboard Interface','APG: Listbox','WCAG 2.1.1'],
  rule:tx('Bei <code>aria-activedescendant</code> bleibt der DOM-Fokus auf dem Container oder dem Eingabefeld; das Attribut zeigt per ID auf das Kind, das gerade „virtuell“ fokussiert ist. Der Browser meldet dieses Kind dem Screenreader, als hätte es den Fokus – hervorheben und in den sichtbaren Bereich scrollen musst du es selbst.','With <code>aria-activedescendant</code>, DOM focus stays on the container or the input; the attribute points by ID to the child that is “virtually” focused. The browser reports that child to the screen reader as if it had focus – highlighting it and scrolling it into view is up to you.'),
  attrs:[
    ['aria-activedescendant','ID',tx('Auf dem Element mit DOM-Fokus (<code>listbox</code>, Combobox-Eingabefeld, <code>grid</code>, <code>tree</code> …). Zeigt auf das aktive Kind; entfernen, wenn keines aktiv ist.','On the element with DOM focus (<code>listbox</code>, combobox input, <code>grid</code>, <code>tree</code> …). Points to the active child; remove it when none is active.')],
    ['tabindex="0"','',tx('Auf dem Container, damit er den Fokus bekommt. Die Kinder bekommen keinen Tabindex.','On the container so it can take focus. The children get no tab index.')],
    ['id','',tx('Jedes Kind, auf das gezeigt werden kann, braucht eine eindeutige ID.','Every child that can be pointed to needs a unique ID.')],
    ['role="option"','option | gridcell | treeitem | …',tx('Das Ziel braucht eine Rolle und muss Nachfahre des Containers sein – im DOM, per <code>aria-owns</code> oder, bei einer Combobox, im per <code>aria-controls</code> verbundenen Popup.','The target needs a role and must be a descendant of the container – in the DOM, via <code>aria-owns</code> or, for a combobox, in the popup connected via <code>aria-controls</code>.')],
    ['aria-selected','true | false',tx('Die Auswahl – nicht dasselbe wie „aktiv“. In einer Einzelauswahl folgen sie meist einander, in einer Mehrfachauswahl nicht.','The selection – not the same as “active”. In single select they usually go together, in multi-select they don’t.')]
  ],
  demo:(()=>{
    const cities=[['wien',tx('Wien','Vienna')],['graz','Graz'],['linz','Linz'],['salzburg','Salzburg'],['innsbruck','Innsbruck']];
    const read=k=>`<dl class="activedescendant-read" id="activedescendant-read-${k}">

<p class="demo-note">${tx('<kbd>Tab</kbd> in die linke Liste, dann <kbd>↓</kbd> <kbd>↑</kbd> <kbd>Pos1</kbd> <kbd>Ende</kbd>: Der DOM-Fokus springt von Option zu Option, <code>tabindex</code> wandert mit. Rechts bleibt der DOM-Fokus auf der &lt;ul&gt;, nur <code>aria-activedescendant</code> ändert sich – die Markierung zeichnet das Script. Der Inspektor macht es wie ein Screenreader: Rechts zeigt er die Option, auf die das Attribut zeigt, und vermerkt, dass der DOM-Fokus auf der Liste bleibt.','<kbd>Tab</kbd> into the left list, then <kbd>↓</kbd> <kbd>↑</kbd> <kbd>Home</kbd> <kbd>End</kbd>: DOM focus jumps from option to option, <code>tabindex</code> moves along. On the right, DOM focus stays on the &lt;ul&gt;, only <code>aria-activedescendant</code> changes – the highlight is drawn by the script. The inspector works like a screen reader: on the right it shows the option the attribute points to and notes that DOM focus stays on the list.')}</p>`;

  init(root){
    const L=[
      {lb:$('#activedescendant-rov',root),read:$('#activedescendant-read-r',root),ad:false},
      {lb:$('#activedescendant-ad',root),read:$('#activedescendant-read-a',root),ad:true}
    ];
    const opts=l=>$$('[role="option"]',l.lb);
    const label=o=>{const t=o.textContent.trim();return tx(`„${t}“`,`“${t}”`)};
    const tag=el=>`<${el.localName}${el.id?` id="${el.id}"`:''}>`;
    const set=(l,k,v)=>{$(`[data-k="${k}"]`,l.read).textContent=v};
    const render=(l,focused)=>{
      const inside=!!focused&&l.lb.contains(focused);
      set(l,'dom',inside?tag(focused):tx('woanders – nicht in dieser Liste','elsewhere – not in this list'));
      if(l.ad){
        const id=l.lb.getAttribute('aria-activedescendant');
        set(l,'virt',id?`#${id}${inside?'':tx(' (ruht, solange die Liste keinen Fokus hat)',' (idle while the list has no focus)')}`:'—');
      }else set(l,'virt',tx('keiner – der echte Fokus liegt direkt auf der Option','none – real focus sits directly on the option'));
    };
    const current=l=>l.ad?opts(l).find(o=>o.id===l.lb.getAttribute('aria-activedescendant')):opts(l).find(o=>o.tabIndex===0);
    const move=(l,to)=>{
      const from=current(l);
      opts(l).forEach(o=>{
        const on=o===to;
        o.setAttribute('aria-selected',String(on));
        if(l.ad)o.classList.toggle('activedescendant-vfocus',on);else o.tabIndex=on?0:-1;
      });
      if(l.ad){
        l.lb.setAttribute('aria-activedescendant',to.id);
        to.scrollIntoView({block:'nearest',inline:'nearest'});
        if(document.activeElement!==l.lb)l.lb.focus();
        set(l,'changed',`<ul> aria-activedescendant="${to.id}"`);
      }else{
        to.focus();
        set(l,'changed',from&&from!==to?`tabindex: ${label(from)} 0 → -1, ${label(to)} -1 → 0`:`tabindex: ${label(to)} = 0`);
      }
      render(l,document.activeElement);
    };
    L.forEach(l=>{
      l.lb.addEventListener('keydown',e=>{
        const os=opts(l),i=os.indexOf(current(l));
        const n={ArrowDown:Math.min(i+1,os.length-1),ArrowUp:Math.max(i-1,0),Home:0,End:os.length-1}[e.key];
        if(n===undefined)return;
        e.preventDefault();move(l,os[n]);
      });
      l.lb.addEventListener('click',e=>{const o=e.target.closest('[role="option"]');if(o)move(l,o)});
      render(l,null);
    });
    root.addEventListener('focusin',e=>L.forEach(l=>render(l,e.target)));
    root.addEventListener('focusout',e=>L.forEach(l=>render(l,e.relatedTarget)));
  },

    note:tx('Fokussierbarer Container mit Rolle, Optionen mit Rolle und ID, eine eigene Klasse für die sichtbare Markierung und Scrollen per Script – das alles übernimmt der Browser nur beim echten Fokus.','Focusable container with a role, options with role and ID, a class of your own for the visible highlight and scrolling by script – the browser only does all that for real focus.')},
  native:tx('Für eine einfache Auswahl ja: <code>&lt;select&gt;</code> erledigt Rolle, Fokus, Pfeiltasten und Ansage von selbst. <code>&lt;input list&gt;</code> mit <code>&lt;datalist&gt;</code> ist eine native Combobox, aber kaum gestaltbar und je nach Browser und Screenreader unterschiedlich gut. Für Toolbars, Tabs, Raster und eigene Comboboxen gibt es kein natives Element – dann musst du dich zwischen Roving Tabindex und <code>aria-activedescendant</code> entscheiden.','For a simple choice, yes: <code>&lt;select&gt;</code> handles role, focus, arrow keys and announcement by itself. <code>&lt;input list&gt;</code> with <code>&lt;datalist&gt;</code> is a native combobox, but barely stylable and uneven across browsers and screen readers. For toolbars, tabs, grids and custom comboboxes there’s no native element – then you have to choose between roving tabindex and <code>aria-activedescendant</code>.'),

  ng:tx('<p>Das CDK hat für beide Wege einen Key-Manager in <code>@angular/cdk/a11y</code>: <code>FocusKeyManager</code> für Roving Tabindex (die Einträge implementieren <code>FocusableOption</code> mit <code>focus()</code>) und <code>ActiveDescendantKeyManager</code> für den virtuellen Fokus (die Einträge implementieren <code>Highlightable</code> mit <code>setActiveStyles()</code>/<code>setInactiveStyles()</code>). Beide kennen Pfeiltasten, <kbd>Pos1</kbd>/<kbd>Ende</kbd> und Buchstabensuche (<code>withTypeAhead()</code>). <code>mat-select</code> und <code>mat-autocomplete</code> arbeiten intern mit <code>aria-activedescendant</code>.</p>','<p>The CDK has a key manager for each approach in <code>@angular/cdk/a11y</code>: <code>FocusKeyManager</code> for roving tabindex (items implement <code>FocusableOption</code> with <code>focus()</code>) and <code>ActiveDescendantKeyManager</code> for virtual focus (items implement <code>Highlightable</code> with <code>setActiveStyles()</code>/<code>setInactiveStyles()</code>). Both handle arrow keys, <kbd>Home</kbd>/<kbd>End</kbd> and type-ahead (<code>withTypeAhead()</code>). <code>mat-select</code> and <code>mat-autocomplete</code> use <code>aria-activedescendant</code> internally.</p>'),
  ngCode:`import { ActiveDescendantKeyManager, Highlightable } from '@angular/cdk/a11y';

let nextId = 0;

@Component({
  selector: 'li[appOption]',
  host: { role: 'option', '[id]': 'id', '[attr.aria-selected]': 'active()', '[class.active]': 'active()' },
  template: '<ng-content />',
})
export class AppOption implements Highlightable {
  readonly id = \`option-\${nextId++}\`;
  protected readonly active = signal(false);
  setActiveStyles() { this.active.set(true); }
  setInactiveStyles() { this.active.set(false); }
}

@Component({
  selector: 'app-city-list',
  imports: [AppOption],
  template: \`
    <ul role="listbox" tabindex="0" aria-label="City"
        [attr.aria-activedescendant]="activeId()" (keydown)="onKey($event)">
      @for (city of cities; track city) { <li appOption>{{ city }}</li> }
    </ul>
  \`,
})
export class CityList {
  protected readonly cities = ['Vienna', 'Graz', 'Linz'];
  protected readonly activeId = signal<string | null>(null);
  private readonly keys = new ActiveDescendantKeyManager(viewChildren(AppOption), inject(Injector));

  protected onKey(e: KeyboardEvent) {
    this.keys.onKeydown(e);
    this.activeId.set(this.keys.activeItem?.id ?? null);
  }
}`,
  why:tx('<p>Richtig gebaut klingen beide Wege gleich: Pfeil nach unten, und man hört „Graz, 2 von 5“. Der Unterschied zeigt sich bei der Combobox: Die Nutzerin tippt „Sa“, drückt <kbd>↓</kbd>, hört „Salzburg, 1 von 1“ – und kann weitertippen, weil der Fokus das Eingabefeld nie verlassen hat. Mit Roving Tabindex würde der Fokus in die Liste springen, und jeder weitere Buchstabe ginge ins Leere.</p><p>Wo der Fokus wandern darf, ist Roving Tabindex robuster: Der Browser scrollt selbst, <code>:focus</code> funktioniert, Bildschirmlupen folgen dem echten Fokus, und die Unterstützung ist überall gleich gut. <code>aria-activedescendant</code> war dagegen lange je nach Screenreader wackelig, vor allem mit VoiceOver – also gezielt einsetzen und testen.</p>','<p>Built correctly, both approaches sound the same: arrow down and you hear “Graz, 2 of 5”. The difference shows in a combobox: the user types “Sa”, presses <kbd>↓</kbd>, hears “Salzburg, 1 of 1” – and can keep typing, because focus never left the input. With roving tabindex, focus would jump into the list and every further letter would go nowhere.</p><p>Where focus is allowed to move, roving tabindex is more robust: the browser scrolls by itself, <code>:focus</code> works, screen magnifiers follow real focus, and support is equally good everywhere. <code>aria-activedescendant</code>, on the other hand, was flaky for a long time depending on the screen reader, especially VoiceOver – so use it deliberately and test.</p>')
});

  init(root){
    const timers=new Set();
    const later=(fn,ms)=>{const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id};

  native:tx('Für den Fortschritt ja: <code>&lt;progress&gt;</code> ist ein nativer Fortschrittsbalken mit Rolle und Wert, ohne <code>value</code> ist er unbestimmt. Mit <code>&lt;label for&gt;</code> bekommt er seinen Namen. <code>role="progressbar"</code> brauchst du nur, wenn der Balken anders aussehen muss, als <code>&lt;progress&gt;</code> es zulässt, oder der Wert Worte braucht (<code>aria-valuetext</code>). Für „busy“ und die Ansagen gibt es kein natives Gegenstück – höchstens <code>&lt;output&gt;</code>, das implizit <code>role="status"</code> hat.','For progress, yes: <code>&lt;progress&gt;</code> is a native progress bar with role and value, and without <code>value</code> it’s indeterminate. A <code>&lt;label for&gt;</code> gives it its name. You only need <code>role="progressbar"</code> when the bar has to look different from what <code>&lt;progress&gt;</code> allows, or when the value needs words (<code>aria-valuetext</code>). For “busy” and the announcements there’s no native counterpart – at most <code>&lt;output&gt;</code>, which has an implicit <code>role="status"</code>.'),

  ng:tx('<p>Für die Ansagen nimm den <code>LiveAnnouncer</code> aus <code>@angular/cdk/a11y</code>. <code>aria-busy</code> bindest du mit <code>[attr.aria-busy]="loading()"</code> und setzt das Signal im RxJS-Operator <code>finalize()</code> zurück – so auch nach einem Fehler. Angular Material bringt <code>mat-progress-bar</code> und <code>mat-progress-spinner</code> mit; beide haben <code>role="progressbar"</code> und setzen <code>aria-valuenow</code> selbst (im Modus <code>indeterminate</code> nicht). Den Namen musst du ihnen aber mit <code>aria-label</code> geben – oder sie mit <code>aria-hidden="true"</code> verstecken, wenn eine Statusmeldung schon alles sagt.</p>','<p>For announcements use <code>LiveAnnouncer</code> from <code>@angular/cdk/a11y</code>. Bind <code>aria-busy</code> with <code>[attr.aria-busy]="loading()"</code> and reset the signal in the RxJS operator <code>finalize()</code> – so it also happens after an error. Angular Material ships <code>mat-progress-bar</code> and <code>mat-progress-spinner</code>; both have <code>role="progressbar"</code> and set <code>aria-valuenow</code> themselves (not in <code>indeterminate</code> mode). But you have to give them a name with <code>aria-label</code> – or hide them with <code>aria-hidden="true"</code> when a status message already says it all.</p>'),
  ngCode:`import { LiveAnnouncer } from '@angular/cdk/a11y';
import { MatProgressBar } from '@angular/material/progress-bar';
import { finalize } from 'rxjs';

@Component({
  selector: 'app-results',
  imports: [MatProgressBar],
  template: \`
    <button type="button" (click)="load()" [attr.aria-disabled]="loading()">Load results</button>
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading results" />
    }
    <ul [attr.aria-busy]="loading()">
      @for (r of results(); track r.id) { <li>{{ r.name }}</li> }
    </ul>
  \`,
})
export class Results {
  private readonly api = inject(SearchService);
  private readonly announcer = inject(LiveAnnouncer);
  protected readonly loading = signal(false);
  protected readonly results = signal<Result[]>([]);

  protected load() {
    if (this.loading()) return;
    this.loading.set(true);
    this.announcer.announce('Loading results …');
    this.api.search().pipe(finalize(() => this.loading.set(false))).subscribe({
      next: list => {
        this.results.set(list);
        this.announcer.announce(\`\${list.length} results loaded.\`);
      },
      error: () => this.announcer.announce('Loading failed. Please try again.'),
    });
  }
}`,
  why:tx('<p>Sehende sehen den Kreis drehen und die Liste erscheinen. Mit Screenreader passiert beim stummen Spinner: nichts. Man drückt „Ergebnisse laden“, hört keine Reaktion, drückt noch einmal – oder der Fokus landet nach <code>disabled</code> irgendwo am Seitenanfang. Mit Statusregion hört man „Wird geladen …“ und kurz darauf „12 Ergebnisse geladen.“, während der Fokus ruhig auf dem Button bleibt. Beim Upload sagt der Balken „Fotos, Fortschrittsbalken, 3 von 12 Fotos“ statt einer nackten Zahl.</p><p><code>aria-busy</code> ist die Bitte an den Screenreader, einen halbfertigen Bereich nicht Stück für Stück zu melden – wichtig vor allem bei Live-Regionen, die sonst jedes eingefügte Element einzeln ansagen würden. Die Unterstützung ist aber uneinheitlich. Darum ist die Statusmeldung Pflicht und <code>aria-busy</code> die Ergänzung – niemals umgekehrt.</p>','<p>Sighted users see the circle spin and the list appear. With a screen reader, the silent spinner means: nothing. You press “Load results”, hear no reaction, press again – or focus ends up somewhere at the top of the page after <code>disabled</code>. With a status region you hear “Loading …” and shortly after “12 results loaded.”, while focus stays calmly on the button. During the upload the bar says “Photos, progress bar, 3 of 12 photos” instead of a bare number.</p><p><code>aria-busy</code> asks the screen reader not to report a half-finished area piece by piece – mostly relevant for live regions, which would otherwise announce every inserted item on its own. Support is inconsistent, though. So the status message is mandatory and <code>aria-busy</code> the supplement – never the other way round.</p>')
});

    const say=msg=>{clearTimeout(timer);st.textContent='';if(msg)timer=setTimeout(()=>{st.textContent=msg},450)};
    const countMsg=()=>{const n=shown.length;return n?tx(`${n} ${n===1?'Vorschlag':'Vorschläge'} verfügbar. Mit Pfeil nach unten auswählen.`,`${n} ${n===1?'suggestion':'suggestions'} available. Use the down arrow to choose.`):tx('Keine Treffer.','No results.')};
    const setExpanded=v=>{list.hidden=!v;inp.setAttribute('aria-expanded',String(v));btn.setAttribute('aria-expanded',String(v))};
    const setActive=i=>{
      active=i;
      [...list.children].forEach((o,j)=>{if(j===i)o.setAttribute('aria-selected','true');else o.removeAttribute('aria-selected')});
      if(i<0){inp.removeAttribute('aria-activedescendant');return}
      const o=list.children[i];inp.setAttribute('aria-activedescendant',o.id);o.scrollIntoView({block:'nearest'});
    };
    const render=()=>{
      const q=norm(inp.value.trim());
      shown=q?items.filter(x=>norm(x.city).startsWith(q)||norm(x.country).startsWith(q)):items;
      list.innerHTML=shown.map(x=>`<li role="option" id="${x.id}" class="combobox-opt">${esc(x.city)}<span class="combobox-country">, ${esc(x.country)}</span></li>`).join('');
      setActive(-1);
    };
    const open=()=>{render();setExpanded(shown.length>0);say(countMsg())};
    const close=()=>{setActive(-1);setExpanded(false);clearTimeout(timer);st.textContent=''};
    const pick=i=>{const x=shown[i];if(!x)return;inp.value=x.city;close()};
    inp.addEventListener('input',()=>{if(inp.value.trim())open();else close()});
    inp.addEventListener('keydown',e=>{
      const isOpen=!list.hidden,n=shown.length;
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        if(!isOpen){open();if(!e.altKey&&shown.length)setActive(e.key==='ArrowDown'?0:shown.length-1);return}
        if(e.key==='ArrowDown')setActive(active>=n-1?0:active+1);else setActive(active<=0?n-1:active-1);
      }else if(e.key==='Enter'){
        if(isOpen&&active>=0){e.preventDefault();pick(active)}
      }else if(e.key==='Escape'){
        if(isOpen){e.preventDefault();close()}
        else if(inp.value){e.preventDefault();inp.value='';say('')}
      }
    });
    /* mousedown abfangen: Der Klick auf Liste oder Pfeil soll den Fokus nicht aus dem Feld nehmen */
    list.addEventListener('mousedown',e=>e.preventDefault());
    list.addEventListener('click',e=>{const o=e.target.closest('[role="option"]');if(o)pick([...list.children].indexOf(o))});
    btn.addEventListener('mousedown',e=>e.preventDefault());
    btn.addEventListener('click',()=>{if(list.hidden){inp.focus();open()}else close()});
    inp.addEventListener('blur',close);
    const outside=e=>{if(!wrap.contains(e.target)&&!list.hidden)close()};
    document.addEventListener('pointerdown',outside);
    return()=>{document.removeEventListener('pointerdown',outside);clearTimeout(timer)};
  },

    note:tx('Dazu ein <code>keydown</code>-Handler am Feld: <kbd>↓</kbd>/<kbd>↑</kbd> setzen <code>aria-activedescendant</code> und <code>aria-selected</code> um, <kbd>Enter</kbd> übernimmt, <kbd>Esc</kbd> schließt und setzt <code>aria-expanded="false"</code>. Der Fokus verlässt das Feld nie.','Plus a <code>keydown</code> handler on the field: <kbd>↓</kbd>/<kbd>↑</kbd> move <code>aria-activedescendant</code> and <code>aria-selected</code>, <kbd>Enter</kbd> picks, <kbd>Esc</kbd> closes and sets <code>aria-expanded="false"</code>. Focus never leaves the field.')},
  native:tx('Oft ja. Muss aus einer festen, überschaubaren Liste gewählt werden, nimm <code>&lt;select&gt;</code>: voll zugänglich, auf dem Handy mit dem Auswahlrad des Systems – nur Tippen zum Filtern geht nicht (bloß Springen per Anfangsbuchstabe). Für freie Eingabe mit Vorschlägen gibt es <code>&lt;input list&gt;</code> + <code>&lt;datalist&gt;</code>: eine echte, native Combobox ohne eine Zeile Skript. Der Haken: Die Liste lässt sich kaum gestalten, jeder Browser filtert anders, und die Screenreader-Unterstützung schwankt je nach Kombination. Eine eigene ARIA-Combobox lohnt sich erst, wenn du gestaltete Optionen, eigene Filterlogik oder Daten vom Server brauchst – dann aber das ganze Muster, nicht nur die Rolle.','Often, yes. If people must pick from a fixed, manageable list, use <code>&lt;select&gt;</code>: fully accessible, with the system picker on phones – you just can’t type to filter (only jump by first letter). For free input with suggestions there’s <code>&lt;input list&gt;</code> + <code>&lt;datalist&gt;</code>: a real, native combobox without a line of script. The catch: the list can barely be styled, every browser filters differently, and screen reader support varies by combination. A custom ARIA combobox is only worth it when you need styled options, your own filter logic or server data – and then the whole pattern, not just the role.'),
  do:tx([
    'Den echten Fokus im Eingabefeld lassen und die markierte Option über <code>aria-activedescendant</code> melden – ohne Markierung das Attribut entfernen.',
    '<code>aria-expanded</code> und <code>hidden</code> der Liste immer gemeinsam umschalten.',
    'Die Trefferzahl über eine Live-Region ansagen, die schon vorher im DOM steht – leicht verzögert, damit nicht jeder Tastendruck eine Meldung auslöst.',

  ],[
    'Keep real focus in the input and report the highlighted option via <code>aria-activedescendant</code> – remove the attribute when nothing is highlighted.',
    'Always switch the list’s <code>aria-expanded</code> and <code>hidden</code> together.',

  dont:tx([
    'Das ARIA-1.1-Muster: <code>role="combobox"</code> auf einem <code>&lt;div&gt;</code>, darin ein <code>textbox</code>. Das ist veraltet.',
    'Mit <kbd>↓</kbd> den echten Fokus in die Liste verschieben – dann ist Weitertippen unmöglich und der Screenreader verlässt das Feld.',

  ],[
    'The ARIA 1.1 pattern: <code>role="combobox"</code> on a <code>&lt;div&gt;</code> with a <code>textbox</code> inside. That’s outdated.',
    'Moving real focus into the list on <kbd>↓</kbd> – then typing on is impossible and the screen reader leaves the field.',
    'Letting <code>aria-activedescendant</code> point to an ID that no longer exists after re-rendering the list, or is hidden.',
    'Writing the first match into the field automatically while typing, or ignoring <kbd>Esc</kbd>.'

  ng:tx('<p>Angular Material bringt mit <code>mat-autocomplete</code> und der Direktive <code>[matAutocomplete]</code> am Eingabefeld eine fertige Combobox: <code>role="combobox"</code>, <code>aria-expanded</code>, <code>aria-controls</code>, <code>aria-autocomplete</code> und <code>aria-activedescendant</code> setzt sie selbst. Baust du selbst, übernimmt <code>ActiveDescendantKeyManager</code> aus <code>@angular/cdk/a11y</code> die Pfeiltasten – deine Optionen implementieren dafür <code>Highlightable</code>. Die Trefferzahl sagst du mit dem <code>LiveAnnouncer</code> an. <code>[attr.aria-activedescendant]</code> auf <code>null</code> zu setzen entfernt das Attribut – genau richtig, wenn nichts markiert ist.</p>','<p>Angular Material ships a ready-made combobox with <code>mat-autocomplete</code> and the <code>[matAutocomplete]</code> directive on the input: it sets <code>role="combobox"</code>, <code>aria-expanded</code>, <code>aria-controls</code>, <code>aria-autocomplete</code> and <code>aria-activedescendant</code> itself. If you build your own, <code>ActiveDescendantKeyManager</code> from <code>@angular/cdk/a11y</code> handles the arrow keys – your options implement <code>Highlightable</code> for it. Announce the result count with the <code>LiveAnnouncer</code>. Setting <code>[attr.aria-activedescendant]</code> to <code>null</code> removes the attribute – exactly right when nothing is highlighted.</p>'),
  ngCode:`@Component({
  selector: 'app-city-combobox',
  template: \`
    <label for="dest" id="dest-label">Destination</label>
    <input id="dest" type="text" role="combobox" autocomplete="off"
           aria-autocomplete="list" aria-controls="dest-list"
           [attr.aria-expanded]="expanded()"
           [attr.aria-activedescendant]="active() >= 0 ? 'dest-o' + active() : null"
           [value]="query()" (input)="onInput($event)" (keydown)="onKey($event)" (blur)="close()" />
    <ul id="dest-list" role="listbox" aria-labelledby="dest-label"
        [hidden]="!expanded()" (mousedown)="$event.preventDefault()">
      @for (city of matches(); track city; let i = $index) {
        <li role="option" [id]="'dest-o' + i" [attr.aria-selected]="i === active() || null"
            (click)="pick(city)">{{ city }}</li>
      }
    </ul>
    <p role="status">{{ status() }}</p>
  \`,
})
export class CityCombobox {
  readonly cities = input.required<string[]>();
  protected readonly query = signal('');
  protected readonly open = signal(false);
  protected readonly active = signal(-1);
  protected readonly matches = computed(() => {
    const q = this.query().trim().toLowerCase();
    return this.cities().filter(c => c.toLowerCase().startsWith(q));
  });
  protected readonly expanded = computed(() => this.open() && this.matches().length > 0);
  protected readonly status = computed(() => !this.open() ? ''
    : this.matches().length ? \`\${this.matches().length} suggestions available.\` : 'No results.');

  protected onInput(e: Event) {
    this.query.set((e.target as HTMLInputElement).value);
    this.active.set(-1);
    this.open.set(this.query().trim() !== '');
  }
  protected onKey(e: KeyboardEvent) {
    const n = this.matches().length, i = this.active();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.open.set(true);
      if (n) this.active.set(e.key === 'ArrowDown' ? (i + 1) % n : (i <= 0 ? n - 1 : i - 1));
    } else if (e.key === 'Enter' && this.expanded() && i >= 0) {
      e.preventDefault();
      this.pick(this.matches()[i]);
    } else if (e.key === 'Escape') {
      this.close();
    }
  }
  protected pick(city: string) { this.query.set(city); this.close(); }
  protected close() { this.open.set(false); this.active.set(-1); }
}`,
  why:tx('<p>Ohne das Muster ist das Suchfeld für den Screenreader nur ein „Eingabefeld“. Dass darunter Vorschläge aufgetaucht sind, wie viele und welcher gerade markiert ist, erfährt man nicht – die Liste existiert nur fürs Auge. Mit dem Muster hört man „Reiseziel, Kombinationsfeld, reduziert“, nach dem Tippen von „W“ die Meldung „3 Vorschläge verfügbar“ und bei <kbd>↓</kbd> „Wien, Österreich, 1 von 3“.</p><p>Der Kniff ist <code>aria-activedescendant</code>: Der echte Fokus bleibt im Eingabefeld, damit man weitertippen, korrigieren und den Cursor bewegen kann. Das Attribut sagt dem Screenreader nur, welche Option gerade als „virtuell fokussiert“ gilt – und er liest sie vor, als hätte sie selbst den Fokus.</p>','<p>Without the pattern the search field is just an “edit” to the screen reader. That suggestions appeared below it, how many, and which one is highlighted – you never find out; the list only exists for the eye. With the pattern you hear “Destination, combo box, collapsed”, after typing “M” the message “2 suggestions available”, and on <kbd>↓</kbd> “Munich, Germany, 1 of 2”.</p><p>The trick is <code>aria-activedescendant</code>: real focus stays in the input so you can keep typing, correct and move the cursor. The attribute only tells the screen reader which option counts as “virtually focused” – and it reads that option as if it had focus itself.</p>')
});

LESSONS.push({
  id:'current',cat:'states',
  title:tx('Wo bin ich? aria-current','Where am I? aria-current'),
  short:tx('Markiert das aktuelle Element einer Reihe: Seite, Schritt, Datum.','Marks the current item in a set: page, step, date.'),
  keys:'aria-current current page step location date time aktuell aktuelle seite navigation menü breadcrumb brotkrümel stepper schritt kalender active aria-selected routerlinkactive',
  refs:['WAI-ARIA 1.2: aria-current','APG: Breadcrumb','WCAG 1.3.1','WCAG 2.4.8'],
  rule:tx('<code>aria-current</code> sagt, welches Element einer Reihe dem Ort entspricht, an dem man gerade ist: die aktuelle Seite im Menü, der aktuelle Schritt im Bestellvorgang, das heutige Datum im Kalender. Es steht auf genau <strong>einem</strong> Element der Reihe – und ersetzt die Klasse <code>.active</code>, statt neben ihr herzulaufen.','<code>aria-current</code> says which item in a set matches where you are right now: the current page in the menu, the current step in checkout, today’s date in a calendar. It sits on exactly <strong>one</strong> item of the set – and replaces the <code>.active</code> class instead of running alongside it.'),
  attrs:[

    ['aria-current="location"','',tx('Die aktuelle Position in einer Grafik oder einem Ablaufdiagramm – „Sie sind hier“ auf einem Plan.','The current position in a graphic or flow chart – “you are here” on a map.')],

  ],
  demo:`<div class="current-grid">
  <div class="current-block">

  </div>

<p class="demo-note">${tx('Klick im Menü oder im Brotkrümelpfad – die Links führen nirgends hin – und blättere mit „Weiter“ durch den Bestellvorgang. Mit „ARIA zeigen“ siehst du <code>aria-current</code> wandern. Das Styling folgt von selbst: Es hängt nur an <code>[aria-current]</code>, an keiner Klasse.','Click in the menu or the breadcrumb – the links go nowhere – and step through checkout with “Next”. With “Show ARIA” you see <code>aria-current</code> move. The styling follows by itself: it hangs only on <code>[aria-current]</code>, not on any class.')}</p>`,
  init(root){
    const P={start:tx('Start','Home'),brot:tx('Brot','Bread'),gebaeck:tx('Gebäck','Pastries'),torten:tx('Torten','Cakes')};
    const crumbs=$('#current-crumbs',root);
    const go=(id,from)=>{
      $$('.current-nav a',root).forEach(a=>{if(a.dataset.page===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
      const path=id==='start'?['start']:['start',id];
      crumbs.innerHTML=path.map((p,i)=>`<li><a href="#" data-page="${p}"${i===path.length-1?' aria-current="page"':''}>${P[p]}</a></li>`).join('');
      if(from&&!from.isConnected)$(`a[data-page="${id}"]`,crumbs)?.focus();
      announce(tx(`Seite „${P[id]}“ geöffnet.`,`Opened page “${P[id]}”.`));
    };
    root.addEventListener('click',e=>{const a=e.target.closest('a[data-page]');if(!a)return;e.preventDefault();go(a.dataset.page,a)});
    const steps=$$('#current-steps li',root),prev=$('#current-prev',root),next=$('#current-next',root);let cur=0;
    const step=(i,say)=>{
      cur=i;

        if(k===i)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');
        $('.current-done-t',li).textContent=k<i?tx(', erledigt',', done'):'';
      });
      prev.setAttribute('aria-disabled',String(i===0));

    };
    prev.addEventListener('click',()=>{if(cur>0)step(cur-1,true)});

    step(0,false);
  },
  css:`.current-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px;align-items:start}
